<!DOCTYPE html>
<!-- Athleticism — local workout tracker. Single file, no build step. See chat for save/open instructions. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:,">
<title>Athleticism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F0F1F4; --border:#E1E3E8;
  --text:#1B1D22; --text-dim:#666B74; --text-faint:#9AA0A8;
  --accent:#D2451F; --accent-hover:#B93B19; --accent-soft:#FBE7E0; --accent-soft-border:#F3C7B7;
  --good:#2F9E56; --good-soft:#E4F5E9; --danger:#D33B3B;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-md:0 8px 24px rgba(20,20,25,0.10);
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;color:inherit;font-size:14px;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);}
.topbar-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:28px;padding:14px 24px;}
.brand{font-family:var(--font-mono);font-weight:600;font-size:15px;letter-spacing:0.3px;flex-shrink:0;}
.brand span{color:var(--accent);}
.tabs{display:flex;gap:4px;flex:1;}
.tab-btn{background:none;border:none;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-dim);transition:background .15s ease,color .15s ease;}
.tab-btn:hover{background:var(--surface-2);color:var(--text);}
.tab-btn.active{color:var(--text);background:var(--surface-2);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.inprogress-pill{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-hover);border:1px solid var(--accent-soft-border);border-radius:20px;padding:6px 12px 6px 10px;font-size:13px;font-weight:600;font-family:var(--font-mono);white-space:nowrap;}
.inprogress-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.icon-btn{background:none;border:none;color:var(--text-dim);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;flex-shrink:0;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn:disabled{opacity:.35;cursor:default;}
.icon-btn:disabled:hover{background:none;color:var(--text-dim);}

/* Layout */
.main{max-width:1080px;margin:0 auto;padding:32px 24px 90px;}
.section-title{font-size:15px;font-weight:600;color:var(--text);margin:32px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.section-title:first-child{margin-top:0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;transition:background .15s ease,border-color .15s ease,color .15s ease;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-faint);cursor:not-allowed;}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-dim);}
.btn-danger{background:var(--danger) !important;color:#fff !important;border-color:var(--danger) !important;}
.btn-tag{background:var(--surface-2);border:1px solid var(--border);padding:7px 12px;font-size:13px;font-weight:500;}
.btn-tag:hover{border-color:var(--accent);}
.btn-tag:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{padding:6px 12px;font-size:13px;}
.full-width{width:100%;justify-content:center;}
.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;margin-bottom:14px;}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-label{font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px;display:block;}
.field-optional{font-weight:400;color:var(--text-faint);}
.empty-hint{font-size:13px;color:var(--text-faint);padding:6px 2px;}

/* Chips */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 6px 6px 12px;font-size:13px;}
.chip button{background:none;border:none;color:var(--text-faint);display:flex;}
.chip button:hover{color:var(--danger);}
.preset-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.custom-field-form{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:14px;}
.row-gap{display:flex;gap:10px;margin-bottom:12px;}
.badge{font-size:11px;padding:3px 9px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;color:var(--text-dim);white-space:nowrap;}

/* Empty state */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-dim);}
.empty-state p{margin:0 0 6px;}
.empty-sub{font-size:13.5px;color:var(--text-faint);margin-bottom:18px !important;}

/* Home */
.cta-card{display:flex;justify-content:space-between;align-items:center;background:var(--text);color:#fff;border-radius:var(--radius-lg);padding:26px 28px;margin-bottom:28px;gap:16px;}
.cta-card.active{background:var(--surface);color:var(--text);border:1px solid var(--accent);}
.cta-eyebrow{font-size:13px;opacity:.7;margin-bottom:4px;}
.cta-title{font-size:24px;font-weight:600;}
.cta-card > button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px 22px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background .15s ease;flex-shrink:0;}
.cta-card > button:hover{background:var(--accent-hover);}
.cta-card.active > button{background:var(--surface-2);color:var(--text);}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px;text-align:center;}
.stat-num{font-family:var(--font-mono);font-size:30px;font-weight:600;}
.stat-lbl{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;text-align:left;transition:border-color .15s ease,transform .15s ease;}
.plan-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.plan-card-name{font-weight:600;margin-bottom:4px;}
.plan-card-sub{font-size:12.5px;color:var(--text-dim);}

/* Master-detail */
.split{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
.split-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.split-list-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px;}
.split-list-head h2{font-size:16px;margin:0;}
.split-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);font-size:14px;transition:background .15s ease;width:100%;text-align:left;background:none;border-left:3px solid transparent;}
.split-item:hover{background:var(--surface-2);}
.split-item.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600;}
.split-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;min-height:320px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 16px 12px;}
.search-box input{border:none;background:none;flex:1;font-size:13.5px;min-width:0;}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:8px;transition:background .15s ease;cursor:pointer;background:none;border:none;width:100%;text-align:left;}
.result-row:hover{background:var(--surface-2);}
.result-row-name{font-weight:600;font-size:14px;}
.result-row-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
.back-link{display:none;align-items:center;gap:4px;color:var(--text-dim);font-size:13px;background:none;border:none;margin-bottom:14px;text-decoration:none;cursor:pointer;padding:0;}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
@media (max-width:760px){
  .split{grid-template-columns:1fr;}
  .split:not(.has-selection) .split-detail{display:none;}
  .split.has-selection .split-list{display:none;}
  .back-link.mobile-only{display:inline-flex;}
}

/* Plan rows */
.plan-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.plan-row:last-of-type{border-bottom:none;}
.plan-row-order{display:flex;flex-direction:column;}
.plan-row-order button{background:none;border:none;color:var(--text-faint);padding:1px;}
.plan-row-order button:hover{color:var(--text);}
.plan-row-order button:disabled{opacity:.3;}
.plan-row-main{flex:1;min-width:0;}
.plan-row-name{font-weight:600;font-size:14.5px;}
.plan-row-sub{font-size:12.5px;color:var(--text-dim);}
.stepper{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:20px;padding:4px 12px;flex-shrink:0;}
.stepper button{background:none;border:none;color:var(--text-dim);font-size:15px;line-height:1;}
.stepper button:hover{color:var(--text);}
.stepper span{font-family:var(--font-mono);font-weight:600;min-width:14px;text-align:center;}

/* Titled input (plan/workout name) */
.title-input{border:none;background:none;padding:2px 4px;border-radius:6px;min-width:0;font-family:inherit;}
.title-input:hover,.title-input:focus{background:var(--surface-2);outline:none;}

/* Active workout */
.workout-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:16px;flex-wrap:wrap;}
.workout-head-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.workout-head-left .title-input{font-size:22px;font-weight:600;flex:1;min-width:80px;}
.workout-head-right{display:flex;align-items:center;gap:14px;}
.workout-meta{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);white-space:nowrap;}
.workout-progress{font-size:13px;color:var(--text-dim);margin-bottom:24px;}

.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:18px;overflow-x:auto;}
.ex-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;}
.ex-card-name{font-weight:600;font-size:16px;margin-bottom:4px;}
.ex-default-rest{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.ex-default-rest button{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:0;}
.ex-default-rest input{width:60px;font-family:var(--font-mono);font-size:12.5px;padding:4px 6px;border:1px solid var(--border);border-radius:5px;}

.set-table{width:100%;border-collapse:collapse;min-width:420px;}
.set-table th{font-size:11.5px;color:var(--text-faint);font-weight:600;text-align:center;padding:0 6px 8px;white-space:nowrap;}
.set-table th:first-child{text-align:left;width:26px;}
.set-table td{padding:5px 6px;text-align:center;vertical-align:middle;}
.set-table td:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:13px;}
.num-input{width:100%;min-width:64px;max-width:100px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 6px;font-family:var(--font-mono);font-size:14px;}
.num-input::placeholder{color:var(--text-faint);}
.num-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.rest-cell{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap;}
.rest-pill{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px 9px;white-space:nowrap;}
.rest-pill.custom{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-hover);}
.rest-add{font-size:12px;color:var(--accent);background:none;border:none;font-weight:600;white-space:nowrap;padding:0;}
.rest-icon-btn{width:24px;height:24px;border-radius:6px;background:none;border:none;color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.rest-icon-btn:hover{background:var(--surface-2);color:var(--text);}
.check-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;}
.check-btn:hover{border-color:var(--text-dim);}
.check-btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good);}
.rest-card{background:var(--surface-2);border-style:dashed;display:flex;align-items:center;justify-content:center;padding:14px;}
.rest-block-row td{background:var(--surface-2);}
.rest-block-row td:first-child{border-radius:6px 0 0 6px;}
.rest-block-row td:last-child{border-radius:0 6px 6px 0;}
.plan-ex-head-left{display:flex;align-items:flex-start;gap:10px;min-width:0;}
.plan-ex-order{display:flex;flex-direction:column;padding-top:3px;flex-shrink:0;}
.plan-ex-order button{background:none;border:none;color:var(--text-faint);padding:1px;}
.plan-ex-order button:hover{color:var(--text);}
.plan-ex-order button:disabled{opacity:.3;}
.measured-cell{background:var(--surface-2) !important;color:var(--text-faint) !important;cursor:not-allowed;font-style:italic;}
.toggle-row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;transition:border-color .15s ease,background .15s ease;}
.toggle-row:hover{border-color:var(--text-dim);background:var(--surface-2);}
.toggle-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;color:#fff;}
.toggle-box.on{background:var(--accent);border-color:var(--accent);}
.toggle-text{display:flex;flex-direction:column;gap:3px;min-width:0;}
.toggle-title{font-weight:600;font-size:14px;}
.toggle-sub{font-size:12.5px;color:var(--text-dim);line-height:1.4;}

/* Categories */
.cat-header{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:18px 0 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);}
.cat-header:first-child{margin-top:0;}
.cat-caret{background:none;border:none;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;padding:2px;border-radius:5px;transition:transform .15s ease;flex-shrink:0;}
.cat-caret:hover{color:var(--text);}
.cat-caret.collapsed{transform:rotate(-90deg);}
.cat-name{flex:1;min-width:0;background:none;border:none;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:4px 6px;border-radius:6px;}
.cat-name:hover,.cat-name:focus{background:var(--surface);outline:none;}
.cat-title{flex:1;min-width:0;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.cat-count{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);flex-shrink:0;}
.cat-header.workout{background:none;border:none;border-bottom:2px solid var(--border);border-radius:0;padding:6px 2px;margin:26px 0 12px;}
.cat-header.workout.complete{border-bottom-color:var(--good);}
.cat-header.workout.complete .cat-title,.cat-header.workout.complete .cat-count{color:var(--good);}
.cat-header.workout.static{margin:22px 0 10px;}
.ex-card.in-category{margin-left:14px;}
@media (max-width:640px){ .ex-card.in-category{margin-left:8px;} }

/* Drag and drop */
.drag-handle{background:none;border:none;color:var(--text-faint);padding:4px 2px;display:inline-flex;align-items:center;cursor:grab;touch-action:none;flex-shrink:0;}
.drag-handle:hover{color:var(--text);}
body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none;}
body.is-dragging .drag-handle{cursor:grabbing;}
.dragging{opacity:.45;}
.drop-before{box-shadow:0 -3px 0 -1px var(--accent);}
.drop-zone-end{height:10px;}
.drop-zone-end.drop-after{box-shadow:0 -3px 0 -1px var(--accent);}

/* Landing strip for dropping an exercise out of a category downwards.
   Sits flush-left, unlike the indented cards above it, so the drop
   position alone shows it lands outside. Only visible while dragging. */
.cat-exit-zone{height:0;opacity:0;border:0 dashed transparent;border-radius:var(--radius-md);
  margin:0;transition:height .13s ease,opacity .13s ease,margin .13s ease;}
body.dragging-exercise .cat-exit-zone{height:26px;opacity:1;margin:4px 0 12px;border-width:1px;border-color:var(--border);}
body.dragging-exercise .cat-exit-zone.exit-active{border-color:var(--accent);border-style:solid;background:var(--accent-soft);}

/* Timer bar */
.timerbar{position:fixed;left:0;right:0;bottom:0;background:var(--text);color:#fff;z-index:40;display:flex;justify-content:center;box-shadow:0 -8px 24px rgba(0,0,0,.14);transform:translateY(100%);transition:transform .25s ease;}
.timerbar.show{transform:translateY(0);}
.timerbar.done{background:var(--good);}
.timerbar-inner{max-width:1080px;width:100%;display:flex;align-items:center;gap:16px;padding:14px 24px;}
.timerbar-label{font-size:13px;opacity:.8;flex-shrink:0;}
.timerbar-time{font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;flex:1;}
.timerbar-inner button{background:rgba(255,255,255,.16);border:none;color:#fff;min-width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-weight:600;font-size:13px;}
.timerbar-inner button:hover{background:rgba(255,255,255,.28);}

/* Heatmap */
.heatmap-wrap{overflow-x:auto;padding-bottom:4px;}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;width:max-content;}
.heatmap-cell{width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:none;padding:0;cursor:default;}
button.heatmap-cell{cursor:pointer;}
button.heatmap-cell:hover{outline:1.5px solid var(--text-dim);outline-offset:1px;}
.heatmap-cell[data-level="1"]{background:#F3CBBB;}
.heatmap-cell[data-level="2"]{background:#E89A79;}
.heatmap-cell[data-level="3"]{background:#DE6B41;}
.heatmap-cell[data-level="4"]{background:var(--accent);}
.heatmap-cell.today{box-shadow:inset 0 0 0 1.5px var(--text);}
.heatmap-cell.selected{box-shadow:inset 0 0 0 2px var(--accent);}
.heatmap-legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-faint);margin-top:10px;justify-content:flex-end;}
.heatmap-legend .heatmap-cell{width:11px;height:11px;}

/* History */
.history-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);margin-bottom:8px;transition:border-color .15s ease;cursor:pointer;width:100%;text-align:left;}
.history-row:hover{border-color:var(--text-dim);}
.history-row-name{font-weight:600;font-size:14.5px;}
.history-row-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,25,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-overlay[hidden]{display:none;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{margin:0;font-size:17px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.segmented{display:flex;background:var(--surface-2);border-radius:20px;padding:3px;}
.segmented button{border:none;background:none;padding:6px 16px;border-radius:16px;font-size:13px;font-weight:600;color:var(--text-dim);}
.segmented button.active{background:var(--accent);color:#fff;}
.settings-row-text{display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:12px;}
.settings-row-sub{font-size:12px;color:var(--text-dim);line-height:1.4;}
.settings-section-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin:22px 0 8px;}
.settings-note{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:10px;}
.settings-stat{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:12px;}
.settings-msg{font-size:12.5px;line-height:1.45;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;}
.settings-msg.ok{background:var(--good-soft);color:#1F6B3A;}
.settings-msg.error{background:#FBE7E7;color:#96262A;}
.import-confirm{border:1px solid var(--accent-soft-border);background:var(--accent-soft);border-radius:var(--radius-md);padding:14px;margin-bottom:12px;}
.import-confirm-title{font-weight:700;font-size:14px;margin-bottom:10px;}
.import-confirm-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:4px 0;color:var(--text-dim);}
.import-confirm-row span:last-child{color:var(--text);text-align:right;}
.import-confirm-warn{font-size:12px;color:#96262A;margin-top:10px;line-height:1.45;}
.settings-row-actions{display:flex;gap:8px;flex-shrink:0;}

/* Profile */
.avatar-btn{background:none;border:none;padding:0;width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--border);transition:box-shadow .15s ease;}
.avatar-btn:hover{box-shadow:0 0 0 2px var(--text-dim);}
.avatar-btn.active{box-shadow:0 0 0 2px var(--accent);}
.avatar-img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-initials{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.3px;}
.avatar-initials.empty{background:var(--surface-2);color:var(--text-faint);}
.avatar-img.lg,.avatar-initials.lg{width:88px;height:88px;font-size:30px;}
.home-greeting{font-size:14px;color:var(--text-dim);margin-bottom:14px;}
.profile-head{display:flex;align-items:center;gap:18px;margin:20px 0 16px;}
.profile-avatar{position:relative;background:none;border:none;padding:0;width:88px;height:88px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--border);}
.profile-avatar:hover .profile-avatar-overlay{opacity:1;}
.profile-avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(20,20,25,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s ease;}
.profile-head-text{min-width:0;}
.profile-name{font-size:24px;font-weight:700;line-height:1.2;}
.profile-handle{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);margin-top:3px;}
.profile-since{font-size:12.5px;color:var(--text-faint);margin-top:6px;}
.profile-avatar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.profile-avatar-size{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);}
.profile-note{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin:18px 0 14px;}

/* Cropper */
.cropper-modal{max-width:360px;}
.crop-stage{position:relative;margin:4px auto 0;border-radius:var(--radius-md);overflow:hidden;background:var(--surface-2);touch-action:none;}
.crop-stage canvas{display:block;cursor:grab;touch-action:none;}
.crop-stage canvas:active{cursor:grabbing;}
.crop-mask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 9999px rgba(20,20,25,.55);pointer-events:none;}
.crop-mask::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);}
.crop-hint{text-align:center;font-size:12.5px;color:var(--text-dim);margin:12px 0 8px;}
.crop-zoom-row{display:flex;align-items:center;gap:10px;}
.crop-zoom-row input[type=range]{flex:1;accent-color:var(--accent);}
@media (max-width:640px){
  .cropper-modal{max-width:100%;}
}
@media (max-width:640px){
  .profile-head{gap:14px;}
  .avatar-img.lg,.avatar-initials.lg,.profile-avatar{width:68px;height:68px;}
  .avatar-initials.lg{font-size:24px;}
  .profile-name{font-size:20px;}
}
.import-mode{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.import-mode-btn{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;transition:border-color .15s ease;}
.import-mode-btn:hover{border-color:var(--accent);}
.import-mode-btn.danger:hover{border-color:var(--danger);}
.import-mode-title{font-weight:700;font-size:14px;}
.import-mode-btn.danger .import-mode-title{color:var(--danger);}
.import-mode-sub{font-size:12px;color:var(--text-dim);line-height:1.4;}
.backup-nudge{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent-soft-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:20px;}
.backup-nudge-text{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.backup-nudge-text strong{font-size:14px;}
.backup-nudge-text span{font-size:12.5px;color:var(--text-dim);line-height:1.4;}
.backup-nudge-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
@media (max-width:640px){
  .backup-nudge{flex-direction:column;align-items:stretch;}
  .backup-nudge-actions{justify-content:space-between;}
  .settings-row-actions{flex-direction:column;}
}

@media (max-width:640px){
  .topbar-inner{padding:12px 14px;gap:10px;}
  .brand{font-size:11px;letter-spacing:0;}
  .tabs{gap:2px;}
  .tab-btn{padding:7px 9px;font-size:12.5px;}
  .main{padding:20px 14px 110px;}
  .stat-card{padding:12px;}
  .stat-num{font-size:22px;}
  .cta-card{flex-direction:column;align-items:flex-start;padding:20px;}
  .cta-card > button{width:100%;justify-content:center;}
  .split-detail{padding:16px;}
  .num-input{max-width:72px;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">ATHLETIC<span>ISM</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="home">Home</button>
      <button class="tab-btn" data-tab="plans">Plans</button>
      <button class="tab-btn" data-tab="exercises">Exercises</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>
    <div class="topbar-right">
      <button id="inprogress-btn" class="inprogress-pill" data-action="resume-workout" hidden></button>
      <button class="icon-btn" data-action="settings-open" title="Settings"></button>
      <button id="avatar-btn" class="avatar-btn" data-action="open-profile" title="Profile"></button>
    </div>
  </div>
</header>

<main class="main" id="main"></main>

<div class="timerbar" id="timerbar"></div>

<div class="modal-overlay" id="settings-modal" hidden></div>
<div class="modal-overlay" id="finish-modal" hidden></div>
<div class="modal-overlay" id="restore-modal" hidden></div>
<div class="modal-overlay" id="cropper-modal" hidden></div>
<div class="modal-overlay" id="exercise-modal" hidden></div>

<script>
(function(){
"use strict";

/* =========================================================================
   DATA MODEL
   exercises: [{ id, name, tag, fields:[{id,type,label,unit}], defaultRestSec }]
   plans:     [{ id, name, items:[{ exerciseId, targetSets }] }]
   workouts:  [{ id, planId, name, date, startedAt, completedAt,
                 exercises:[{ exerciseId, name, fields:[snapshot], defaultRestSec,
                              sets:[{ id, values:{fieldId:val}, restSec, done }] }] }]
   activeWorkout: same shape as a workout entry, completedAt=null, or null
   settings:  { weightUnit: 'lb'|'kg' }
   Fields/defaultRestSec are SNAPSHOTTED onto workouts so editing a library
   exercise later never changes historical logs.
   Persisted as one JSON blob in localStorage under STORAGE_KEY.
   ========================================================================= */

var STORAGE_KEY = 'athleticism_data_v1';
var LEGACY_STORAGE_KEY = 'ironlog_data_v1';
var BACKUP_FORMAT = 1;
var EMBED_ID = 'embedded-backup';
var KG_PER_LB = 0.45359237;
var FIELD_TYPE_NAMES = {weight:'Weight', assisted:'Assisted', reps:'Reps', timer:'Target Time', time:'Measured Time', number:'Number', text:'Text'};

var ICONS = {
  plus:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  chevronRight:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  chevronLeft:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  chevronUp:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>',
  chevronDown:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
  settings:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  grip:'<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  user:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  camera:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  folder:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>'
};
function icon(name){ return ICONS[name] || ''; }

/* ------------------------------------------------------------- utils */

function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return toLocalISO(new Date()); }
function parseISO(iso){ var p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function fmtHeaderDate(iso){ return parseISO(iso).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); }
function fmtShortDate(iso){ return parseISO(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtElapsed(ms){
  var totalSec = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h>0 ? (h+':'+pad2(m)+':'+pad2(s)) : (m+':'+pad2(s));
}
function kgToDisplay(kg, unit){
  if (kg===null||kg===undefined||isNaN(kg)) return null;
  var v = unit==='lb' ? kg/KG_PER_LB : kg;
  return Math.round(v*10)/10;
}
function displayToKg(val, unit){
  if (val===null||val===undefined||isNaN(val)) return null;
  return unit==='lb' ? val*KG_PER_LB : val;
}
function secToMMSS(totalSec){
  if (totalSec===null||totalSec===undefined||isNaN(totalSec)) return '';
  var s = Math.round(totalSec), m = Math.floor(Math.abs(s)/60), sec = Math.abs(s)%60;
  return (s<0?'-':'') + m + ':' + pad2(sec);
}
function mmssToSec(str){
  if (str===null||str===undefined) return null;
  var t = String(str).trim();
  if (t==='') return null;
  if (t.indexOf(':')>=0){
    var parts = t.split(':');
    var mi = parseInt(parts[0],10)||0, se = parseInt(parts[1],10)||0;
    return mi*60+se;
  }
  var n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function fmtRest(sec){
  if (sec===null||sec===undefined) return null;
  if (sec>=60){ var m=Math.floor(sec/60), s=sec%60; return s===0 ? (m+'m') : (m+':'+pad2(s)); }
  return sec+'s';
}
function blankSetValues(fields){ var o={}; fields.forEach(function(f){ o[f.id]=null; }); return o; }
function snapshotFields(ex){ return ex.fields.map(function(f){ return Object.assign({},f); }); }
function fieldDisplayValue(f, raw, unit){
  if (raw===null||raw===undefined||raw==='') return '';
  if (f.type==='weight') return String(kgToDisplay(raw, unit));
  if (f.type==='assisted') return '\u2212' + String(kgToDisplay(raw, unit));
  if (f.type==='time' || f.type==='timer') return secToMMSS(raw);
  return String(raw);
}
function isTimeType(t){ return t==='time' || t==='timer'; }
function fieldUnitSuffix(f, unit){
  if (f.unit) return ' ('+esc(f.unit)+')';
  if (f.type==='weight') return ' ('+unit+')';
  if (f.type==='assisted') return ' (\u2212'+unit+')';
  return '';
}
function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* --------------------------------------------------------- persistence */

function defaultData(){
  return { version:1, profile:{ name:'', username:'', avatar:null, createdAt:null }, exercises:[], plans:[], workouts:[], activeWorkout:null, restTimer:null, lastExportAt:null, backupNudgeDismissedAt:null, settings:{weightUnit:'lb'} };
}
function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    /* one-time carry-over from the app's previous name (IronLog).
       The old key is left untouched as a safety copy. */
    if (!raw){
      var legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
      if (legacy){
        localStorage.setItem(STORAGE_KEY, legacy);
        raw = legacy;
      }
    }
    if (!raw) return defaultData();
    var parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed);
  }catch(e){ return defaultData(); }
}
var data = loadData();
/* When this file was produced by "Export portable copy" it carries a data
   snapshot. Seed it only into an empty install; if there is already live
   data we ask first rather than silently overwriting it. */
var pendingRestore = null;
(function(){
  var el = document.getElementById(EMBED_ID);
  if (!el) return;
  var snap;
  try { snap = JSON.parse(el.textContent); } catch(e){ return; }
  var payload = snap && snap.data ? snap.data : null;
  if (!payload || !Array.isArray(payload.exercises)) return;
  var isEmpty = (data.exercises||[]).length===0 && (data.plans||[]).length===0 && (data.workouts||[]).length===0;
  if (isEmpty){
    data = Object.assign(defaultData(), payload);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  } else {
    pendingRestore = snap;
  }
})();
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('Athleticism: save failed', e); }
}
/* ---- Backup & restore ---------------------------------------------------
   localStorage is not permanent. iOS Safari in particular can evict site
   data for pages that are not installed to the Home Screen, so exporting a
   real file is the only durable safety net. Three formats:
     .json  - compact data-only backup
     .html  - a full working copy of the app with the data baked inside
   Importing accepts either. */

function backupPayload(){
  var snapshot = Object.assign({}, data);
  /* device-local state that should not travel with the data */
  delete snapshot.restTimer;
  delete snapshot.lastExportAt;
  delete snapshot.backupNudgeDismissedAt;
  return {
    app: 'Athleticism',
    backupFormat: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    data: snapshot
  };
}
function backupStamp(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dataCounts(d){
  return {
    exercises: (d.exercises||[]).length,
    plans: (d.plans||[]).length,
    workouts: (d.workouts||[]).filter(function(w){return w.completedAt;}).length
  };
}
function countsLine(c){
  return c.exercises+' exercise'+(c.exercises!==1?'s':'')+' &middot; '+
         c.plans+' plan'+(c.plans!==1?'s':'')+' &middot; '+
         c.workouts+' workout'+(c.workouts!==1?'s':'');
}
function downloadFile(filename, mime, content){
  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
    return true;
  }catch(e){
    console.error('Athleticism: download failed', e);
    return false;
  }
}
/* On phones the OS share sheet is a far better destination than a silent
   download - it puts the file straight into Files, iCloud Drive or AirDrop. */
function canShareFiles(){
  try{
    if (!navigator.share || !navigator.canShare || typeof File !== 'function') return false;
    return navigator.canShare({ files: [ new File(['x'], 'x.txt', {type:'text/plain'}) ] });
  }catch(e){ return false; }
}
function markExported(){
  data.lastExportAt = Date.now();
  data.backupNudgeDismissedAt = null;
  save();
}
function shareFile(filename, mime, content, done){
  var file;
  try { file = new File([content], filename, {type: mime}); }
  catch(e){ return false; }
  navigator.share({ files:[file], title: filename })
    .then(function(){ done(true); })
    .catch(function(){ done(false); });  /* cancelled or unsupported - stay put */
  return true;
}
function jsonBackupText(){ return JSON.stringify(backupPayload(), null, 2); }
function jsonBackupName(){ return 'athleticism-backup-'+backupStamp()+'.json'; }
function portableBackupName(){ return 'athleticism-backup-'+backupStamp()+'.html'; }

function exportJSON(){
  var ok = downloadFile(jsonBackupName(), 'application/json', jsonBackupText());
  if (ok) markExported();
  return ok;
}
/* Serialise a clean copy of this page with the current data embedded, so the
   backup file is itself a fully working copy of the app. */
function buildPortableHTML(){
  var clone = document.documentElement.cloneNode(true);

  /* strip anything the app rebuilds on load, plus any embed from a file
     this copy was itself opened from */
  var prior = clone.querySelector('#'+EMBED_ID);
  if (prior && prior.parentNode) prior.parentNode.removeChild(prior);

  /* A portable copy runs from a file:// path, where service workers and
     manifests are invalid. Strip the PWA wiring so the archive never tries
     to register anything and never claims to be installable. */
  var pwaBits = clone.querySelectorAll('link[rel="manifest"], [data-pwa]');
  for (var q=0;q<pwaBits.length;q++){
    if (pwaBits[q].parentNode) pwaBits[q].parentNode.removeChild(pwaBits[q]);
  }
  ['#main','#settings-modal','#exercise-modal','#finish-modal','#restore-modal','#timerbar'].forEach(function(sel){
    var el = clone.querySelector(sel);
    if (el) el.innerHTML = '';
  });
  ['#settings-modal','#exercise-modal','#finish-modal','#restore-modal'].forEach(function(sel){
    var el = clone.querySelector(sel);
    if (el) el.setAttribute('hidden','');
  });
  var tb = clone.querySelector('#timerbar');
  if (tb) tb.className = 'timerbar';
  var pill = clone.querySelector('#inprogress-btn');
  if (pill){ pill.innerHTML = ''; pill.setAttribute('hidden',''); }
  var cloneBody = clone.querySelector('body');
  if (cloneBody) cloneBody.className = '';
  var tabs = clone.querySelectorAll('.tab-btn');
  for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');

  /* "<" is escaped so a closing script tag inside user text can't end this one early */
  var json = JSON.stringify(backupPayload()).replace(/</g, '\\u003c');
  var seed = clone.ownerDocument.createElement('script');
  seed.type = 'application/json';
  seed.id = EMBED_ID;
  seed.textContent = json;

  var appScript = null;
  var scripts = clone.querySelectorAll('script');
  for (var j=0;j<scripts.length;j++){ if (!scripts[j].type) appScript = scripts[j]; }
  if (appScript && appScript.parentNode) appScript.parentNode.insertBefore(seed, appScript);
  else if (cloneBody) cloneBody.appendChild(seed);

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}
function exportPortable(){
  var ok = downloadFile(portableBackupName(), 'text/html', buildPortableHTML());
  if (ok) markExported();
  return ok;
}
/* Accepts a .json backup, or a portable .html backup (data pulled out of
   its embedded block). */
function parseBackupText(text){
  var trimmed = (text||'').trim();
  if (trimmed.charAt(0) !== '{'){
    var marker = 'id="'+EMBED_ID+'"';
    var at = trimmed.indexOf(marker);
    if (at === -1) return { ok:false, error:'That file does not contain any Athleticism data.' };
    var open = trimmed.indexOf('>', at);
    var close = trimmed.indexOf('<\/script>', open);
    if (open === -1 || close === -1) return { ok:false, error:'The backup block in that file is incomplete.' };
    trimmed = trimmed.slice(open+1, close).replace(/\\u003c/g, '<').trim();
  }
  var parsed;
  try { parsed = JSON.parse(trimmed); }
  catch(e){ return { ok:false, error:'That file is not valid backup data.' }; }
  if (parsed && typeof parsed.backupFormat==='number' && parsed.backupFormat > BACKUP_FORMAT){
    return { ok:false, error:'That backup was made by a newer version of Athleticism. Update this copy first.' };
  }
  var payload = (parsed && parsed.data && typeof parsed.data==='object') ? parsed.data : parsed;
  if (!payload || typeof payload!=='object') return { ok:false, error:'That file is not valid backup data.' };
  if (!Array.isArray(payload.exercises) || !Array.isArray(payload.plans) || !Array.isArray(payload.workouts)){
    return { ok:false, error:'That backup is missing its exercises, plans or workouts.' };
  }
  return { ok:true, data: payload, exportedAt: parsed.exportedAt || null };
}
/* Merge is additive and never destructive: anything whose id we already have
   is left exactly as it is. That makes combining two devices predictable -
   you can run it twice and get the same result. */
function mergeImportedData(payload){
  var added = { exercises:0, plans:0, workouts:0 };
  var seen = {};

  data.exercises.forEach(function(e){ seen['e:'+e.id] = true; });
  (payload.exercises||[]).forEach(function(e){
    if (!e || !e.id || seen['e:'+e.id]) return;
    seen['e:'+e.id] = true;
    data.exercises.push(e);
    added.exercises++;
  });

  data.plans.forEach(function(pl){ seen['p:'+pl.id] = true; });
  (payload.plans||[]).forEach(function(pl){
    if (!pl || !pl.id || seen['p:'+pl.id]) return;
    seen['p:'+pl.id] = true;
    pl.items = normalizePlanItems(pl.items || []);
    data.plans.push(pl);
    added.plans++;
  });

  data.workouts.forEach(function(w){ seen['w:'+w.id] = true; });
  (payload.workouts||[]).forEach(function(w){
    if (!w || !w.id || seen['w:'+w.id]) return;
    seen['w:'+w.id] = true;
    data.workouts.push(w);
    added.workouts++;
  });

  /* identity is not additive - only adopt it if this device has none */
  if (payload.profile){
    var mine = profile();
    if (!mine.name && !mine.username && !mine.avatar) data.profile = payload.profile;
  }

  data.workouts.sort(function(a,b){ return (a.completedAt||0) - (b.completedAt||0); });
  save();
  migratePlanItems();
  return added;
}

function applyImportedData(payload){
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = null;
  runtime.timer = null;
  runtime.pendingBeep = false;
  data = Object.assign(defaultData(), payload);
  data.restTimer = null;
  if (!data.settings || !data.settings.weightUnit) data.settings = { weightUnit:'lb' };
  data.plans.forEach(function(plan){
    plan.items = normalizePlanItems(plan.items || []);
  });
  save();
  migratePlanItems();
  renderAvatarButton();
}

/* ---- Profile ------------------------------------------------------------
   The avatar is stored as a base64 data URL inside the same localStorage
   blob as everything else. That store is only ~5MB in total, and base64
   adds about a third on top, so a straight-from-the-camera photo would
   blow the quota and take the workout history with it. Every image is
   therefore center-cropped and downscaled to a 256px square JPEG first,
   which lands around 15-25KB. */

var AVATAR_PX = 256;
var AVATAR_QUALITY = 0.82;
var AVATAR_MAX_BYTES = 120 * 1024;

function profile(){
  if (!data.profile) data.profile = { name:'', username:'', avatar:null, createdAt:null };
  return data.profile;
}
function displayName(){
  var p = profile();
  return (p.name && p.name.trim()) || (p.username && p.username.trim()) || '';
}
function initials(){
  var n = displayName();
  if (!n) return '';
  var parts = n.trim().split(/\s+/).slice(0,2);
  return parts.map(function(x){ return x.charAt(0).toUpperCase(); }).join('');
}
function avatarMarkup(sizeClass){
  var p = profile();
  if (p.avatar) return '<img class="avatar-img '+sizeClass+'" src="'+p.avatar+'" alt="">';
  var ini = initials();
  if (ini) return '<span class="avatar-initials '+sizeClass+'">'+esc(ini)+'</span>';
  return '<span class="avatar-initials '+sizeClass+' empty">'+icon('user')+'</span>';
}
function renderAvatarButton(){
  var btn = document.getElementById('avatar-btn');
  if (!btn) return;
  btn.innerHTML = avatarMarkup('sm');
  btn.classList.toggle('active', ui.view==='profile');
}
function dataUrlBytes(dataUrl){
  if (!dataUrl) return 0;
  var i = dataUrl.indexOf(',');
  return Math.round((dataUrl.length - i - 1) * 0.75);
}
/* Decode -> center crop -> downscale -> re-encode. Quality steps down if the
   result is somehow still large. */
function loadImageFromFile(file, cb){
  if (!file || !file.type || file.type.indexOf('image/') !== 0){
    cb({ error:'That file is not an image.' });
    return;
  }
  var reader = new FileReader();
  reader.onerror = function(){ cb({ error:'Could not read that file.' }); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){
      cb({ error:'This browser could not decode that image. Try a JPEG or PNG.' });
    };
    img.onload = function(){
      if (!img.width || !img.height){ cb({ error:'That image appears to be empty.' }); return; }
      cb({ img: img });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---- Crop / reposition --------------------------------------------------
   A square viewport with a circular mask. The image is panned and zoomed
   under it, then only the visible square is re-encoded at AVATAR_PX. The
   viewport can never show empty space: offsets are clamped so the image
   always covers it, and zoom is floored at "just covers". */

var CROP_VIEW = 288;
var CROP_MAX_ZOOM = 4;
var cropper = null;

function cropDims(){
  var c = cropper;
  return { w: c.img.width * c.base * c.z, h: c.img.height * c.base * c.z };
}
function clampCropper(){
  var c = cropper, d = cropDims();
  c.ox = Math.min(0, Math.max(c.view - d.w, c.ox));
  c.oy = Math.min(0, Math.max(c.view - d.h, c.oy));
}
function centerCropper(){
  var c = cropper, d = cropDims();
  c.ox = (c.view - d.w) / 2;
  c.oy = (c.view - d.h) / 2;
  clampCropper();
}
function setCropZoom(z){
  var c = cropper;
  var nz = Math.max(1, Math.min(CROP_MAX_ZOOM, z));
  if (nz === c.z) return;
  var mid = c.view / 2;
  var d0 = cropDims();
  var rx = (mid - c.ox) / d0.w;
  var ry = (mid - c.oy) / d0.h;
  c.z = nz;
  var d1 = cropDims();
  c.ox = mid - rx * d1.w;
  c.oy = mid - ry * d1.h;
  clampCropper();
  drawCropper();
  var slider = document.getElementById('crop-zoom');
  if (slider && Math.abs(slider.value*1 - c.z) > 0.001) slider.value = c.z;
}
function drawCropper(){
  var c = cropper;
  if (!c) return;
  var canvas = document.getElementById('crop-canvas');
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(c.view*dpr)){
    canvas.width = Math.round(c.view*dpr);
    canvas.height = Math.round(c.view*dpr);
  }
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, c.view, c.view);
  var d = cropDims();
  ctx.drawImage(c.img, c.ox, c.oy, d.w, d.h);
}
function openCropper(img){
  /* the stage must match the canvas exactly or the circular mask would no
     longer correspond to the square we actually export */
  var view = Math.max(200, Math.min(CROP_VIEW, window.innerWidth - 88));
  cropper = { img: img, view: view, z: 1, ox: 0, oy: 0, pointers: {}, pinchDist: 0, pinchZoom: 1 };
  cropper.base = view / Math.min(img.width, img.height);
  centerCropper();
  var wrap = document.getElementById('cropper-modal');
  wrap.innerHTML = '<div class="modal cropper-modal">'+
    '<div class="modal-head"><h2>Adjust picture</h2><button class="icon-btn" data-action="crop-cancel">'+icon('x')+'</button></div>'+
    '<div class="crop-stage" style="width:'+view+'px;height:'+view+'px"><canvas id="crop-canvas" style="width:'+view+'px;height:'+view+'px"></canvas><div class="crop-mask"></div></div>'+
    '<div class="crop-hint">Drag to reposition. Pinch or use the slider to zoom.</div>'+
    '<div class="crop-zoom-row">'+
      '<button class="icon-btn" data-action="crop-zoom-out" title="Zoom out">&minus;</button>'+
      '<input id="crop-zoom" type="range" min="1" max="'+CROP_MAX_ZOOM+'" step="0.01" value="1">'+
      '<button class="icon-btn" data-action="crop-zoom-in" title="Zoom in">+</button>'+
    '</div>'+
    '<div style="display:flex;gap:10px;margin-top:16px;">'+
      '<button class="btn btn-ghost full-width" data-action="crop-reset">Reset</button>'+
      '<button class="btn btn-ghost full-width" data-action="crop-cancel">Cancel</button>'+
      '<button class="btn btn-primary full-width" data-action="crop-save">Use photo</button>'+
    '</div>'+
  '</div>';
  wrap.hidden = false;
  attachCropperGestures();
  drawCropper();
}
function closeCropper(){
  cropper = null;
  var wrap = document.getElementById('cropper-modal');
  wrap.hidden = true;
  wrap.innerHTML = '';
}
function attachCropperGestures(){
  var canvas = document.getElementById('crop-canvas');
  if (!canvas) return;
  var slider = document.getElementById('crop-zoom');
  if (slider){
    slider.addEventListener('input', function(){ setCropZoom(slider.value*1); });
  }
  function pointerList(){
    var ids = Object.keys(cropper.pointers);
    return ids.map(function(k){ return cropper.pointers[k]; });
  }
  canvas.addEventListener('pointerdown', function(e){
    if (!cropper) return;
    e.preventDefault();
    e.stopPropagation();
    canvas.setPointerCapture(e.pointerId);
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length === 2){
      cropper.pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      cropper.pinchZoom = cropper.z;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!cropper || !cropper.pointers[e.pointerId]) return;
    e.preventDefault();
    var prev = cropper.pointers[e.pointerId];
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length >= 2){
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if (cropper.pinchDist > 0){
        setCropZoom(cropper.pinchZoom * (dist / cropper.pinchDist));
      }
      return;
    }
    cropper.ox += dx;
    cropper.oy += dy;
    clampCropper();
    drawCropper();
  });
  function release(e){
    if (!cropper) return;
    delete cropper.pointers[e.pointerId];
    cropper.pinchDist = 0;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', function(e){
    if (!cropper) return;
    e.preventDefault();
    setCropZoom(cropper.z * (e.deltaY < 0 ? 1.12 : 1/1.12));
  }, { passive:false });
}
/* Re-encode only the square currently under the viewport. */
function commitCrop(){
  var c = cropper;
  if (!c) return { error:'Nothing to save.' };
  try{
    var out = document.createElement('canvas');
    out.width = AVATAR_PX;
    out.height = AVATAR_PX;
    var ctx = out.getContext('2d');
    var f = c.base * c.z;
    var sx = (-c.ox) / f;
    var sy = (-c.oy) / f;
    var sSide = c.view / f;
    ctx.drawImage(c.img, sx, sy, sSide, sSide, 0, 0, AVATAR_PX, AVATAR_PX);

    var q = AVATAR_QUALITY;
    var dataUrl = out.toDataURL('image/jpeg', q);
    while (dataUrlBytes(dataUrl) > AVATAR_MAX_BYTES && q > 0.4){
      q -= 0.15;
      dataUrl = out.toDataURL('image/jpeg', q);
    }
    if (!dataUrl || dataUrl.indexOf('data:image') !== 0) return { error:'Could not process that image.' };
    return { dataUrl: dataUrl, bytes: dataUrlBytes(dataUrl) };
  }catch(e){
    return { error:'Could not process that image.' };
  }
}
function setAvatar(dataUrl){
  var p = profile();
  p.avatar = dataUrl;
  if (!p.createdAt) p.createdAt = Date.now();
  try{
    save();
  }catch(e){
    p.avatar = null;
    return false;
  }
  renderAvatarButton();
  return true;
}
function greeting(){
  var h = new Date().getHours();
  if (h < 5) return 'Still up';
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function migratePlanItems(){
  var changed = false;
  data.plans.forEach(function(plan){
    plan.items.forEach(function(item){
      if (!item.sets){
        changed = true;
        var ex = data.exercises.find(function(e){return e.id===item.exerciseId;});
        var fields = ex ? ex.fields : [];
        var count = Math.max(1, item.targetSets || 1);
        var sets = [];
        for (var i=0;i<count;i++){
          sets.push({ kind:'set', id: uid('s'), values: blankSetValues(fields), restSec: null });
        }
        item.defaultRestSec = (item.restSec!==undefined) ? item.restSec : null;
        item.sets = sets;
        delete item.targetSets;
        delete item.restSec;
      }
    });
  });
  if (changed) save();
}
migratePlanItems();
function newPlanItem(exerciseId){
  var ex = data.exercises.find(function(e){return e.id===exerciseId;});
  var fields = ex ? ex.fields : [];
  var sets = [];
  for (var i=0;i<3;i++){ sets.push({ kind:'set', id: uid('s'), values: blankSetValues(fields), restSec: null }); }
  return { kind:'exercise', exerciseId: exerciseId, defaultRestSec: null, sets: sets };
}

/* ---- Categories ---------------------------------------------------------
   plan.items is a FLAT sequence. A category entry acts as a section header;
   every exercise entry after it belongs to that category until the next
   category entry. Entries before any header are uncategorised. This keeps
   drag-and-drop to a single flat reorder instead of nested tree surgery. */

function newPlanCategory(){
  return { kind:'category', id: uid('cat'), name: 'New Category', collapsed: false };
}
function itemKind(it){ return it.kind || 'exercise'; }
/* A 'break' entry closes the category above it, so exercises can sit BELOW a
   category while staying outside it. Without it, position alone would always
   pull them back into the nearest heading above. */
function newPlanBreak(){ return { kind:'break', id: uid('brk') }; }
/* how many entries move together when this one is dragged:
   a category takes its members with it, an exercise moves alone */
function planBlockLength(items, idx){
  if (itemKind(items[idx]) !== 'category') return 1;
  var n = 1;
  for (var i=idx+1; i<items.length; i++){
    var k = itemKind(items[i]);
    if (k==='category' || k==='break') break;
    n++;
  }
  return n;
}
/* index of the category heading governing this entry, or -1 if uncategorised */
function owningCategoryIdx(items, idx){
  for (var i=idx-1; i>=0; i--){
    var k = itemKind(items[i]);
    if (k==='break') return -1;
    if (k==='category') return i;
  }
  return -1;
}
/* true when this entry is the last member of the category block it belongs to */
function isLastInCategory(items, idx){
  if (itemKind(items[idx])!=='exercise') return false;
  if (owningCategoryIdx(items, idx) === -1) return false;
  var next = items[idx+1];
  if (!next) return true;
  var nk = itemKind(next);
  return nk==='category' || nk==='break';
}
/* drop a break marker wherever it no longer separates anything */
function normalizePlanItems(items){
  var out = [];
  for (var i=0;i<items.length;i++){
    if (itemKind(items[i])!=='break'){ out.push(items[i]); continue; }
    var prev = out[out.length-1];
    if (!prev) continue;                                  /* nothing above to close */
    if (itemKind(prev)==='break') continue;               /* duplicate */
    if (owningCategoryIdx(out, out.length) === -1) continue; /* not inside a category */
    var next = items[i+1];
    if (!next) continue;                                  /* nothing below to separate */
    if (itemKind(next)==='category') continue;            /* next heading already closes it */
    out.push(items[i]);
  }
  return out;
}
function planExerciseCount(plan){
  return (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; }).length;
}
function movePlanBlock(fromIdx, toIdx, exitCategory){
  var plan = currentPlan();
  var items = plan.items;
  var len = planBlockLength(items, fromIdx);
  if (toIdx > fromIdx && toIdx < fromIdx + len) return; /* dropped inside itself */
  var moved = items.splice(fromIdx, len);
  var dest = toIdx > fromIdx ? toIdx - len : toIdx;
  /* dropping into a category's exit zone: close the category first, so the
     item lands below the heading but outside it */
  if (exitCategory && itemKind(moved[0])!=='category'){
    items.splice(dest, 0, newPlanBreak());
    dest++;
  }
  for (var i=0;i<moved.length;i++) items.splice(dest+i, 0, moved[i]);
  plan.items = normalizePlanItems(items);
  save(); renderMain();
}

/* ------------------------------------------------------- derived stats */

function trainedDatesSet(){
  var s = new Set();
  data.workouts.forEach(function(w){ if (w.completedAt) s.add(w.date); });
  return s;
}
function computeStreak(trained){
  var count=0, cursor=new Date();
  if (!trained.has(toLocalISO(cursor))) cursor.setDate(cursor.getDate()-1);
  while (trained.has(toLocalISO(cursor))) { count++; cursor.setDate(cursor.getDate()-1); }
  return count;
}
function computeThisMonthCount(){
  var now = new Date();
  return data.workouts.filter(function(w){ return w.completedAt; }).filter(function(w){
    var d = parseISO(w.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
}
function lastEntryFor(exerciseId, excludeWorkoutId){
  var past = data.workouts.filter(function(w){ return w.completedAt && w.id!==excludeWorkoutId && !w.excludeFromReference; })
    .sort(function(a,b){ return b.completedAt-a.completedAt; });
  for (var i=0;i<past.length;i++){
    var entry = past[i].exercises.find(function(e){ return e.exerciseId===exerciseId; });
    if (entry) return entry;
  }
  return null;
}
function currentPlan(){ return data.plans.find(function(p){ return p.id===ui.selectedPlanId; }); }

function setView(view){
  ui.view = view;
  ui.picker = null;
  ui.editingRest = null;
  ui.editingDefaultRest = null;
  ui.editingPlanRest = null;
  ui.editingPlanSetRest = null;
  ui.editingPlanRestBlock = null;
  ui.editingRestBlock = null;
  ui.editingTopRest = null;
  if (view!=='profile' && view!=='workout') ui.lastTab = view;
  if (view!=='profile') ui.profileMessage = null;

function renderHeatmap(trainedSet, weeks, interactive){
  var countByDate = {};
  data.workouts.forEach(function(w){
    if (!w.completedAt) return;
    var c = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);
    countByDate[w.date] = (countByDate[w.date]||0) + c;
  });
  var today = new Date();
  var end = new Date(today);
  end.setDate(end.getDate() + (6-end.getDay()));
  var totalDays = weeks*7;
  var start = new Date(end);
  start.setDate(start.getDate()-totalDays+1);

  var cells = '';
  for (var i=0;i<totalDays;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    if (d > today){ cells += '<div class="heatmap-cell" style="visibility:hidden"></div>'; continue; }
    var iso = toLocalISO(d);
    var cnt = countByDate[iso] || 0;
    var level = cnt>0 ? (cnt>=12?4:cnt>=8?3:cnt>=4?2:1) : 0;
    var isToday = iso===toLocalISO(today);
    var isSelected = interactive && ui.historyFilterDate===iso;
    var cls = 'heatmap-cell' + (isToday?' today':'') + (isSelected?' selected':'');
    var titleTxt = iso + (cnt ? ': '+cnt+' sets' : '');
    if (interactive){
      cells += '<button class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'" data-action="heatmap-day-click" data-date="'+iso+'"></button>';
    } else {
      cells += '<div class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'"></div>';
    }
  }
  return '<div class="heatmap-wrap"><div class="heatmap">'+cells+'</div></div>'+
    '<div class="heatmap-legend"><span>Less</span>'+
    '<div class="heatmap-cell" data-level="0"></div><div class="heatmap-cell" data-level="1"></div>'+
    '<div class="heatmap-cell" data-level="2"></div><div class="heatmap-cell" data-level="3"></div>'+
    '<div class="heatmap-cell" data-level="4"></div><span>More</span></div>';
}

  for (var i=idx+1; i<plan.items.length; i++){

    '<button class="drag-handle" title="Drag to reorder">'+icon('grip')+'</button>'+

    '<input class="cat-name" data-commit="plan-category-name" data-idx="'+idx+'" value="'+esc(entry.name)+'">'+
    '<span class="cat-count">'+count+' exercise'+(count!==1?'s':'')+'</span>'+

  '</div>';
}

/* ---- plan exercise card: mirrors the active-workout card, but edits
   TARGET values/rests (a preset) rather than logging actual performance.
   No "done" column and no last-session placeholders here — those only
   make sense once you're actually logging. ---- */

function renderPlanDefaultRest(idx, item){
  if (ui.editingPlanRest === idx){
    return '<div class="ex-default-rest"><span>Default rest:</span>'+
      '<input id="plan-rest-input" type="number" min="0" step="5" placeholder="sec" value="'+(item.defaultRestSec==null?'':item.defaultRestSec)+'" data-action-enter="commit-plan-rest" data-idx="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-plan-rest" data-idx="'+idx+'">'+icon('check')+'</button></div>';
  }
  return '<div class="ex-default-rest"><span>Default rest: '+(item.defaultRestSec!=null?fmtRest(item.defaultRestSec):'not set')+'</span>'+
    '<button data-action="edit-plan-rest" data-idx="'+idx+'">Edit</button>'+
    (item.defaultRestSec!=null?('<button data-action="clear-plan-rest" data-idx="'+idx+'">Clear</button>'):'')+
  '</div>';
}
function planEffectiveRest(item, set){
  if (set.restSec!==null && set.restSec!==undefined) return set.restSec;
  if (item.defaultRestSec!==null && item.defaultRestSec!==undefined) return item.defaultRestSec;
  return null;
}
function renderPlanRestCell(idx, sIdx, item, set){
  var eff = planEffectiveRest(item, set);
  var isCustom = set.restSec!==null && set.restSec!==undefined;
  if (ui.editingPlanSetRest === (idx+'-'+sIdx)){
    return '<div class="rest-cell">'+
      '<input id="plan-set-rest-input" class="num-input" style="max-width:60px;min-width:50px" type="number" min="0" step="5" placeholder="sec" value="'+(isCustom?set.restSec:(item.defaultRestSec==null?'':item.defaultRestSec))+'" data-action-enter="plan-commit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+
      '<button class="rest-icon-btn" data-action="plan-commit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('check')+'</button>'+
    '</div>';
  }
  if (eff!==null){
    return '<div class="rest-cell">'+
      '<button class="rest-pill '+(isCustom?'custom':'')+'" data-action="plan-edit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+fmtRest(eff)+'</button>'+
      (isCustom?('<button class="rest-icon-btn" data-action="plan-clear-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'" title="Use default">'+icon('x')+'</button>'):'')+
    '</div>';
  }
  return '<div class="rest-cell"><button class="rest-add" data-action="plan-edit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">+ Add rest</button></div>';
}
function renderPlanRestBlockRow(idx, sIdx, block, fieldCount){
  var colspan = fieldCount + 2;
  var editing = ui.editingPlanRestBlock === (idx+'-'+sIdx);
  var body;
  if (editing){
    body = '<input id="planrestblock-edit-input" class="num-input" style="max-width:70px;min-width:56px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(block.seconds==null?'':block.seconds)+'" data-action-enter="plan-commit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+
      '<button class="rest-icon-btn" data-action="plan-commit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-right:6px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="plan-edit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+fmtRest(block.seconds)+'</button>';
  }
  return '<tr class="rest-block-row"><td colspan="'+colspan+'" style="text-align:center;">'+body+'</td>'+
    '<td><button class="rest-icon-btn" data-action="plan-remove-set" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('trash')+'</button></td></tr>';
}
function renderPlanSetRow(idx, sIdx, setNumber, item, fields, set, unit){
  var cells = '<td>'+(setNumber+1)+'</td>';
  fields.forEach(function(f){
    var currentRaw = set.values[f.id];
    var hasCurrent = currentRaw!==null && currentRaw!==undefined && currentRaw!=='';
    var currentDisplay = hasCurrent ? fieldDisplayValue(f, currentRaw, unit) : '';
    if (f.type==='text'){
      cells += '<td><input class="num-input" data-plan-commit="set-text" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" value="'+esc(currentDisplay)+'" placeholder="target"></td>';
    } else if (f.type==='time'){
      /* measured time has no preset by design - you record it during the session */
      cells += '<td><input class="num-input measured-cell" disabled value="" placeholder="measured" title="Measured during the workout - no preset"></td>';
    } else if (f.type==='timer'){
      cells += '<td><input class="num-input" data-plan-commit="set-time" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="mm:ss"></td>';
    } else {
      cells += '<td><input class="num-input" data-plan-commit="set-num" data-type="'+f.type+'" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" inputmode="decimal" value="'+esc(currentDisplay)+'" placeholder="\u2014"></td>';
    }
  });
  cells += '<td>'+renderPlanRestCell(idx, sIdx, item, set)+'</td>';
  cells += '<td><button class="rest-icon-btn" data-action="plan-remove-set" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('trash')+'</button></td>';
  return '<tr>'+cells+'</tr>';
}
function renderPlanExerciseCard(idx){
  var plan = currentPlan();
  var item = plan.items[idx];
  var ex = data.exercises.find(function(e){return e.id===item.exerciseId;});
  var unit = data.settings.weightUnit;

  if (!ex){
    return '<div class="ex-card" data-drag-idx="'+idx+'"><div class="ex-card-head"><div class="ex-card-name">Deleted exercise</div>'+
      '<button class="btn btn-ghost" data-action="plan-remove-exercise" data-idx="'+idx+'">'+icon('trash')+' Remove</button></div></div>';
  }

  var fields = ex.fields;
  var headerCols = '<th></th>' + fields.map(function(f){ return '<th>'+esc(f.label)+fieldUnitSuffix(f, unit)+'</th>'; }).join('') + '<th>Rest</th><th></th>';

  var setCounter = 0;
  var rows = item.sets.map(function(s, sIdx){
    var kind = s.kind || 'set';
    if (kind==='rest') return renderPlanRestBlockRow(idx, sIdx, s, fields.length);
    var rowHtml = renderPlanSetRow(idx, sIdx, setCounter, item, fields, s, unit);
    setCounter++;
    return rowHtml;
  }).join('');

  var inCategory = owningCategoryIdx(plan.items, idx) !== -1;
  return '<div class="ex-card'+(inCategory?' in-category':'')+'" data-drag-idx="'+idx+'">'+
    '<div class="ex-card-head">'+
      '<div class="plan-ex-head-left">'+
        '<button class="drag-handle" title="Drag to reorder or move into a category">'+icon('grip')+'</button>'+
        '<div class="plan-ex-order">'+
          '<button class="icon-btn tiny" data-action="plan-move-up" data-idx="'+idx+'" '+(idx===0?'disabled':'')+'>'+icon('chevronUp')+'</button>'+
          '<button class="icon-btn tiny" data-action="plan-move-down" data-idx="'+idx+'" '+(idx===plan.items.length-1?'disabled':'')+'>'+icon('chevronDown')+'</button>'+
        '</div>'+
        '<div><div class="ex-card-name">'+esc(ex.name)+'</div>'+renderPlanDefaultRest(idx, item)+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost" data-action="plan-remove-exercise" data-idx="'+idx+'">'+icon('trash')+' Remove</button>'+
    '</div>'+
    '<table class="set-table"><thead><tr>'+headerCols+'</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
      '<button class="btn btn-ghost small" data-action="plan-add-set" data-idx="'+idx+'">'+icon('plus')+' Add Set</button>'+
      '<button class="btn btn-ghost small" data-action="plan-add-rest-block" data-idx="'+idx+'">'+icon('plus')+' Add Rest</button>'+
    '</div>'+
  '</div>';
}

  var wExercises = plan.items.map(function(entry){
    if (itemKind(entry)==='category'){

    }

    }
    var ex = data.exercises.find(function(e){return e.id===entry.exerciseId;});
    if (!ex) return null;
    var fields = snapshotFields(ex);
    var sets = (entry.sets||[]).map(function(s){
      if ((s.kind||'set')==='rest'){ return { kind:'rest', id:uid('r'), seconds:s.seconds }; }
      return { kind:'set', id:uid('s'), values:Object.assign({}, s.values), restSec:s.restSec, done:false };
    });
    if (sets.length===0){ sets.push({ kind:'set', id:uid('s'), values:blankSetValues(fields), restSec:null, done:false }); }
    var effRest = (entry.defaultRestSec!==null && entry.defaultRestSec!==undefined) ? entry.defaultRestSec : (ex.defaultRestSec===undefined?null:ex.defaultRestSec);
    return { kind:'exercise', exerciseId:ex.id, name:ex.name, fields:fields, defaultRestSec:effRest, sets:sets };
  }).filter(Boolean);

/* ---- Finish flow -------------------------------------------------------
   Finishing opens a confirmation sheet with up to three choices:
     1. save the logged values as next session's reference (greyed hints)
     2. push changed TARGET TIMES back into the source plan
     3. overwrite the whole source plan template with this session
   2 and 3 only appear when the workout came from a plan and actually
   differs from it. ---- */

function normVal(v){ return (v===null||v===undefined||v==='') ? null : v; }

function diffWorkoutVsPlan(w){
  if (!w.planId) return null;
  var plan = data.plans.find(function(p){return p.id===w.planId;});
  if (!plan) return null;
  var timesChanged = false, structureChanged = false;
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pItems = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  /* category headings and their order are part of the template too */
  function groupSig(list, nameOf, kindOf){
    return list.map(function(x){
      var k = kindOf(x);
      if (k==='category') return 'C:'+nameOf(x);
      if (k==='break') return 'B';
      return 'E';
    }).join('\u0000');
  }
  var wCats = groupSig(w.exercises, function(e){return e.name;}, function(e){return e.kind||'exercise';});
  var pCats = groupSig(plan.items||[], function(it){return it.name;}, itemKind);
  if (wCats !== pCats) structureChanged = true;
  if (wEx.length !== pItems.length) structureChanged = true;
  var n = Math.min(wEx.length, pItems.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pItems[i];
    if (we.exerciseId !== pi.exerciseId){ structureChanged = true; continue; }
    if (normVal(we.defaultRestSec) !== normVal(pi.defaultRestSec)) structureChanged = true;
    var wSets = we.sets || [], pSets = pi.sets || [];
    if (wSets.length !== pSets.length) structureChanged = true;
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      var ws = wSets[j], ps = pSets[j];
      var wk = ws.kind||'set', pk = ps.kind||'set';
      if (wk !== pk){ structureChanged = true; continue; }
      if (wk==='rest'){
        if (normVal(ws.seconds) !== normVal(ps.seconds)) structureChanged = true;
        continue;
      }
      if (normVal(ws.restSec) !== normVal(ps.restSec)) structureChanged = true;
      we.fields.forEach(function(f){
        if (f.type==='time') return; /* measured time is never part of the preset */
        var a = normVal(ws.values ? ws.values[f.id] : null);
        var b = normVal(ps.values ? ps.values[f.id] : null);
        if (a !== b){
          if (f.type==='timer') timesChanged = true;
          else structureChanged = true;
        }
      });
    }
  }
  return { plan: plan, timesChanged: timesChanged, structureChanged: structureChanged };
}

function planSetsFromWorkoutExercise(we){
  return (we.sets||[]).map(function(s){
    if ((s.kind||'set')==='rest') return { kind:'rest', id:uid('r'), seconds:s.seconds };
    var values = {};
    we.fields.forEach(function(f){
      if (f.type==='time') { values[f.id] = null; return; } /* measured stays unset in the preset */
      values[f.id] = s.values ? s.values[f.id] : null;
    });
    return { kind:'set', id:uid('s'), values:values, restSec:s.restSec };
  });
}

function applyPlanTimesUpdate(w, plan){
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pEx = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  var n = Math.min(wEx.length, pEx.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pEx[i];
    if (we.exerciseId !== pi.exerciseId) continue;
    var timerFields = we.fields.filter(function(f){ return f.type==='timer'; });
    if (!timerFields.length) continue;
    var wSets = (we.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var pSets = (pi.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      timerFields.forEach(function(f){
        if (!pSets[j].values) pSets[j].values = {};
        pSets[j].values[f.id] = wSets[j].values ? wSets[j].values[f.id] : null;
      });
    }
  }
}

function applyPlanFullUpdate(w, plan){
  var items = [];
  w.exercises.forEach(function(we){
    var k = we.kind || 'exercise';
    if (k==='category'){ items.push({ kind:'category', id:uid('cat'), name:we.name, collapsed:false }); return; }
    if (k==='break'){ items.push(newPlanBreak()); return; }
    if (k!=='exercise') return; /* top-level rest blocks live inside the session, not the preset */
    items.push({ kind:'exercise', exerciseId: we.exerciseId, defaultRestSec: (we.defaultRestSec===undefined?null:we.defaultRestSec), sets: planSetsFromWorkoutExercise(we) });
  });
  plan.items = normalizePlanItems(items);
}

  ui.finishDraft = {
