    '<td><button class="rest-icon-btn" data-action="plan-remove-set" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('trash')+'</button></td></tr>';
}
function renderPlanSetRow(idx, sIdx, setNumber, item, fields, set, unit){
  var cells = '<td>'+(setNumber+1)+'</td>';
  fields.forEach(function(f){
    var currentRaw = set.values[f.id];
    var hasCurrent = currentRaw!==null && currentRaw!==undefined && currentRaw!=='';
    var currentDisplay = hasCurrent ? fieldDisplayValue(f, currentRaw, unit) : '';
    if (f.type==='text'){
      cells += '<td><input class="num-input" data-plan-commit="set-text" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" value="'+esc(currentDisplay)+'" placeholder="target"></td>';
    } else if (f.type==='time'){
      /* measured time has no preset by design - you record it during the session */
      cells += '<td><input class="num-input measured-cell" disabled value="" placeholder="measured" title="Measured during the workout - no preset"></td>';
    } else if (f.type==='timer'){
      cells += '<td><input class="num-input" data-plan-commit="set-time" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="'+timeHint()+'"></td>';
    } else {
      cells += '<td><input class="num-input" data-plan-commit="set-num" data-type="'+f.type+'" data-idx="'+idx+'" data-set="'+sIdx+'" data-field="'+f.id+'" inputmode="'+(f.type==='rir'?'numeric':'decimal')+'" value="'+esc(currentDisplay)+'" placeholder="'+esc(effortPlaceholder(f.type))+'"></td>';
    }
  });
  cells += '<td>'+renderPlanRestCell(idx, sIdx, item, set)+'</td>';
  cells += '<td><button class="rest-icon-btn" data-action="plan-remove-set" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('trash')+'</button></td>';
  return '<tr>'+cells+'</tr>';
}
function renderPlanExerciseCard(idx){
  var plan = currentPlan();
  var item = plan.items[idx];
  var ex = data.exercises.find(function(e){return e.id===item.exerciseId;});
  var unit = data.settings.weightUnit;

  if (!ex){
    return '<div class="ex-card" data-drag-idx="'+idx+'"><div class="ex-card-head"><div class="ex-card-name">Deleted Exercise</div>'+
      '<button class="btn btn-ghost" data-action="plan-remove-exercise" data-idx="'+idx+'">'+icon('trash')+' Remove</button></div></div>';
  }

  var fields = ex.fields;
  var headerCols = '<th></th>' + fields.map(function(f){ return fieldHeaderCell(f, unit); }).join('') + '<th>Rest</th><th></th>';

  var setCounter = 0;
  var rows = item.sets.map(function(s, sIdx){
    var kind = s.kind || 'set';
    if (kind==='rest') return renderPlanRestBlockRow(idx, sIdx, s, fields.length);
    var rowHtml = renderPlanSetRow(idx, sIdx, setCounter, item, fields, s, unit);
    setCounter++;
    return rowHtml;
  }).join('');

  var inCategory = owningCategoryIdx(plan.items, idx) !== -1;
  return '<div class="ex-card'+(inCategory?' in-category':'')+'" data-drag-idx="'+idx+'">'+
    '<div class="ex-card-head">'+
      '<div class="plan-ex-head-left">'+
        '<button class="drag-handle" title="Drag to reorder or move into a category">'+icon('grip')+'</button>'+
        '<div class="plan-ex-order">'+
          '<button class="icon-btn tiny" data-action="plan-move-up" data-idx="'+idx+'" '+(idx===0?'disabled':'')+'>'+icon('chevronUp')+'</button>'+
          '<button class="icon-btn tiny" data-action="plan-move-down" data-idx="'+idx+'" '+(idx===plan.items.length-1?'disabled':'')+'>'+icon('chevronDown')+'</button>'+
        '</div>'+
        '<div class="plan-ex-title"><div class="ex-card-name">'+esc(ex.name)+'</div>'+renderPlanDefaultRest(idx, item)+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost plan-ex-remove" data-action="plan-remove-exercise" data-idx="'+idx+'" aria-label="Remove exercise">'+icon('trash')+'<span class="plan-ex-remove-label"> Remove</span></button>'+
    '</div>'+
    '<table class="set-table"><thead><tr>'+headerCols+'</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
      '<button class="btn btn-ghost small" data-action="plan-add-set" data-idx="'+idx+'">'+icon('plus')+' Add Set</button>'+
      '<button class="btn btn-ghost small" data-action="plan-add-rest-block" data-idx="'+idx+'">'+icon('plus')+' Add Rest</button>'+
    '</div>'+
  '</div>';
}

/* ------------------------------------------------------------ exercises */

/* ------------------------------------------------------- progress charts ---
   Metrics are derived from whatever fields an exercise actually has, so a
   handstand hold and a bench press both work without special-casing. Anything
   needing two fields at once (estimated 1RM, volume) only appears when both
   are present - an estimated 1RM on a skill hold would be noise dressed up as
   a number. */
var CHART_REG = {};
var chartSeq = 0;
var DAY_MS = 86400000;

function chSets(wex){ return wex.sets.filter(function(s){ return (s.kind||'set')==='set'; }); }
function chFields(wex, t){ return wex.fields.filter(function(f){ return f.type===t; }); }
function chVals(wex, t){
  var fs = chFields(wex, t), out = [];
  chSets(wex).forEach(function(s){
    fs.forEach(function(f){
      var v = s.values[f.id];
      if (v!==null && v!==undefined && v!=='' && !isNaN(v*1)) out.push(v*1);
    });
  });
  return out;
}
function chPairs(wex){
  var wf = chFields(wex,'weight')[0], rf = chFields(wex,'reps')[0];
  if (!wf || !rf) return [];
  var out = [];
  chSets(wex).forEach(function(s){
    var w = s.values[wf.id], r = s.values[rf.id];
    if (w!==null && w!==undefined && w!=='' && r!==null && r!==undefined && r!=='') out.push({w:w*1, r:r*1});
  });
  return out;
}
function chMax(a){ return a.length ? Math.max.apply(null, a) : null; }
function chMin(a){ return a.length ? Math.min.apply(null, a) : null; }
function chSum(a){ return a.length ? a.reduce(function(x,y){return x+y;},0) : null; }
function chAvg(a){ return a.length ? chSum(a)/a.length : null; }

function fmtWeightVal(v){
  var u = data.settings.weightUnit;
  var d = kgToDisplay(v, u);
  return (Math.round(d*10)/10) + ' ' + u;
}
/* Charts read the scale off the exercise being charted, so a sprint stays in
   metres and a long run stays in kilometres. */
var chartDistanceField = null;
function fmtDistanceVal(v){
  var u = distanceUnit(chartDistanceField);
  return metresToDisplay(v, u) + ' ' + u;
}
function fmtDistanceAxis(v){
  return String(metresToDisplay(v, distanceUnit(chartDistanceField)));
}
function fmtWeightAxis(v){
  var d = kgToDisplay(v, data.settings.weightUnit);
  return String(Math.abs(d)>=100 ? Math.round(d) : Math.round(d*10)/10);
}

var CHART_METRICS = [
  { key:'top', label:'Top Set', needs:['weight'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'weight')); },
    value:fmtWeightVal, axis:fmtWeightAxis },
  { key:'bestreps', label:'Best Set', needs:['reps'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'reps')); },
    value:function(v){ return Math.round(v)+' reps'; }, axis:function(v){ return String(Math.round(v)); } },
  { key:'hold', label:'Longest Hold', needs:['time'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'time')); },
    value:function(v){ return secToMMSS(Math.round(v)); }, axis:function(v){ return secToMMSS(Math.round(v)); } },
  { key:'totreps', label:'Total Reps', needs:['reps'], agg:'sum',
    calc:function(w){ return chSum(chVals(w,'reps')); },
    value:function(v){ return Math.round(v)+' reps'; }, axis:function(v){ return String(Math.round(v)); } },
  { key:'e1rm', label:'Est. 1RM', needs:['weight','reps'], agg:'max',
    calc:function(w){ var p=chPairs(w); return p.length ? Math.max.apply(null, p.map(function(x){ return x.w*(1+x.r/30); })) : null; },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Epley estimate from your heaviest set' },
  { key:'volume', label:'Session Volume', needs:['weight','reps'], agg:'sum',
    calc:function(w){ var p=chPairs(w); return p.length ? p.reduce(function(a,x){ return a+x.w*x.r; },0) : null; },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Weight multiplied by reps, summed across sets' },
  { key:'assist', label:'Least Assistance', needs:['assisted'], agg:'min',
    calc:function(w){ return chMin(chVals(w,'assisted')); },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Lower is better - less help each session' },
  { key:'far', label:'Farthest', needs:['distance'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'distance')); },
    value:fmtDistanceVal, axis:fmtDistanceAxis },
  { key:'totdist', label:'Total Distance', needs:['distance'], agg:'sum',
    calc:function(w){ return chSum(chVals(w,'distance')); },
    value:fmtDistanceVal, axis:fmtDistanceAxis, note:'Summed across every set in the session' },
  { key:'rpe', label:'Avg RPE', needs:['rpe'], agg:'avg',
    calc:function(w){ return chAvg(chVals(w,'rpe')); },
    value:function(v){ return 'RPE '+(Math.round(v*10)/10); }, axis:function(v){ return String(Math.round(v*10)/10); },
    note:'Higher means the session felt harder' },
  { key:'rir', label:'Avg RIR', needs:['rir'], agg:'avg',
    calc:function(w){ return chAvg(chVals(w,'rir')); },
    value:function(v){ return 'RIR '+(Math.round(v*10)/10); }, axis:function(v){ return String(Math.round(v*10)/10); },
    note:'Lower means the session felt harder' }
];

function customNumberMetrics(ex){
  return ex.fields.filter(function(f){ return f.type==='number'; }).map(function(f){
    var suffix = f.unit ? (' '+f.unit) : '';
    return { key:'num:'+f.id, label:'Best '+f.label, needs:[], agg:'max', fieldId:f.id,
      calc:function(w){
        var out=[]; chSets(w).forEach(function(s){
          var v=s.values[f.id];
          if (v!==null && v!==undefined && v!=='' && !isNaN(v*1)) out.push(v*1);
        });
        return chMax(out);
      },
      value:function(v){ return (Math.round(v*100)/100)+suffix; },
      axis:function(v){ return String(Math.round(v*100)/100); } };
  });
}
function metricsFor(ex){
  chartDistanceField = ex.fields.filter(function(f){ return f.type==='distance'; })[0] || null;
  var types = ex.fields.map(function(f){ return f.type; });
  var base = CHART_METRICS.filter(function(m){
    return m.needs.every(function(t){ return types.indexOf(t)>=0; });
  });
  return base.concat(customNumberMetrics(ex));
}
function combine(agg, vals){
  if (!vals.length) return null;
  if (agg==='max') return chMax(vals);
  if (agg==='min') return chMin(vals);
  if (agg==='sum') return chSum(vals);
  return chAvg(vals);
}
/* One point per session. Two entries of the same exercise in one workout are
   folded together with the metric's own aggregation, not silently plotted twice. */
function seriesFor(ex, metric){
  var pts = [];
  data.workouts.forEach(function(w){
    var vals = [];
    (w.exercises||[]).forEach(function(wex){
      if ((wex.kind||'exercise')!=='exercise' || wex.exerciseId!==ex.id) return;
      var v = metric.calc(wex);
      if (v!==null && v!==undefined && !isNaN(v)) vals.push(v);
    });
    var v = combine(metric.agg, vals);
    if (v===null) return;
    var t = w.completedAt || w.startedAt || (w.date ? new Date(w.date+'T12:00:00').getTime() : null);
    if (!t) return;
    pts.push({ t:t, v:v });
  });
  pts.sort(function(a,b){ return a.t-b.t; });
  return pts;
}

function chartDate(ms){
  return new Date(ms).toLocaleDateString(undefined, {day:'numeric', month:'short'});
}
function niceStep(span, target){
  if (span<=0) return 1;
  var raw = span/target, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), n = raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}

/* Registers a chart and returns the markup for it. paintCharts() fills it in
   once the browser has laid the container out and a real width exists. */
function chartBlock(ex, metric){
  var id = 'ch'+(++chartSeq);
  var pts = seriesFor(ex, metric);
  CHART_REG[id] = { points:pts, metric:metric };
  var head, foot = '';
  if (pts.length >= 3){
    var last = pts[pts.length-1], prev = pts[pts.length-2];
    var d = last.v - prev.v, cls = Math.abs(d) < 1e-9 ? '' : (d>0 ? 'up' : 'down');
    var sign = d>0 ? '+' : (d<0 ? '\u2212' : '');
    var deltaTxt = Math.abs(d) < 1e-9 ? 'no change' : (sign + metric.value(Math.abs(d)));
    head = '<div><div class="chart-value" data-chart-value="'+id+'">'+esc(metric.value(last.v))+'</div>'+
      '<div class="chart-sub" data-chart-sub="'+id+'"><span>'+esc(chartDate(last.t))+'</span>'+
      '<span class="chart-delta '+cls+'">'+esc(deltaTxt)+'</span></div></div>';
    var bestV = combine(metric.agg==='min'?'min':'max', pts.map(function(p){ return p.v; }));
    var best = pts.filter(function(p){ return p.v===bestV; }).pop();
    foot = '<div class="chart-foot">'+pts.length+' sessions'+
      (best && best!==pts[pts.length-1] ? (' &middot; best '+esc(metric.value(best.v))+' on '+esc(chartDate(best.t))) : '')+
      (metric.note ? ('<br>'+esc(metric.note)) : '')+'</div>';
  } else {
    var latest = pts.length ? pts[pts.length-1] : null;
    head = '<div><div class="chart-value">'+(latest ? esc(metric.value(latest.v)) : '\u2014')+'</div>'+
      '<div class="chart-sub">'+(latest ? esc(chartDate(latest.t)) : 'Nothing logged yet')+'</div></div>';
  }
  var opts = metricsFor(ex).map(function(m){
    return '<option value="'+esc(m.key)+'"'+(m.key===metric.key?' selected':'')+'>'+esc(m.label)+'</option>';
  }).join('');
  return '<div class="chart-card">'+
    '<div class="chart-top">'+head+
      '<select class="chart-metric" data-chart-metric="'+esc(ex.id)+'" aria-label="Chart metric">'+opts+'</select>'+
    '</div>'+
    '<div class="chart-plot" data-chart="'+id+'"></div>'+ foot +'</div>';
}

/* Below three sessions a line chart is a lie dressed as a trend, so show the
   readings themselves and say what's missing. */
function sparseHTML(pts, metric){
  if (!pts.length){
    return '<div class="chart-empty">No sessions logged yet'+
      '<span>Finish a workout with this exercise and it starts plotting here.</span></div>';
  }
  return '<div class="chart-empty">'+
    '<div class="chart-seed">'+pts.map(function(p){
      return '<div class="chart-seed-pill"><div class="chart-seed-val">'+esc(metric.value(p.v))+'</div>'+
        '<div class="chart-seed-day">'+esc(chartDate(p.t))+'</div></div>';
    }).join('')+'</div>'+
    '<span>'+(pts.length===1?'One session so far':'Two sessions so far')+
    ' \u2014 a third turns this into a chart.</span></div>';
}

function drawChart(el){
  var spec = CHART_REG[el.dataset.chart];
  if (!spec) return;
  var pts = spec.points, m = spec.metric;
  if (pts.length < 3){ el.innerHTML = sparseHTML(pts, m); return; }

  var W = el.clientWidth;
  if (!W) return;                                   /* hidden: paint when shown */
  var H = Math.max(158, Math.min(236, Math.round(W*0.44)));
  var padL = 46, padR = 14, padT = 14, padB = 26;
  var iw = W-padL-padR, ih = H-padT-padB;

  var vs = pts.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi===lo){ hi = lo + (Math.abs(lo)||1)*0.1; lo = lo - (Math.abs(lo)||1)*0.1; }
  var step = niceStep(hi-lo, 3);
  var yLo = Math.floor(lo/step)*step, yHi = Math.ceil(hi/step)*step;
  if (yHi===yLo) yHi = yLo + step;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  if (t1===t0) t1 = t0 + DAY_MS;

  var X = function(t){ return padL + (t-t0)/(t1-t0)*iw; };
  var Y = function(v){ return padT + (1-(v-yLo)/(yHi-yLo))*ih; };
  var xy = pts.map(function(p){ return {x:X(p.t), y:Y(p.v), p:p}; });

  var g = '';
  for (var v=yLo; v<=yHi+1e-9; v+=step){
    var y = Y(v);
    g += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+
         '" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>'+
         '<text x="'+(padL-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ch-ax">'+esc(m.axis(v))+'</text>';
  }

  /* A break of three weeks or more is drawn dashed, so a lapse reads as a lapse
     rather than as a confident straight line through nothing. */
  var solid = [], bridges = [], run = [xy[0]];
  for (var i=1;i<xy.length;i++){
    if (xy[i].p.t - xy[i-1].p.t > 21*DAY_MS){
      solid.push(run); bridges.push([xy[i-1], xy[i]]); run = [xy[i]];
    } else run.push(xy[i]);
  }
  solid.push(run);
  var d = function(a){ return a.map(function(q,i){ return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1); }).join(' '); };

  var base = H-padB;
  var area = '<path d="'+d(xy)+' L'+xy[xy.length-1].x.toFixed(1)+' '+base+' L'+xy[0].x.toFixed(1)+' '+base+
             ' Z" fill="url(#chg'+el.dataset.chart+')"/>';
  var lines = bridges.map(function(b){
    return '<path d="'+d(b)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="3 6" '+
           'stroke-linecap="round" opacity=".45"/>';
  }).join('') + solid.filter(function(r){ return r.length>1; }).map(function(r){
    return '<path d="'+d(r)+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  }).join('');

  var dots = '';
  if (xy.length <= 40){
    dots = xy.slice(0,-1).map(function(q){
      return '<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.4"/>';
    }).join('');
  }
  var lastQ = xy[xy.length-1];
  dots += '<circle cx="'+lastQ.x.toFixed(1)+'" cy="'+lastQ.y.toFixed(1)+'" r="9" fill="var(--accent)" opacity=".18"/>'+
          '<circle cx="'+lastQ.x.toFixed(1)+'" cy="'+lastQ.y.toFixed(1)+'" r="5.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.4"/>';

  var ticks = xy.length<=2 ? [0, xy.length-1] : (W<380 ? [0, xy.length-1] : [0, Math.floor((xy.length-1)/2), xy.length-1]);
  var xlab = ticks.filter(function(v,i,a){ return a.indexOf(v)===i; }).map(function(i){
    var q = xy[i];
    var anchor = i===0 ? 'start' : (i===xy.length-1 ? 'end' : 'middle');
    var x = i===0 ? padL : (i===xy.length-1 ? W-padR : q.x);
    return '<text x="'+x.toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+anchor+'" class="ch-ax">'+esc(chartDate(q.p.t))+'</text>';
  }).join('');

  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="'+esc(m.label)+' over '+pts.length+' sessions">'+
    '<defs><linearGradient id="chg'+el.dataset.chart+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="var(--accent)" stop-opacity="0.22"/>'+
      '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>'+
    '<style>.ch-ax{font-family:var(--font-ui);font-size:11px;font-weight:700;fill:var(--text-faint);}</style></defs>'+
    g + area + lines + dots + xlab +
    '<line class="ch-guide" y1="'+padT+'" y2="'+base+'" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0"/>'+
    '<circle class="ch-cursor" r="5.6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.6" opacity="0"/>'+
    '<rect class="ch-hit" x="'+padL+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent" style="cursor:crosshair"/></svg>';
  el._xy = xy;
}

/* Scrubbing: dragging across the plot swaps the big readout to that session
   instead of floating a tooltip, which is unusable with a thumb over it. */
function chartScrub(el, clientX){
  var xy = el._xy, spec = CHART_REG[el.dataset.chart];
  if (!xy || !spec) return;
  var r = el.getBoundingClientRect(), svg = el.querySelector('svg');
  if (!svg) return;
  var x = (clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  var best = 0;
  for (var i=1;i<xy.length;i++) if (Math.abs(xy[i].x-x) < Math.abs(xy[best].x-x)) best = i;
  var q = xy[best];
  var guide = el.querySelector('.ch-guide'), cur = el.querySelector('.ch-cursor');
  guide.setAttribute('x1', q.x); guide.setAttribute('x2', q.x); guide.setAttribute('opacity','.9');
  cur.setAttribute('cx', q.x); cur.setAttribute('cy', q.y); cur.setAttribute('opacity','1');
  var id = el.dataset.chart;
  var vEl = document.querySelector('[data-chart-value="'+id+'"]');
  var sEl = document.querySelector('[data-chart-sub="'+id+'"]');
  if (vEl) vEl.textContent = spec.metric.value(q.p.v);
  if (sEl) sEl.innerHTML = '<span>'+esc(chartDate(q.p.t))+'</span>';
}
function chartScrubEnd(el){
  var spec = CHART_REG[el.dataset.chart];
  var guide = el.querySelector('.ch-guide'), cur = el.querySelector('.ch-cursor');
  if (guide) guide.setAttribute('opacity','0');
  if (cur) cur.setAttribute('opacity','0');
  if (!spec || spec.points.length<2) return;
  var pts = spec.points, m = spec.metric, last = pts[pts.length-1], prev = pts[pts.length-2];
  var dd = last.v-prev.v, cls = Math.abs(dd)<1e-9 ? '' : (dd>0?'up':'down');
  var sign = dd>0?'+':(dd<0?'\u2212':'');
  var txt = Math.abs(dd)<1e-9 ? 'no change' : (sign+m.value(Math.abs(dd)));
  var id = el.dataset.chart;
  var vEl = document.querySelector('[data-chart-value="'+id+'"]');
  var sEl = document.querySelector('[data-chart-sub="'+id+'"]');
  if (vEl) vEl.textContent = m.value(last.v);
  if (sEl) sEl.innerHTML = '<span>'+esc(chartDate(last.t))+'</span><span class="chart-delta '+cls+'">'+esc(txt)+'</span>';
}

function paintCharts(){
  var els = document.querySelectorAll('[data-chart]');
  for (var i=0;i<els.length;i++) drawChart(els[i]);
}
var chartResizeT = null;
window.addEventListener('resize', function(){
  clearTimeout(chartResizeT);
  chartResizeT = setTimeout(paintCharts, 140);
});
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (!el || !el._xy) return;
  el._scrub = true;
  if (el.setPointerCapture && e.pointerId!==undefined){ try{ el.setPointerCapture(e.pointerId); }catch(_){} }
  chartScrub(el, e.clientX);
});
document.addEventListener('pointermove', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (!el || !el._xy) return;
  if (e.pointerType==='mouse' || el._scrub) chartScrub(el, e.clientX);
});
document.addEventListener('pointerup', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (el){ el._scrub = false; chartScrubEnd(el); }
});
document.addEventListener('pointerleave', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (el && e.pointerType==='mouse'){ el._scrub = false; chartScrubEnd(el); }
}, true);
document.addEventListener('change', function(e){
  var sel = e.target.closest && e.target.closest('[data-chart-metric]');
  if (!sel) return;
  data.settings.chartMetric = sel.value;
  save(); renderMain();
});

function renderExercises(){
  var main = document.getElementById('main');
  main.innerHTML =
    '<div class="split '+(ui.selectedExerciseId?'has-selection':'')+'">'+
      '<div class="split-list">'+
        '<div class="split-list-head"><h2>Exercises</h2><button class="icon-btn" data-action="new-exercise">'+icon('plus')+'</button></div>'+
        '<div class="search-box">'+icon('search')+'<input id="exercise-search-input" placeholder="Search" value="'+esc(ui.exerciseSearch||'')+'"></div>'+
        '<div id="exercise-list-results"></div>'+
      '</div>'+
      '<div class="split-detail" id="exercise-detail">'+renderExerciseDetailHTML()+'</div>'+
    '</div>';
  renderExerciseListResults();
}
function renderExerciseListResults(){
  var el = document.getElementById('exercise-list-results');
  if (!el) return;
  var q = (ui.exerciseSearch||'').trim().toLowerCase();
  var list = data.exercises.filter(function(e){
    return exerciseMatchesQuery(e, q);
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });
  if (data.exercises.length===0){ el.innerHTML = '<div class="empty-hint" style="padding:14px 16px;">No exercises yet.</div>'; return; }
  if (list.length===0){ el.innerHTML = '<div class="empty-hint" style="padding:14px 16px;">No matches.</div>'; return; }
  el.innerHTML = list.map(function(e){
    return '<button class="split-item '+(e.id===ui.selectedExerciseId?'active':'')+'" data-action="select-exercise" data-id="'+e.id+'"><span>'+esc(e.name)+'</span>'+
      /* once they have been through the editor the answer is theirs, even
         if the answer was none */
      (hasMuscleData(e)||e.musclesSet?'':'<span class="split-item-nudge" title="No muscles set">add muscles</span>')+
      icon('chevronRight')+'</button>';
  }).join('');
}
function renderExerciseDetailHTML(){
  if (!ui.selectedExerciseId){
    if (data.exercises.length===0){
      return '<div class="empty-state"><p>No exercises yet.</p><p class="empty-sub">Create your first exercise and choose what it tracks — weight, reps, time, or anything custom.</p><button class="btn btn-primary" data-action="new-exercise">'+icon('plus')+' New Exercise</button></div>';
    }
    return '<div class="empty-state"><p>Select an Exercise</p><p class="empty-sub">Choose one from the list, or create a new one.</p></div>';
  }
  var ex = data.exercises.find(function(e){return e.id===ui.selectedExerciseId;});
  if (!ex){ ui.selectedExerciseId = null; return renderExerciseDetailHTML(); }
  return '<a href="#" class="back-link mobile-only" data-action="deselect-exercise">'+icon('chevronLeft')+' Back to exercises</a>'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;flex-wrap:wrap;">'+
      '<div><div style="font-size:20px;font-weight:600;margin-bottom:6px;">'+esc(ex.name)+'</div>'+tagBadgesHTML(ex)+'</div>'+

/* ---- Muscle map rendering ----------------------------------------------
   Views emit an empty <div data-musclemap="front"> carrying its activation
   as a data attribute, and paintMuscleMaps() fills it in afterwards - the
   same shape as paintCharts() and paintPhotos().

   Every map container must live inside #main. buildPortableHTML() clones the
   live DOM and blanks #main; a map mounted anywhere else would bake its
   rendered <path> markup into every exported backup. */

function bodyType(){ return (data.settings && data.settings.bodyType === 'female') ? 'female' : 'male'; }

function muscleMapOptions(side){
  return {
    gender: bodyType(),
    side: side,
    stops: MUSCLE_RAMP,
    inactive: MUSCLE_RAMP[0],
    /* read from the theme, so it can sit behind the body on either ground */
    outline: getComputedStyle(document.documentElement).getPropertyValue('--mm-outline').trim() || '#D9C9B6',
    /* nothing happens on click, so don't offer a pointer that says otherwise */
    interactive: false
  };
}

/* Built once and moved between containers rather than rebuilt. setActivation
   recolours existing nodes, so a keystroke costs a repaint, not ~100 new
   SVG paths. */
var mmInstances = {};

function paintMuscleMaps(){
  if (typeof MuscleMap === 'undefined') return;
  var nodes = document.querySelectorAll('[data-musclemap]');
  var used = {};
  for (var i=0; i<nodes.length; i++){
    var el = nodes[i];
    var side = el.getAttribute('data-musclemap');
    if (side !== 'front' && side !== 'back') continue;
    var act = {};
    try { act = JSON.parse(el.getAttribute('data-activation') || '{}'); } catch(e){}

    var key = bodyType()+'-'+side;
    var map = used[key] ? null : mmInstances[key];
    try {
      if (map && map.svg){
        if (map.svg.parentNode !== el) el.appendChild(map.svg);
        map.container = el;
      } else {
        map = new MuscleMap(el, muscleMapOptions(side));
        if (!used[key]) mmInstances[key] = map;
      }
      used[key] = true;
      map.setActivation(act);
    } catch(e){
      /* geometry missing or a container that vanished mid-paint: leave the
         slot empty rather than taking the whole render down with it */
      el.innerHTML = '';
    }
  }
}
/* A body swap invalidates nothing except which instances get reused. */
function resetMuscleMaps(){ mmInstances = {}; }

function fmtSets(n){
  var r = Math.round(n * 10) / 10;
  return (r === Math.round(r)) ? String(Math.round(r)) : r.toFixed(1);
}

var MUSCLE_TIER_LABELS = { p:'Primary', s:'Supporting', b:'Both' };
var MUSCLE_TIER_HINTS = {
  p:'Worked as a primary muscle',
  s:'Worked as a supporting muscle',
  b:'Primary in one exercise, supporting in another'
};

function muscleBreakdownHTML(rows, showSets, tiers){
  return rows.map(function(r){
    var tier = tiers && tiers[r.slug];
    return '<div class="mm-row">'+
      '<span class="mm-rank'+(r.rank===1?' top':'')+'">'+r.rank+'</span>'+
      '<span class="mm-name">'+esc(r.label)+
        (tier ? '<span class="mm-tier" title="'+esc(MUSCLE_TIER_HINTS[tier])+'">'+esc(MUSCLE_TIER_LABELS[tier])+'</span>' : '')+
      '</span>'+
      '<span class="mm-bar"><span class="mm-bar-fill" style="width:'+Math.max(2, r.pct)+'%;background:'+
        muscleColour(r.pct)+'"></span></span>'+
      (showSets ? '<span class="mm-sets">'+fmtSets(r.sets)+'</span>' : '')+
      '<span class="mm-pct">'+r.pct+'%</span>'+

/* mode: 'workout' normalises against this session's hardest-hit muscle.
         'weekly'  scores against WEEKLY_TARGET_SETS so gaps stay grey. */
function muscleMapSectionHTML(mode, raw, opts){
  opts = opts || {};
  var weekly = mode === 'weekly';
  var activation = weekly ? absoluteActivation(raw) : relativeActivation(raw);

        '<figure class="mm-fig"><div class="mm-canvas" data-musclemap="front" data-activation="'+actAttr+'"></div>'+
          '<figcaption>Front</figcaption></figure>'+

/* ---- Muscle picker (exercise editor) ------------------------------------
   Two tiers, not three. Primary carries full weight, supporting carries half.
   A third tier is false precision and makes data entry tedious enough that
   people stop doing it at all. */

var MUSCLE_PICKER_GROUPS = [
  ['Torso',  ['chest','upper-back','deltoids','trapezius','lower-back','neck']],
  ['Arms',   ['biceps','triceps','forearm','hands']],
  ['Core',   ['abs','obliques']],
  ['Legs',   ['quadriceps','hamstring','gluteal','adductors','calves','tibialis']],
  ['Joints', ['knees','ankles','feet']]
];

function muscleTier(d, slug){
  if ((d.muscles.primary||[]).indexOf(slug) >= 0) return 'p';
  if ((d.muscles.secondary||[]).indexOf(slug) >= 0) return 's';
  return '';
}

/* off -> primary -> supporting -> off */
function cycleMuscleTier(d, slug){
  var tier = muscleTier(d, slug);
  var p = d.muscles.primary.filter(function(s){ return s!==slug; });
  var s = d.muscles.secondary.filter(function(x){ return x!==slug; });
  if (tier === '') p.push(slug);
  else if (tier === 'p') s.push(slug);
  d.muscles = { primary: p, secondary: s };
  d.musclesTouched = true;
}

/* The picker repaints on its own so typing a name never steals the caret
   out of the name field. */
function refreshMusclePicker(){
  var el = document.getElementById('ex-muscle-picker');
  if (el && ui.exerciseDraft){ el.innerHTML = musclePickerHTML(ui.exerciseDraft); ui.exerciseDraft.flashMuscles = false; }
}
/* Pre-fills from the typed name until the moment the user edits the
   muscles themselves, after which their choice is left alone. */
function autofillMuscles(d){
  if (d.musclesTouched) return false;
  var hit = lookupExerciseMuscles(d.name);
  var next = hit ? { primary: hit.primary.slice(), secondary: hit.secondary.slice() } : emptyMuscles();
  var changed = JSON.stringify(next) !== JSON.stringify(d.muscles);
  d.muscles = next;
  d.musclesAutofilled = !!hit;
  if (changed && hit) d.flashMuscles = true;
  return changed;
}

function musclePickerHTML(d){
  var count = d.muscles.primary.length + d.muscles.secondary.length;
  return '<label class="field-label">Muscles <span class="field-optional">Optional</span></label>'+
    '<div class="mus-legend">Tap once for <b class="mus-key-p">primary</b>, again for <b class="mus-key-s">supporting</b>, again to clear.'+
      (d.musclesAutofilled && !d.musclesTouched
        ? ' <span class="mus-auto">Filled in from the name — change anything you like.</span>' : '')+
    '</div>'+
    MUSCLE_PICKER_GROUPS.map(function(g){
      return '<div class="mus-group"><span class="mus-group-lbl">'+esc(g[0])+'</span><div class="mus-grid">'+
        g[1].map(function(slug){
          var t = muscleTier(d, slug);
          return '<button type="button" class="mus-chip '+t+(t&&d.flashMuscles?' chip-new':'')+'" data-action="ex-toggle-muscle" data-slug="'+slug+'" '+
            'aria-pressed="'+(t?'true':'false')+'">'+esc(muscleLabel(slug))+'</button>';
        }).join('')+
      '</div></div>';
    }).join('')+
    (count===0 ? '<div class="empty-hint">No muscles set — this exercise will not colour the map.</div>' : '');
}

/* The exercise picks the scale; Settings picks the system. Offering "m or km"

/* Rebuilding an overlay's innerHTML throws away the .modal element and
   builds a new one, which costs two things nobody asked for: its scroll
   position resets to the top, and the pop-in animation replays. Adding a
   tracking field halfway down the exercise editor therefore threw you back
   to the top with a flash.

   So reuse the element that is already on screen and swap only what is
   inside it. A modal being opened has no element yet, so it still animates
   in - closing one clears its markup to keep that true. */
function paintModal(wrap, html){
  var live = wrap.firstElementChild;
  if (!live || !live.classList || !live.classList.contains('modal')){
    wrap.innerHTML = html;
    return true;                 /* freshly mounted */
  }
  var keep = live.scrollTop;
  var holder = document.createElement('div');
  holder.innerHTML = html;
  var next = holder.firstElementChild;
  if (!next){ wrap.innerHTML = html; return true; }
  if (live.className !== next.className) live.className = next.className;
  live.innerHTML = next.innerHTML;
  live.scrollTop = keep;
  return false;
}

/* Repainted on its own while you type, so the name field keeps its caret. */

      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="assisted" '+(hasType('assisted')?'disabled':'')+'>'+icon('plus')+' Assisted</button>'+
      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="reps" '+(hasType('reps')?'disabled':'')+'>'+icon('plus')+' Reps</button>'+
      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="distance" '+(hasType('distance')?'disabled':'')+' title="How far \u2014 stored in metres, shown in whichever unit you pick">'+icon('plus')+' Distance</button>'+
      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="timer" '+(hasType('timer')?'disabled':'')+' title="A duration you pre-set in a plan and count down during the workout">'+icon('plus')+' Time (Target)</button>'+
      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="time" '+(hasType('time')?'disabled':'')+' title="A duration you measure and record during the workout, e.g. a max hang">'+icon('plus')+' Time (Measured)</button>'+
      '<button class="btn btn-tag" data-action="ex-add-preset" data-type="rir" '+(hasType('rir')?'disabled':'')+' title="Reps in Reserve - how many reps you had left in the tank">'+icon('plus')+' RIR</button>'+

      '<button class="btn btn-tag" data-action="ex-toggle-custom">'+icon('plus')+' Custom</button>'+

function refreshNameDependents(){

/* How much of the viewport the phone's own bars cover, from the --safe-*
   tokens. All zero on the web. */
function safeInsets(){
  var cs = getComputedStyle(document.documentElement);
  function px(side){ return parseFloat(cs.getPropertyValue('--safe-'+side)) || 0; }
  return { top: px('top'), right: px('right'), bottom: px('bottom'), left: px('left') };
}

/* ---- Suggestion dropdown ------------------------------------------------
   Drawn here rather than handed to a native <datalist>. Android's WebView
   renders one as a translucent sheet over the whole modal, misaligned and
   flickering as the options change - and the APK is the way this app is
   actually used. This also puts the filtering back under our control, so
   "pushup" can find "Push Up" again; the native element ran its own
   substring filter on top of ours and hid anything that did not literally
   contain what was typed.

   One list exists at a time, parked on document.body so no modal's overflow
   can clip it, positioned under whichever input asked for it. */

var combo = { input:null, items:[], el:null, index:-1, onPick:null };

/* `tags`, when given, runs alongside `items`: a short word to show at the end
   of that row, or '' for none. */
function comboOpen(input, items, onPick, tags){
  if (combo.input && combo.input !== input) combo.input.setAttribute('aria-expanded','false');
  if (!items.length){ comboClose(); return; }
  combo.input = input; combo.items = items; combo.index = -1; combo.onPick = onPick;
  if (!combo.el){
    combo.el = document.createElement('div');
    combo.el.className = 'combo-pop';
    combo.el.setAttribute('role','listbox');
    document.body.appendChild(combo.el);
  }
  combo.el.innerHTML = items.map(function(s, i){
    var tag = tags && tags[i];
    return '<button type="button" class="combo-item" role="option" aria-selected="false" data-combo-i="'+i+'">'+
      '<span class="combo-label">'+esc(s)+'</span>'+(tag ? '<span class="combo-tag">'+esc(tag)+'</span>' : '')+
    '</button>';
  }).join('');
  input.setAttribute('aria-expanded','true');
  comboPosition();
}

function comboClose(){
  if (combo.el && combo.el.parentNode) combo.el.parentNode.removeChild(combo.el);
  if (combo.input) combo.input.setAttribute('aria-expanded','false');
  combo.el = null; combo.input = null; combo.items = []; combo.index = -1; combo.onPick = null;
}

/* Fixed to the viewport, and flipped above the field when the keyboard has
   eaten the space below it. */
function comboPosition(){
  var el = combo.el, input = combo.input;
  if (!el || !input || !input.isConnected) return comboClose();
  var r = input.getBoundingClientRect();
  /* Two frames here, and mixing them puts the flipped list on top of the
     field. getBoundingClientRect and `position:fixed` both live in the
     LAYOUT viewport; visualViewport is what the keyboard actually shrinks.
     So decide with the visual one, place with the layout one. */
  var vv = window.visualViewport;
  var vTop = vv ? vv.offsetTop : 0;
  var vh = vv ? vv.height : window.innerHeight;
  var lh = window.innerHeight;
  /* and the phone's bars, which sit on the layout viewport's edges */
  var ins = safeInsets();
  var clearTop = Math.max(vTop, ins.top);
  var clearBottom = Math.min(vTop + vh, lh - ins.bottom);
  el.style.left = Math.round(r.left) + 'px';
  el.style.width = Math.round(r.width) + 'px';
  el.style.maxHeight = '';
  var below = clearBottom - r.bottom - 8;
  var above = r.top - clearTop - 8;
  if (below < 120 && above > below){
    el.style.top = '';
    el.style.bottom = Math.round(lh - r.top + 4) + 'px';
    /* the 80px floor keeps a cramped list usable, but never at the cost of
       pushing its top edge under the status bar */
    el.style.maxHeight = Math.max(0, Math.min(Math.max(80, Math.round(above)), Math.round(r.top - clearTop - 4))) + 'px';
  } else {
    el.style.bottom = '';
    el.style.top = Math.round(r.bottom + 4) + 'px';
    el.style.maxHeight = Math.max(80, Math.round(below)) + 'px';
  }
}

function comboHighlight(next){
  if (!combo.el) return;
  var opts = combo.el.querySelectorAll('.combo-item');
  if (!opts.length) return;
  combo.index = (next + opts.length) % opts.length;
  for (var i=0; i<opts.length; i++){
    var on = i === combo.index;
    opts[i].classList.toggle('on', on);
    opts[i].setAttribute('aria-selected', on ? 'true' : 'false');
  }
  opts[combo.index].scrollIntoView({ block:'nearest' });
}

function comboPick(i){
  var value = combo.items[i];
  var fn = combo.onPick;
  if (value === undefined || !fn) return comboClose();
  comboClose();
  fn(value);
}

/* Pointerdown claims the gesture - it must, or the input's blur would tear
   the list down before a click could land - but the pick waits for pointerup
   so that dragging a long list to scroll it does not choose whatever was
   under your thumb. */
var comboDown = null;
document.addEventListener('pointerdown', function(e){
  var el = combo.el;
  if (!el) return;
  var hit = e.target.closest ? e.target.closest('.combo-item') : null;
  if (hit && el.contains(hit)){
    e.preventDefault();
    comboDown = { i: Number(hit.getAttribute('data-combo-i')), x: e.clientX, y: e.clientY };
    return;
  }
  comboDown = null;
  if (e.target !== combo.input) comboClose();
}, true);
document.addEventListener('pointerup', function(e){
  var down = comboDown;
  comboDown = null;
  if (!down || !combo.el) return;
  /* a real tap barely moves; anything further was a scroll */
  if (Math.abs(e.clientX - down.x) > 10 || Math.abs(e.clientY - down.y) > 10) return;
  e.preventDefault();
  comboPick(down.i);
}, true);
document.addEventListener('pointercancel', function(){ comboDown = null; }, true);

/* Tabbing away, or the keyboard moving on, takes the list with it. */
document.addEventListener('focusin', function(e){
  if (combo.input && e.target !== combo.input) comboClose();
}, true);

document.addEventListener('keydown', function(e){
  if (!combo.el || e.target !== combo.input) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); comboHighlight(combo.index + 1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); comboHighlight(combo.index - 1); }
  else if (e.key === 'Enter'){ if (combo.index >= 0){ e.preventDefault(); comboPick(combo.index); } }
  /* stopPropagation, not just preventDefault: the app closes the exercise
     modal on Escape, and losing a half-typed exercise to dismissing a
     dropdown would be a rotten trade */
  else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); comboClose(); }
}, true);

window.addEventListener('resize', comboPosition);
window.addEventListener('scroll', comboPosition, true);
if (window.visualViewport) window.visualViewport.addEventListener('resize', comboPosition);

/* --------------------------------------------------------------- picker */

/* Focusing an input on a touch screen opens the keyboard, which reads as the
   app misbehaving. Only a mouse-and-keyboard setup gets the head start; on a
   phone the keyboard waits until the field itself is tapped. */
function focusIfPointer(el){
  if (!el || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return false;
  el.focus();
  return true;
}

        '</div>'+

  if (list.length===0){ el.innerHTML = '<div class="empty-hint" style="padding:14px 4px;">No matches.</div>'; return; }

      '<div><div class="result-row-name">'+esc(ex.name)+'</div><div class="result-row-sub">'+ex.fields.map(function(f){return f.label;}).join(' &middot; ')+'</div></div>'+
      tagBadgesHTML(ex)+

  }).join('');
}

/* -------------------------------------------------------- active workout */

function startBlankWorkout(){
  data.activeWorkout = { id:uid('w'), planId:null, name:'Workout', date:todayISO(), startedAt:Date.now(), completedAt:null, exercises:[] };
  save(); setView('workout');
}
function startFromPlan(planId){
  var plan = data.plans.find(function(p){return p.id===planId;});
  if (!plan) return;
  var wExercises = plan.items.map(function(entry){
    if (itemKind(entry)==='category'){
      return { kind:'category', id:uid('cat'), name:entry.name };
    }
    if (itemKind(entry)==='break'){
      return { kind:'break', id:uid('brk') };
    }
    var ex = data.exercises.find(function(e){return e.id===entry.exerciseId;});
    if (!ex) return null;
    var fields = snapshotFields(ex);
    var sets = (entry.sets||[]).map(function(s){
      if ((s.kind||'set')==='rest'){ return { kind:'rest', id:uid('r'), seconds:s.seconds }; }
      return { kind:'set', id:uid('s'), values:Object.assign({}, s.values), restSec:s.restSec, done:false };
    });
    if (sets.length===0){ sets.push({ kind:'set', id:uid('s'), values:blankSetValues(fields), restSec:null, done:false }); }
    var effRest = (entry.defaultRestSec!==null && entry.defaultRestSec!==undefined) ? entry.defaultRestSec : (ex.defaultRestSec===undefined?null:ex.defaultRestSec);
    return { kind:'exercise', exerciseId:ex.id, name:ex.name, fields:fields, defaultRestSec:effRest, sets:sets };
  }).filter(Boolean);
  data.activeWorkout = { id:uid('w'), planId:plan.id, name:plan.name, date:todayISO(), startedAt:Date.now(), completedAt:null, exercises:wExercises };
  save(); setView('workout');
}
function addExerciseToActiveWorkout(exId){
  var ex = data.exercises.find(function(e){return e.id===exId;});
  if (!ex || !data.activeWorkout) return;
  var fields = snapshotFields(ex);
  data.activeWorkout.exercises.push({ kind:'exercise', exerciseId:ex.id, name:ex.name, fields:fields, defaultRestSec:(ex.defaultRestSec===undefined?null:ex.defaultRestSec), sets:[{kind:'set', id:uid('s'), values:blankSetValues(fields), restSec:null, done:false}] });
  save();
}
/* ---- Finish flow -------------------------------------------------------
   Finishing opens a confirmation sheet with up to three choices:
     1. save the logged values as next session's reference (greyed hints)
     2. push changed TARGET TIMES back into the source plan
     3. overwrite the whole source plan template with this session
   2 and 3 only appear when the workout came from a plan and actually
   differs from it. ---- */

function normVal(v){ return (v===null||v===undefined||v==='') ? null : v; }

function diffWorkoutVsPlan(w){
  if (!w.planId) return null;
  var plan = data.plans.find(function(p){return p.id===w.planId;});
  if (!plan) return null;
  var timesChanged = false, structureChanged = false;
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pItems = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  /* category headings and their order are part of the template too */
  function groupSig(list, nameOf, kindOf){
    return list.map(function(x){
      var k = kindOf(x);
      if (k==='category') return 'C:'+nameOf(x);
      if (k==='break') return 'B';
      return 'E';
    }).join('\u0000');
  }
  var wCats = groupSig(w.exercises, function(e){return e.name;}, function(e){return e.kind||'exercise';});
  var pCats = groupSig(plan.items||[], function(it){return it.name;}, itemKind);
  if (wCats !== pCats) structureChanged = true;
  if (wEx.length !== pItems.length) structureChanged = true;
  var n = Math.min(wEx.length, pItems.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pItems[i];
    if (we.exerciseId !== pi.exerciseId){ structureChanged = true; continue; }
    if (normVal(we.defaultRestSec) !== normVal(pi.defaultRestSec)) structureChanged = true;
    var wSets = we.sets || [], pSets = pi.sets || [];
    if (wSets.length !== pSets.length) structureChanged = true;
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      var ws = wSets[j], ps = pSets[j];
      var wk = ws.kind||'set', pk = ps.kind||'set';
      if (wk !== pk){ structureChanged = true; continue; }
      if (wk==='rest'){
        if (normVal(ws.seconds) !== normVal(ps.seconds)) structureChanged = true;
        continue;
      }
      if (normVal(ws.restSec) !== normVal(ps.restSec)) structureChanged = true;
      we.fields.forEach(function(f){
        if (f.type==='time') return; /* measured time is never part of the preset */
        var a = normVal(ws.values ? ws.values[f.id] : null);
        var b = normVal(ps.values ? ps.values[f.id] : null);
        if (a !== b){
          if (f.type==='timer') timesChanged = true;
          else structureChanged = true;
        }
      });
    }
  }
  return { plan: plan, timesChanged: timesChanged, structureChanged: structureChanged };
}

function planSetsFromWorkoutExercise(we){
  return (we.sets||[]).map(function(s){
    if ((s.kind||'set')==='rest') return { kind:'rest', id:uid('r'), seconds:s.seconds };
    var values = {};
    we.fields.forEach(function(f){
      if (f.type==='time') { values[f.id] = null; return; } /* measured stays unset in the preset */
      values[f.id] = s.values ? s.values[f.id] : null;
    });
    return { kind:'set', id:uid('s'), values:values, restSec:s.restSec };
  });
}

function applyPlanTimesUpdate(w, plan){
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pEx = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  var n = Math.min(wEx.length, pEx.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pEx[i];
    if (we.exerciseId !== pi.exerciseId) continue;
    var timerFields = we.fields.filter(function(f){ return f.type==='timer'; });
    if (!timerFields.length) continue;
    var wSets = (we.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var pSets = (pi.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      timerFields.forEach(function(f){
        if (!pSets[j].values) pSets[j].values = {};
        pSets[j].values[f.id] = wSets[j].values ? wSets[j].values[f.id] : null;
      });
    }
  }
}

function applyPlanFullUpdate(w, plan){
  var items = [];
  w.exercises.forEach(function(we){
    var k = we.kind || 'exercise';
    if (k==='category'){ items.push({ kind:'category', id:uid('cat'), name:we.name, collapsed:false }); return; }
    if (k==='break'){ items.push(newPlanBreak()); return; }
    if (k!=='exercise') return; /* top-level rest blocks live inside the session, not the preset */
    items.push({ kind:'exercise', exerciseId: we.exerciseId, defaultRestSec: (we.defaultRestSec===undefined?null:we.defaultRestSec), sets: planSetsFromWorkoutExercise(we) });
  });
  plan.items = normalizePlanItems(items);
}

function openFinishModal(){
  var w = data.activeWorkout;
  if (!w) return;
  var d = diffWorkoutVsPlan(w);
  ui.finishDraft = {
    saveValues: true,
    updateTimes: false,
    updateTemplate: false,
    planName: d ? d.plan.name : null,
    timesChanged: d ? d.timesChanged : false,
    structureChanged: d ? d.structureChanged : false
  };
  document.getElementById('finish-modal').hidden = false;
  renderFinishModal();
}
function closeFinishModal(){
  ui.finishDraft = null;
  document.getElementById('finish-modal').hidden = true;
}
function renderFinishModal(){
  var wrap = document.getElementById('finish-modal');
  var f = ui.finishDraft;
  var w = data.activeWorkout;
  if (!f || !w){ wrap.innerHTML=''; return; }
  var doneSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);

  function toggleRow(key, title, sub, checked){
    return '<button class="toggle-row" data-action="finish-toggle" data-key="'+key+'">'+
      '<span class="toggle-box '+(checked?'on':'')+'">'+(checked?icon('check'):'')+'</span>'+
      '<span class="toggle-text"><span class="toggle-title">'+title+'</span><span class="toggle-sub">'+sub+'</span></span>'+
    '</button>';
  }

  var rows = toggleRow('saveValues', 'Save These Values for Next Time',
    'Next session shows them as greyed-out hints for this exercise.', f.saveValues);

  if (f.timesChanged){
    rows += toggleRow('updateTimes', 'Update Target Times in &ldquo;'+esc(f.planName)+'&rdquo;',
      'You changed preset times this session. Off keeps the plan&rsquo;s original times.', f.updateTimes);
  }
  if (f.structureChanged){
    rows += toggleRow('updateTemplate', 'Update the Whole Template',
      'Save this session&rsquo;s sets, targets and rests back into &ldquo;'+esc(f.planName)+'&rdquo;.', f.updateTemplate);
  }

  wrap.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><h2>Finish Workout</h2><button class="icon-btn" data-action="finish-cancel">'+icon('x')+'</button></div>'+
    '<div style="color:var(--text-dim);font-size:13.5px;margin-bottom:16px;">'+doneSets+' set'+(doneSets!==1?'s':'')+' completed &middot; '+fmtElapsed(Date.now()-w.startedAt)+'</div>'+
    rows+
    '<div style="display:flex;gap:10px;margin-top:18px;">'+
      '<button class="btn btn-ghost full-width" data-action="finish-cancel">Back</button>'+
      '<button class="btn btn-primary full-width" data-action="finish-confirm">Finish</button>'+
    '</div>'+
  '</div>';
}

function finishWorkout(){
  var w = data.activeWorkout;
  if (!w) return;
  var f = ui.finishDraft || { saveValues:true, updateTimes:false, updateTemplate:false };
  var d = diffWorkoutVsPlan(w);
  if (d){
    if (f.updateTemplate) applyPlanFullUpdate(w, d.plan);
    else if (f.updateTimes) applyPlanTimesUpdate(w, d.plan);
  }
  w.completedAt = Date.now();
  if (!f.saveValues) w.excludeFromReference = true;
  data.workouts.push(w);
  data.activeWorkout = null;
  closeFinishModal();
  clearRestTimer();
  save(); setView('home');
}
function discardWorkout(){
  data.activeWorkout = null;
  clearRestTimer();
  save(); setView('home');
}

function renderWorkout(){
  var main = document.getElementById('main');
  var w = data.activeWorkout;
  if (!w){ setView('home'); return; }
  var totalSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set';}).length : 0); },0);
  var doneSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);

  var html = '<div class="workout-head">'+
    '<div class="workout-head-left">'+
      '<button class="icon-btn" data-action="minimize-workout" title="Back to Home">'+icon('chevronLeft')+'</button>'+
      '<input class="title-input" data-commit="workout-name" value="'+esc(w.name)+'">'+
    '</div>'+
    '<div class="workout-head-right">'+
      '<span class="workout-meta" id="workout-elapsed">'+fmtElapsed(Date.now()-w.startedAt)+'</span>'+
      '<button class="btn btn-ghost" data-action="confirm-discard-workout">Discard</button>'+
      '<button class="btn btn-primary" data-action="finish-workout">Finish Workout</button>'+
    '</div>'+
  '</div>'+
  '<div class="workout-progress"><span id="workout-progress-count">'+doneSets+'/'+totalSets+'</span> sets completed</div>';

  if (w.exercises.length===0){
    html += '<div class="empty-state"><p>No exercises yet.</p><p class="empty-sub">Add your first exercise to start logging.</p></div>';
  } else {
    var hiddenUnderCategory = false;
    w.exercises.forEach(function(block, idx){
      var kind = block.kind || 'exercise';
      if (kind==='category'){
        hiddenUnderCategory = !!block.collapsed;
        html += renderWorkoutCategoryHeader(idx, block, w);
        return;
      }
      if (kind==='break'){
        hiddenUnderCategory = false;
        return;
      }
      if (hiddenUnderCategory) return;
      if (kind==='rest') html += renderTopRestBlock(idx, block);
      else html += renderExerciseCard(idx);
    });
  }
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
    '<button class="btn btn-ghost" data-action="open-workout-picker">'+icon('plus')+' Add Exercise</button>'+
    '<button class="btn btn-ghost" data-action="add-rest-between-exercises">'+icon('plus')+' Add Rest</button>'+
  '</div>'+
  '<div id="workout-picker" hidden></div>';

  main.innerHTML = html;
}

function renderWorkoutCategoryHeader(idx, block, w){
  var total = 0, done = 0;
  for (var i=idx+1; i<w.exercises.length; i++){
    var e = w.exercises[i];
    var k = e.kind || 'exercise';
    if (k==='category' || k==='break') break;
    if (k!=='exercise') continue;
    e.sets.forEach(function(s){
      if ((s.kind||'set')!=='set') return;
      total++; if (s.done) done++;
    });
  }
  var complete = total>0 && done===total;
  return '<div class="cat-header workout '+(complete?'complete':'')+'">'+
    '<button class="cat-caret '+(block.collapsed?'collapsed':'')+'" data-action="workout-toggle-category" data-wex="'+idx+'">'+icon('chevronDown')+'</button>'+
    '<span class="cat-title">'+esc(block.name)+'</span>'+
    '<span class="cat-count">'+done+'/'+total+'</span>'+
  '</div>';
}

function renderTopRestBlock(idx, block){
  var editing = ui.editingTopRest === idx;
  var body;
  if (editing){
    body = '<input id="toprest-edit-input" class="num-input" style="max-width:80px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(block.seconds==null?'':block.seconds)+'" data-action-enter="commit-top-rest" data-wex="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-top-rest" data-wex="'+idx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-weight:600;color:var(--text-dim);margin-right:4px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="edit-top-rest" data-wex="'+idx+'">'+fmtRest(block.seconds)+'</button>'+
      '<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+block.seconds+'" title="Start rest timer">'+icon('play')+'</button>';
  }
  return '<div class="ex-card rest-card">'+body+
    '<button class="rest-icon-btn" data-action="remove-exercise-block" data-wex="'+idx+'" style="margin-left:10px;" title="Remove">'+icon('trash')+'</button></div>';
}

function renderExerciseCard(wexIdx){
  var wex = data.activeWorkout.exercises[wexIdx];
  var unit = data.settings.weightUnit;
  var lastEntry = lastEntryFor(wex.exerciseId, data.activeWorkout.id);

  var headerCols = '<th></th>' + wex.fields.map(function(f){
    return fieldHeaderCell(f, unit);
  }).join('') + '<th>Rest</th><th></th><th></th>';

  var setCounter = 0;
  var rows = wex.sets.map(function(item, idx){
    var kind = item.kind || 'set';
    if (kind==='rest'){
      return renderRestBlockRow(wexIdx, idx, item, wex.fields.length);
    }
    var rowHtml = renderSetRow(wexIdx, idx, setCounter, wex, item, lastEntry, unit);
    setCounter++;
    return rowHtml;
  }).join('');

  return '<div class="ex-card" id="ex-card-'+wexIdx+'">'+
    '<div class="ex-card-head"><div><div class="ex-card-name">'+esc(wex.name)+'</div>'+renderDefaultRest(wexIdx, wex)+'</div>'+
    '<button class="btn btn-ghost" data-action="confirm-remove-exercise" data-wex="'+wexIdx+'">'+icon('trash')+' Remove</button></div>'+
    '<table class="set-table"><thead><tr>'+headerCols+'</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
      '<button class="btn btn-ghost small" data-action="add-set" data-wex="'+wexIdx+'">'+icon('plus')+' Add Set</button>'+
      '<button class="btn btn-ghost small" data-action="add-rest-block" data-wex="'+wexIdx+'">'+icon('plus')+' Add Rest</button>'+
    '</div>'+
  '</div>';
}

function renderRestBlockRow(wexIdx, idx, item, fieldCount){
  var colspan = fieldCount + 2; /* # column + field columns + Rest column */
  var editing = ui.editingRestBlock === (wexIdx+'-'+idx);
  var body;
  if (editing){
    body = '<input id="restblock-edit-input" class="num-input" style="max-width:70px;min-width:56px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(item.seconds==null?'':item.seconds)+'" data-action-enter="commit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-right:6px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="edit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+fmtRest(item.seconds)+'</button>'+
      '<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+item.seconds+'" title="Start rest timer">'+icon('play')+'</button>';
  }
  return '<tr class="rest-block-row"><td colspan="'+colspan+'" style="text-align:center;">'+body+'</td>'+
    '<td></td>'+
    '<td><button class="rest-icon-btn" data-action="remove-set" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('trash')+'</button></td></tr>';
}

function renderSetRow(wexIdx, idx, setNumber, wex, set, lastEntry, unit){
  var lastSets = lastEntry ? lastEntry.sets.filter(function(x){ return (x.kind||'set')==='set'; }) : null;
  var lastSet = lastSets ? lastSets[setNumber] : null;
  var cells = '<td>'+(setNumber+1)+'</td>';
  wex.fields.forEach(function(f){
    var currentRaw = set.values[f.id];
    var hasCurrent = currentRaw!==null && currentRaw!==undefined && currentRaw!=='';
    var currentDisplay = hasCurrent ? fieldDisplayValue(f, currentRaw, unit) : '';
    var placeholderRaw = lastSet ? lastSet.values[f.id] : null;
    var placeholderDisplay = (placeholderRaw!==null && placeholderRaw!==undefined && placeholderRaw!=='') ? fieldDisplayValue(f, placeholderRaw, unit) : '';
    if (f.type==='text'){
      cells += '<td><input class="num-input" data-commit="set-text" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay)+'"></td>';
    } else if (f.type==='timer'){
      var targetSec = (currentRaw!==null && currentRaw!==undefined && currentRaw!=='') ? currentRaw : null;
      cells += '<td><div class="rest-cell">'+
        '<input class="num-input" style="max-width:70px;min-width:56px;" data-commit="set-time" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||timeHint())+'">'+
        (targetSec!==null ? ('<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+targetSec+'" title="Start countdown">'+icon('play')+'</button>') : '')+
      '</div></td>';
    } else if (f.type==='time'){
      cells += '<td><input class="num-input" data-commit="set-time" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||timeHint())+'"></td>';
    } else {
      cells += '<td><input class="num-input" data-commit="set-num" data-type="'+f.type+'" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="'+(f.type==='rir'?'numeric':'decimal')+'" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||effortPlaceholder(f.type))+'"></td>';
    }
  });
  cells += '<td>'+renderRestCell(wexIdx, idx, wex, set)+'</td>';
  cells += '<td><button class="check-btn '+(set.done?'done':'')+'" data-action="toggle-set-done" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('check')+'</button></td>';
  cells += '<td><button class="rest-icon-btn" data-action="remove-set" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('trash')+'</button></td>';
  return '<tr>'+cells+'</tr>';
}


/* ---- the Photos half of the Progress tab -------------------------------- */

function photosBlurred(){ return !!data.settings.blurPhotos && !ui.photosRevealed; }
function syncPhotoBlur(){ document.body.classList.toggle('photos-hidden', photosBlurred()); }

function poseChipsHTML(){

      '<button class="pose-chip" data-action="pose-add-commit">Add</button>'+
      '<button class="pose-chip" data-action="pose-add-cancel">'+icon('x')+'</button>';

    html += '<button class="pose-chip add" data-action="pose-add">'+icon('plus')+'Angle</button>';

function photosPaneHTML(){
  var pose = ui.photoPose;
  var list = photosFor(pose);
  var msg = ui.photoMessage;
  var html = '';

  html += messageHTML(msg);

  html += poseChipsHTML();

  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;">'+
    '<button class="btn btn-primary" data-action="photo-add">'+icon('camera')+' Add Photo</button>'+
    /* under "All" the filtered count says nothing about whether any single
       angle has two shots, which is what comparing actually needs */
    ((pose ? list.length>1 : posesWithPairs().length>0)
      ? '<button class="btn btn-ghost" data-action="photo-compare-open">'+icon('compare')+' Compare</button>' : '')+
    (allPhotos().length ? '<span class="photo-storage">'+allPhotos().length+' photo'+(allPhotos().length!==1?'s':'')+' &middot; '+fmtBytes(photoLibraryBytes())+'</span>' : '')+
  '</div>';

  if (photosBlurred() && list.length){
    html += '<button class="photo-veil" data-action="photos-reveal">'+icon('eye')+' Photos are hidden &mdash; tap to show</button>';
  }

  if (!list.length){
    html += '<div class="empty-state"><p>'+(pose ? 'No '+esc(poseLabel(pose)).toLowerCase()+' photos yet.' : 'No progress photos yet.')+'</p>'+
      '<p class="empty-sub">Take one from the same spot each time. The previous shot is laid over the frame when you crop, so the angles line up.</p></div>';
  } else {
    var lastMonth = null;
    list.forEach(function(p){
      var d = parseISO(p.date);
      var mk = d.getFullYear()+'-'+d.getMonth();
      if (mk !== lastMonth){
        if (lastMonth !== null) html += '</div>';
        html += '<div class="photo-month">'+esc(d.toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'</div><div class="photo-grid">';
        lastMonth = mk;
      }
      html += '<button class="photo-tile" data-action="photo-open" data-id="'+esc(p.id)+'">'+
        photoImgTag(p.id, 'thumb')+
        '<span class="photo-tile-meta">'+esc(fmtShortDate(p.date))+
        '<span class="photo-tile-pose">'+esc(poseLabel(p.pose))+'</span></span></button>';
    });
    html += '</div>';
  }

  /* The archive button sits here rather than only in Settings: that row is
     itself hidden until a photo exists, so a notice pointing at it sent you
     hunting for something that was not there. Still gated on having photos,
     because there is nothing to warn about, or export, before then. */
  if (allPhotos().length){
    html += '<div class="photo-warn"><b>Photos are not in your regular backups.</b> They are stored separately from the rest of your data, '+
      'so a .json or portable backup skips them unless you switch on &ldquo;Include Progress Photos&rdquo; under Settings &rarr; Backup. '+
      'Or keep them as dated images anywhere you like:'+
      '<div class="photo-warn-actions">'+
        '<button class="btn btn-ghost small" data-action="photo-zip-save">'+icon('download')+' Export Photos (.zip)</button>'+
        (canShareFile(photosZipName(), 'application/zip') && !savesThroughShare(photosZipName(), 'application/zip')
          ? '<button class="btn btn-ghost small" data-action="photo-zip-share">Share</button>' : '')+
      '</div>'+
    '</div>';
  }

  return html;
}

function photoDetailHTML(){
  var p = photoById(ui.viewingPhotoId);
  if (!p){ ui.viewingPhotoId = null; return photosPaneHTML(); }
  var sameP = photosFor(p.pose);
  var idx = sameP.map(function(x){return x.id;}).indexOf(p.id);
  var newer = idx > 0 ? sameP[idx-1] : null;
  var older = idx < sameP.length-1 ? sameP[idx+1] : null;
  var first = sameP[sameP.length-1];

  return '<button class="btn btn-ghost" data-action="photo-close">'+icon('chevronLeft')+' Photos</button>'+
    (photosBlurred() ? '<button class="photo-veil" style="margin-top:14px;" data-action="photos-reveal">'+icon('eye')+' Photos are hidden &mdash; tap to show</button>' : '')+
    '<div class="photo-detail-head">'+
      '<div><div class="photo-detail-date">'+esc(fmtHeaderDate(p.date))+'</div>'+
        '<div class="photo-detail-sub">'+esc(poseLabel(p.pose))+
        (first && first.id!==p.id ? ' &middot; '+esc(fmtSpan(p.takenAt-first.takenAt))+' after your first' : ' &middot; your first in this angle')+
        '</div></div>'+
      '<button class="btn btn-ghost" data-action="confirm-delete-photo" data-id="'+esc(p.id)+'">'+icon('trash')+' Delete</button>'+
    '</div>'+
    '<div class="photo-detail-img">'+photoImgTag(p.id, 'full')+'</div>'+
    '<div class="photo-nav">'+
      (older ? '<button class="btn btn-ghost small" data-action="photo-open" data-id="'+esc(older.id)+'">'+icon('chevronLeft')+' '+esc(fmtShortDate(older.date))+'</button>' : '<span></span>')+
      (sameP.length>1 ? '<button class="btn btn-tag" data-action="photo-compare-open" data-id="'+esc(p.id)+'">'+icon('compare')+' Compare</button>' : '<span></span>')+
      (newer ? '<button class="btn btn-ghost small" data-action="photo-open" data-id="'+esc(newer.id)+'">'+esc(fmtShortDate(newer.date))+' '+icon('chevronRight')+'</button>' : '<span></span>')+
    '</div>'+
    '<label class="field-label">Note <span class="field-optional">Optional</span></label>'+
    '<input class="input" data-commit="photo-note" data-id="'+esc(p.id)+'" placeholder="Weight, how you felt, anything" value="'+esc(p.note||'')+'" maxlength="140">';
}

/* "same day apart" reads wrong, so that case gets its own wording. */
function compareSpanLabel(a, b){
  var txt = fmtSpan(Math.abs(b.takenAt - a.takenAt));
  return txt === 'same day' ? 'Taken the same day' : txt + ' apart';
}
function photoCompareHTML(){
  var pairs = posesWithPairs();
  if (!pairs.length){ ui.compareOpen = false; return photosPaneHTML(); }
  /* the filter may be on "All", or on an angle holding a single shot, so
     fall through to one that can actually be compared */
  var pose = ui.photoPose;
  if (!pose || photosFor(pose).length < 2){
    var seeded = (photoById(ui.compareA) || {}).pose;
    pose = (seeded && photosFor(seeded).length >= 2) ? seeded : pairs[0].id;
  }
  var list = photosFor(pose);              /* newest first */
  /* default to the widest span available in this angle */
  var a = photoById(ui.compareA), b = photoById(ui.compareB);
  if (!a || a.pose!==pose) a = list[list.length-1];
  if (!b || b.pose!==pose || b.id===a.id) b = list[0];
  ui.compareA = a.id; ui.compareB = b.id;

  function strip(which, chosen){
    return '<div class="cmp-strip">' + list.slice().reverse().map(function(p){
      return '<button class="cmp-thumb '+(p.id===chosen.id?'active':'')+'" data-action="compare-pick" '+
        'data-side="'+which+'" data-id="'+esc(p.id)+'" title="'+esc(fmtShortDate(p.date))+'">'+
        photoImgTag(p.id, 'thumb')+'</button>';
    }).join('') + '</div>';
  }

  var poses = photoPoses().filter(function(x){ return photosFor(x.id).length >= 2; });
  var poseRow = poses.length > 1 ? '<div class="pose-row">' + poses.map(function(x){
      return '<button class="pose-chip '+(x.id===pose?'active':'')+'" data-action="compare-pose" data-pose="'+esc(x.id)+'">'+esc(x.label)+'</button>';
    }).join('') + '</div>' : '';

  return '<button class="btn btn-ghost" data-action="compare-close">'+icon('chevronLeft')+' Photos</button>'+
    '<div class="section-title" style="margin-top:16px;"><span>'+esc(poseLabel(pose))+'</span></div>'+
    poseRow +
    (photosBlurred() ? '<button class="photo-veil" data-action="photos-reveal">'+icon('eye')+' Photos are hidden &mdash; tap to show</button>' : '')+
    '<div class="cmp-grid">'+
      '<div class="cmp-col">'+photoImgTag(a.id,'full')+'<span class="cmp-cap"><b>'+esc(fmtShortDate(a.date))+'</b>'+esc(parseISO(a.date).getFullYear())+'</span></div>'+
      '<div class="cmp-col">'+photoImgTag(b.id,'full')+'<span class="cmp-cap"><b>'+esc(fmtShortDate(b.date))+'</b>'+esc(parseISO(b.date).getFullYear())+'</span></div>'+
    '</div>'+
    '<div class="cmp-gap">'+esc(compareSpanLabel(a,b))+'</div>'+
    '<label class="field-label">Left</label>'+strip('a', a)+
    '<label class="field-label">Right</label>'+strip('b', b);
}

function progressTab(){
  var t = data.settings.progressTab;
  return t==='photos' ? 'photos' : 'sessions';
}
function renderProgress(){
  var main = document.getElementById('main');
  if (ui.viewingWorkoutId){

      '<button class="'+(tab==='photos'?'active':'')+'" data-action="progress-tab" data-seg="photos">'+icon('camera')+'Photos</button>'+

function renderWorkoutDetailHTML(w){
  var unit = data.settings.weightUnit;
  var html = '<button class="btn btn-ghost" data-action="back-to-history">'+icon('chevronLeft')+' Back</button>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0;flex-wrap:wrap;gap:12px;">'+
      '<div><div style="font-size:20px;font-weight:600;">'+esc(w.name)+'</div><div style="font-size:13px;color:var(--text-dim);margin-top:4px;">'+fmtHeaderDate(w.date)+' &middot; '+fmtElapsed(w.completedAt-w.startedAt)+'</div></div>'+
      '<button class="btn btn-ghost" data-action="confirm-delete-workout" data-id="'+w.id+'">'+icon('trash')+' Delete</button>'+
    '</div>';

  w.exercises.forEach(function(wex){
    var wexKind = wex.kind || 'exercise';
    if (wexKind==='rest'){
      html += '<div class="ex-card rest-card" style="justify-content:center;color:var(--text-dim);font-family:var(--font-mono);font-size:13px;">Rest &middot; '+fmtRest(wex.seconds)+'</div>';
      return;
    }
    if (wexKind==='category'){
      html += '<div class="cat-header workout static"><span class="cat-title">'+esc(wex.name)+'</span></div>';
      return;
    }
    if (wexKind==='break') return;
    var headerCols = '<th></th>' + wex.fields.map(function(f){
      return fieldHeaderCell(f, unit);
    }).join('');
    var setCounter = 0;
    var rows = wex.sets.map(function(s){
      var sKind = s.kind || 'set';
      if (sKind==='rest'){
        var colspan = 1 + wex.fields.length;
        return '<tr><td colspan="'+colspan+'" style="text-align:center;color:var(--text-faint);font-family:var(--font-mono);font-size:12.5px;padding:6px;">Rest &middot; '+fmtRest(s.seconds)+'</td></tr>';
      }
      var tds = '<td>'+(setCounter+1)+'</td>';
