/* --------------------------------------------------------------- timer */

function ensureAudio(){
  if (!runtime.audioCtx){
    try{ runtime.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  /* not only "suspended": after a call or Siri, Safari leaves it "interrupted",
     and it stayed silent from then on */
  if (runtime.audioCtx && runtime.audioCtx.state!=='running' && runtime.audioCtx.state!=='closed'){
    runtime.audioCtx.resume().catch(function(){});
  }
}
function beep(ctx, delay){
  if (!ctx) return;
  var t0 = ctx.currentTime + (delay||0);
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.25, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+0.4);
}
function playCompletionBeep(){
  if (!runtime.audioCtx) return;
  beep(runtime.audioCtx, 0);
  beep(runtime.audioCtx, 0.45);
}
function flashTitleIfHidden(){
  if (!document.hidden) return;
  document.title = 'Rest done! \u2014 Athleticism';
  function restore(){ document.title = originalTitle; document.removeEventListener('visibilitychange', restore); }
  document.addEventListener('visibilitychange', restore);
}
/* The rest timer is driven by an absolute end timestamp, never by counting
   interval ticks. Phones suspend background pages, so a decrementing counter
   stalls exactly when you leave the app mid-set. Storing endAt means the
   remaining time is recomputed correctly whenever we come back - including
   after the page has been killed and reloaded. */

function timerRemainingMs(t){
  if (!t) return 0;
  if (t.pausedRemainingMs !== null && t.pausedRemainingMs !== undefined) return t.pausedRemainingMs;
  return Math.max(0, t.endAt - Date.now());
}
function timerIsRunning(t){
  return !!t && !t.done && (t.pausedRemainingMs === null || t.pausedRemainingMs === undefined);
}
function persistTimer(){
  data.restTimer = runtime.timer;
  save();
}
function clearRestTimer(){
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = null;
  runtime.timer = null;
  runtime.pendingBeep = false;
  data.restTimer = null;
  save();
  renderTimerBar();
}
function startTimer(seconds){
  ensureAudio();
  clearInterval(runtime.timerHandle);
  runtime.pendingBeep = false;
  runtime.timer = {
    totalSec: seconds,
    endAt: Date.now() + seconds*1000,
    pausedRemainingMs: null,
    done: false,
    doneAt: null
  };
  persistTimer();
  renderTimerBar();
  runtime.timerHandle = setInterval(timerTick, 250);
}
function timerTick(){
  var t = runtime.timer;
  if (!t){ clearInterval(runtime.timerHandle); runtime.timerHandle = null; return; }

  if (t.done){
    /* while the app is in the background, keep pushing the auto-dismiss out
       so a finished rest is still on screen when you come back to it */
    if (document.hidden){ t.doneAt = Date.now(); return; }
    if (Date.now() - t.doneAt > 8000) clearRestTimer();
    return;
  }
  if (!timerIsRunning(t)) return;

  if (timerRemainingMs(t) <= 0){
    t.done = true;
    t.doneAt = Date.now();
    persistTimer();
    if (document.hidden){
      runtime.pendingBeep = true;   /* audio is blocked while hidden - fire on return */
      flashTitleIfHidden();
    } else {
      playCompletionBeep();
    }
    renderTimerBar();
    return;
  }
  renderTimerBar();
}
/* Coming back to the app: recompute, settle any completion that happened
   while we were away, and sound it then. */
function onVisible(){
  if (document.hidden) return;
  if (!runtime.timer) return;
  ensureAudio();
  timerTick();
  if (runtime.pendingBeep){
    runtime.pendingBeep = false;
    playCompletionBeep();
  }
  renderTimerBar();
}
/* Restore a rest that was running when the page was last closed. */
function restoreTimer(){
  var t = data.restTimer;
  if (!t || typeof t.endAt !== 'number') return;
  var staleMs = Date.now() - (t.doneAt || t.endAt);
  if (t.done || timerRemainingMs(t) <= 0){
    /* a rest that finished long ago is not worth resurfacing */
    if (staleMs > 10*60*1000){ data.restTimer = null; save(); return; }
    t.done = true;
    if (!t.doneAt) t.doneAt = t.endAt;
  }
  runtime.timer = t;
  renderTimerBar();
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = setInterval(timerTick, 250);
}
/* Rebuilt only when what it shows changes shape; every other tick just
   rewrites the time. Rebuilding it four times a second swapped the buttons
   out from under any press that spanned a tick, and that press never became
   a click - about one tap in three on -15, pause, +15 or close did nothing. */
var timerBarShape = '';
function renderTimerBar(){
  var bar = document.getElementById('timerbar');
  if (!runtime.timer){ bar.className='timerbar'; bar.innerHTML=''; timerBarShape=''; return; }
  var t = runtime.timer;
  var running = timerIsRunning(t);
  var shape = t.done ? 'done' : (running ? 'running' : 'paused');
  var time = fmtElapsed(timerRemainingMs(t));
  bar.className = 'timerbar show' + (t.done?' done':'');
  var timeEl = shape === timerBarShape ? bar.querySelector('.timerbar-time') : null;
  if (timeEl){
    if (timeEl.textContent !== time) timeEl.textContent = time;
    return;
  }
  timerBarShape = shape;
  bar.innerHTML = '<div class="timerbar-inner">'+
    '<div class="timerbar-label">'+(t.done?'Rest Complete':(running?'Resting':'Paused'))+'</div>'+
    '<div class="timerbar-time">'+time+'</div>'+
    (!t.done ? (
      '<button data-action="timer-adjust" data-delta="-15">&minus;15</button>'+
      '<button data-action="timer-pause-resume">'+(running?icon('pause'):icon('play'))+'</button>'+
      '<button data-action="timer-adjust" data-delta="15">+15</button>'
    ) : '')+
    '<button data-action="timer-dismiss">'+icon('x')+'</button>'+
  '</div>';
}

/* -------------------------------------------------------------- modals */

function daysSince(ts){ return ts ? Math.floor((Date.now()-ts)/86400000) : null; }
function workoutsSinceExport(){
  var since = data.lastExportAt || 0;
  return data.workouts.filter(function(w){ return w.completedAt && w.completedAt > since; }).length;
}
/* A photo only counts as exported once a file carried the image itself:
   the zip, or a backup with photos switched on. */
function photosSinceExport(){
  var since = data.lastPhotoExportAt || 0;
  return allPhotos().filter(function(p){ return (p.takenAt||0) > since; }).length;
}
/* Nudge only once there is something real to lose. */
function backupIsStale(){
  var n = workoutsSinceExport(), pn = photosSinceExport();
  if (n === 0 && pn === 0) return false;
  var dismissed = data.backupNudgeDismissedAt;
  if (dismissed && (Date.now()-dismissed) < 7*86400000) return false;
  /* photos arrive far more slowly than sets do, and there is no way to
     recreate one, so a smaller count already earns the reminder */
  if (pn >= 3) return true;
  if (!data.lastExportAt) return n >= 5;
  return n >= 8 || daysSince(data.lastExportAt) >= 30;
}
function sinceExportPhrase(){
  var n = workoutsSinceExport(), pn = photosSinceExport(), parts = [];
  if (n) parts.push(n+' workout'+(n!==1?'s':''));
  if (pn) parts.push(pn+' progress photo'+(pn!==1?'s':''));
  return parts.join(' and ');
}
function lastExportLine(){
  if (!data.lastExportAt) return 'Never exported';
  var d = daysSince(data.lastExportAt);
  var when = d===0 ? 'today' : (d===1 ? 'yesterday' : d+' days ago');
  var phrase = sinceExportPhrase();
  return 'Last export '+when+(phrase ? ' \u00b7 '+phrase+' since' : '');
}

function closeSettings(){
  ui.importPreview = null;
  ui.settingsMessage = null;
  ui.aboutOpen = null;   /* reopen compact, not on a wall of prose */

/* ---- Appearance --------------------------------------------------------
   Light, Dark, or System - follow the phone, which is the default and moves
   live when the phone switches at dusk. Nothing about the colours lives in
   here: every surface reads CSS tokens, and dark mode is a second set of
   values for them. This only decides which set is switched on. */
var THEME_KEY = 'athleticism_theme';

function themePreference(){
  var t = data.settings && data.settings.theme;
  return (t === 'light' || t === 'dark') ? t : 'system';
}
function systemPrefersDark(){
  try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
  catch(e){ return false; }
}
function resolvedTheme(){
  var p = themePreference();
  return p === 'system' ? (systemPrefersDark() ? 'dark' : 'light') : p;
}
/* Returns true when the theme actually changed, so callers know to repaint. */
function applyTheme(){
  var root = document.documentElement;
  var next = resolvedTheme();
  var changed = root.getAttribute('data-theme') !== next;
  root.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, themePreference()); } catch(e){}
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--surface').trim());
  /* The Android app's status-bar icons are native, so the web theme cannot
     reach them. Capacitor 8 ships a SystemBars plugin that can; told on every
     call, because at launch it assumes the phone's theme, not the app's. DARK
     there means light icons for a dark bar. Absent everywhere but the APK. */
  var bars = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SystemBars;
  if (bars && bars.setStyle){
    try {
      var pending = bars.setStyle({ style: next === 'dark' ? 'DARK' : 'LIGHT' });
      if (pending && pending['catch']) pending['catch'](function(){});
    } catch(e){}
  }
  /* the muscle maps bake their body outline in when they are built */
  if (changed) resetMuscleMaps();
  return changed;
}
function watchSystemTheme(){
  if (!window.matchMedia) return;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  /* Every colour follows the CSS tokens on its own; only the muscle maps
     bake one in. So a live change rebuilds just those - a full renderMain
     would throw away whatever was half-typed when the phone flipped. */
  var onChange = function(){
    if (themePreference() !== 'system' || !applyTheme()) return;
    var slots = document.querySelectorAll('[data-musclemap]');
    for (var i = 0; i < slots.length; i++) slots[i].innerHTML = '';
    paintMuscleMaps();
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);   /* older Android WebViews */
}

      '<div class="settings-row-actions">'+
        (shareHtml ? '<button class="btn btn-ghost" data-action="share-html">Share</button>' : '')+
        '<button class="btn btn-ghost" data-action="export-html">Save</button>'+

    '<div class="settings-row"><div class="settings-row-text"><span>Import Backup</span><span class="settings-row-sub">Accepts .json or a portable .html &mdash; you choose merge or replace next</span></div>'+
      '<button class="btn btn-ghost" data-action="import-pick">Import</button></div>';

    if (allPhotos().length){
      html += '<div class="settings-section-label">Progress Photos</div>'+
        '<div class="settings-note">Photos live in their own store, not in the data blob above, which is what keeps logging a set fast. '+
          'That also means a backup skips them unless you switch the toggle on.</div>'+

  html += aboutSectionsHTML();

  html += '<div class="settings-section-label">Danger Zone</div>'+

    '<input type="file" id="import-file-input" accept=".json,.html,application/json,text/html" style="display:none">'+

/* ------------------------------------------------------- confirm-arm ui */

var armedButtons = new WeakSet();
var armTimers = new WeakMap();
function armOrConfirm(el, onConfirm){
  if (armedButtons.has(el)){
    clearTimeout(armTimers.get(el));
    armedButtons.delete(el);
    onConfirm();
  } else {
    armedButtons.add(el);
    el.dataset.originalLabel = el.innerHTML;
    el.innerHTML = 'Confirm?';
    el.classList.add('btn-danger');
    var t = setTimeout(function(){
      armedButtons.delete(el);
      el.innerHTML = el.dataset.originalLabel;
      el.classList.remove('btn-danger');
    }, 2500);
    armTimers.set(el, t);
  }
}

/* ------------------------------------------------------------- actions */

function handleAction(action, el){
  switch(action){
    case 'start-blank': startBlankWorkout(); break;
    case 'resume-workout': setView('workout'); break;
    case 'start-plan': startFromPlan(el.dataset.id); break;
    case 'goto-plans': setView('plans'); break;
    case 'goto-history':
      data.settings.progressTab = 'sessions'; save();
      setView('progress');
      break;

    case 'new-plan': {
      var p = { id: uid('plan'), name: 'New Plan', items: [] };
      data.plans.push(p); save();
      ui.selectedPlanId = p.id;
      setView('plans');
      break;
    }
    case 'select-plan': ui.selectedPlanId = el.dataset.id; renderMain(); break;
    case 'deselect-plan': ui.selectedPlanId = null; renderMain(); break;
    case 'confirm-delete-plan': armOrConfirm(el, function(){
      data.plans = data.plans.filter(function(p){return p.id!==el.dataset.id;});
      ui.selectedPlanId = null; save(); renderMain();
    }); break;

    case 'plan-add-category': {
      currentPlan().items.push(newPlanCategory());
      save(); renderMain();
      break;
    }
    case 'plan-toggle-category': {
      var catItem = currentPlan().items[el.dataset.idx*1];
      catItem.collapsed = !catItem.collapsed;
      save(); renderMain();
      break;
    }
    case 'plan-remove-category': {
      /* removing a heading un-groups its exercises rather than deleting them */
      var rcPlan = currentPlan();
      rcPlan.items.splice(el.dataset.idx*1, 1);
      rcPlan.items = normalizePlanItems(rcPlan.items);
      save(); renderMain();
      break;
    }
    case 'workout-toggle-category': {
      var wCat = data.activeWorkout.exercises[el.dataset.wex*1];
      wCat.collapsed = !wCat.collapsed;
      save(); renderMain();
      break;
    }
    case 'plan-move-up': movePlanItem(el.dataset.idx*1, -1); break;
    case 'plan-move-down': movePlanItem(el.dataset.idx*1, 1); break;
    case 'plan-remove-exercise': {
      var plan = currentPlan();
      plan.items.splice(el.dataset.idx*1, 1);
      plan.items = normalizePlanItems(plan.items);
      save(); renderMain();
      break;
    }
    case 'edit-plan-rest':
      ui.editingPlanRest = el.dataset.idx*1;
      renderMain();
      focusIfPointer(document.getElementById('plan-rest-input'));
      break;
    case 'clear-plan-rest': {
      currentPlan().items[el.dataset.idx*1].defaultRestSec = null;
      save(); renderMain();
      break;
    }
    case 'commit-plan-rest': {
      var prinput = document.getElementById('plan-rest-input');
      var prval = prinput.value.trim();
      currentPlan().items[el.dataset.idx*1].defaultRestSec = prval==='' ? null : Math.max(0, parseInt(prval,10)||0);
      ui.editingPlanRest = null; save(); renderMain();
      break;
    }
    case 'plan-add-set': {
      var pItem = currentPlan().items[el.dataset.idx*1];
      var pEx = data.exercises.find(function(e){return e.id===pItem.exerciseId;});
      var pFields = pEx ? pEx.fields : [];
      var pLastSet = null;
      for (var plsi=pItem.sets.length-1; plsi>=0; plsi--){ if ((pItem.sets[plsi].kind||'set')==='set'){ pLastSet = pItem.sets[plsi]; break; } }
      var pValues = pLastSet ? Object.assign({}, pLastSet.values) : blankSetValues(pFields);
      pItem.sets.push({ kind:'set', id: uid('s'), values: pValues, restSec: null });
      save(); renderMain();
      break;
    }
    case 'plan-add-rest-block': {
      var pItemR = currentPlan().items[el.dataset.idx*1];
      var pDefSec = pItemR.defaultRestSec!=null ? pItemR.defaultRestSec : 60;
      pItemR.sets.push({ kind:'rest', id: uid('r'), seconds: pDefSec });
      save(); renderMain();
      break;
    }
    case 'plan-remove-set': {
      currentPlan().items[el.dataset.idx*1].sets.splice(el.dataset.set*1, 1);
      save(); renderMain();
      break;
    }
    case 'plan-edit-set-rest':
      ui.editingPlanSetRest = el.dataset.idx+'-'+el.dataset.set;
      renderMain();
      focusIfPointer(document.getElementById('plan-set-rest-input'));
      break;
    case 'plan-clear-set-rest': {
      currentPlan().items[el.dataset.idx*1].sets[el.dataset.set*1].restSec = null;
      save(); renderMain();
      break;
    }
    case 'plan-commit-set-rest': {
      var psrInput = document.getElementById('plan-set-rest-input');
      var psrVal = psrInput.value.trim();
      currentPlan().items[el.dataset.idx*1].sets[el.dataset.set*1].restSec = psrVal==='' ? null : Math.max(0, parseInt(psrVal,10)||0);
      ui.editingPlanSetRest = null; save(); renderMain();
      break;
    }
    case 'plan-edit-rest-block':
      ui.editingPlanRestBlock = el.dataset.idx+'-'+el.dataset.set;
      renderMain();
      focusIfPointer(document.getElementById('planrestblock-edit-input'));
      break;
    case 'plan-commit-rest-block': {
      var prbInput = document.getElementById('planrestblock-edit-input');
      var prbVal = prbInput.value.trim();
      currentPlan().items[el.dataset.idx*1].sets[el.dataset.set*1].seconds = prbVal==='' ? 0 : Math.max(0, parseInt(prbVal,10)||0);
      ui.editingPlanRestBlock = null; save(); renderMain();
      break;
    }

    case 'open-plan-picker': openPicker('plan'); break;
    case 'open-workout-picker': openPicker('workout'); break;
    case 'picker-close': ui.picker = null; renderMain(); break;
    case 'picker-create-new': openExerciseModal(null, ui.picker.context); break;
    case 'picker-pick': {
      var exId = el.dataset.id;
      if (ui.picker.context==='plan'){ currentPlan().items.push(newPlanItem(exId)); }
      else { addExerciseToActiveWorkout(exId); }
      ui.picker = null; save(); renderMain();
      break;
    }

    case 'add-set': {
      var wex = data.activeWorkout.exercises[el.dataset.wex*1];
      var lastSetItem = null;
      for (var lsi=wex.sets.length-1; lsi>=0; lsi--){ if ((wex.sets[lsi].kind||'set')==='set'){ lastSetItem = wex.sets[lsi]; break; } }
      var values = lastSetItem ? Object.assign({}, lastSetItem.values) : blankSetValues(wex.fields);
      wex.sets.push({ kind:'set', id: uid('s'), values: values, restSec: null, done: false });
      save(); renderMain();
      break;
    }
    case 'add-rest-block': {
      var wexR = data.activeWorkout.exercises[el.dataset.wex*1];
      var defaultSec = wexR.defaultRestSec!=null ? wexR.defaultRestSec : 60;
      wexR.sets.push({ kind:'rest', id: uid('r'), seconds: defaultSec });
      save(); renderMain();
      break;
    }
    case 'remove-set': {
      var wex2 = data.activeWorkout.exercises[el.dataset.wex*1];
      wex2.sets.splice(el.dataset.set*1, 1);
      save(); renderMain();
      break;
    }
    case 'toggle-set-done': {
      var doneWex = data.activeWorkout.exercises[el.dataset.wex*1];
      var set = doneWex.sets[el.dataset.set*1];
      set.done = !set.done;
      save();
      el.classList.toggle('done', set.done);
      /* Optional (Settings): ticking a set off starts the rest its own play
         button would. A set with no rest is simply confirmed, and unticking
         leaves the timer alone. */
      if (set.done && data.settings.autoRest){
        var restAfter = effectiveRest(doneWex, set);
        if (restAfter) startTimer(restAfter);
      }
      break;
    }

    case 'edit-rest':
      ui.editingRest = el.dataset.wex+'-'+el.dataset.set;
      renderMain();
      focusIfPointer(document.getElementById('rest-edit-input'));
      break;
    case 'clear-rest': {
      data.activeWorkout.exercises[el.dataset.wex*1].sets[el.dataset.set*1].restSec = null;
      save(); renderMain();
      break;
    }
    case 'commit-rest': {
      var input = document.getElementById('rest-edit-input');
      var val = input.value.trim();
      var wex3 = data.activeWorkout.exercises[el.dataset.wex*1];
      var s3 = wex3.sets[el.dataset.set*1];
      s3.restSec = val==='' ? null : Math.max(0, parseInt(val,10)||0);
      ui.editingRest = null; save(); renderMain();
      break;
    }
    case 'start-timer': startTimer(parseInt(el.dataset.seconds,10)); break;

    case 'edit-rest-block':
      ui.editingRestBlock = el.dataset.wex+'-'+el.dataset.set;
      renderMain();
      focusIfPointer(document.getElementById('restblock-edit-input'));
      break;
    case 'commit-rest-block': {
      var rbinput = document.getElementById('restblock-edit-input');
      var rbval = rbinput.value.trim();
      var wexRB = data.activeWorkout.exercises[el.dataset.wex*1];
      var rbItem = wexRB.sets[el.dataset.set*1];
      rbItem.seconds = rbval==='' ? 0 : Math.max(0, parseInt(rbval,10)||0);
      ui.editingRestBlock = null; save(); renderMain();
      break;
    }

    case 'edit-default-rest':
      ui.editingDefaultRest = el.dataset.wex*1;
      renderMain();
      focusIfPointer(document.getElementById('default-rest-input'));
      break;
    case 'clear-default-rest': {
      data.activeWorkout.exercises[el.dataset.wex*1].defaultRestSec = null;
      save(); renderMain();
      break;
    }
    case 'commit-default-rest': {
      var dinput = document.getElementById('default-rest-input');
      var dval = dinput.value.trim();
      data.activeWorkout.exercises[el.dataset.wex*1].defaultRestSec = dval==='' ? null : Math.max(0, parseInt(dval,10)||0);
      ui.editingDefaultRest = null; save(); renderMain();
      break;
    }

    case 'confirm-remove-exercise': armOrConfirm(el, function(){
      data.activeWorkout.exercises.splice(el.dataset.wex*1, 1);
      save(); renderMain();
    }); break;

    case 'add-rest-between-exercises': {
      data.activeWorkout.exercises.push({ kind:'rest', id: uid('r'), seconds: 60 });
      save(); renderMain();
      break;
    }
    case 'remove-exercise-block': {
      data.activeWorkout.exercises.splice(el.dataset.wex*1, 1);
      save(); renderMain();
      break;
    }
    case 'edit-top-rest':
      ui.editingTopRest = el.dataset.wex*1;
      renderMain();
      focusIfPointer(document.getElementById('toprest-edit-input'));
      break;
    case 'commit-top-rest': {
      var trinput = document.getElementById('toprest-edit-input');
      var trval = trinput.value.trim();
      data.activeWorkout.exercises[el.dataset.wex*1].seconds = trval==='' ? 0 : Math.max(0, parseInt(trval,10)||0);
      ui.editingTopRest = null; save(); renderMain();
      break;
    }

    case 'confirm-discard-workout': armOrConfirm(el, discardWorkout); break;
    case 'finish-workout': openFinishModal(); break;
    case 'finish-cancel': closeFinishModal(); break;
    case 'finish-toggle': {
      var fkey = el.dataset.key;
      ui.finishDraft[fkey] = !ui.finishDraft[fkey];
      /* full template update supersedes the times-only update */
      if (fkey==='updateTemplate' && ui.finishDraft.updateTemplate) ui.finishDraft.updateTimes = false;
      if (fkey==='updateTimes' && ui.finishDraft.updateTimes) ui.finishDraft.updateTemplate = false;
      renderFinishModal();
      break;
    }
    case 'finish-confirm': finishWorkout(); break;
    case 'minimize-workout': setView('home'); break;

    case 'new-exercise': openExerciseModal(null, null); break;
    case 'select-exercise': ui.selectedExerciseId = el.dataset.id; renderMain(); break;
    case 'toggle-chart': data.settings.chartOpen = !data.settings.chartOpen; save(); renderMain(); break;
    case 'deselect-exercise': ui.selectedExerciseId = null; renderMain(); break;
    case 'edit-exercise': {
      var exToEdit = data.exercises.find(function(e){return e.id===el.dataset.id;});
      openExerciseModal(exToEdit, null);
      break;
    }
    case 'confirm-delete-exercise': armOrConfirm(el, function(){
      var id = el.dataset.id;
      data.exercises = data.exercises.filter(function(e){return e.id!==id;});
      data.plans.forEach(function(p){ p.items = p.items.filter(function(it){return it.exerciseId!==id;}); });
      if (ui.selectedExerciseId===id) ui.selectedExerciseId = null;
      save(); renderMain();
    }); break;

    case 'ex-modal-close': closeExerciseModal(); break;
    case 'ex-use-existing': {
      /* the one you already have, instead of a second: into the plan or
         workout you were adding to, or opened in your exercises */
      var haveEx = data.exercises.find(function(e){return e.id===el.dataset.id;});
      if (!haveEx) break;
      var haveCtx = ui.pickerContextForModal;
      closeExerciseModal();
      if (haveCtx){
        if (haveCtx==='plan') currentPlan().items.push(newPlanItem(haveEx.id));
        else addExerciseToActiveWorkout(haveEx.id);
        ui.picker = null;
        save();
      } else {
        ui.selectedExerciseId = haveEx.id;
      }
      renderMain();
      break;
    }
    case 'ex-add-preset': {
      var type = el.dataset.type;
      var labels = {weight:'Weight', assisted:'Assisted', reps:'Reps', distance:'Distance', timer:'Target Time', time:'Time', rir:'RIR', rpe:'RPE'};
      if (!ui.exerciseDraft.fields.some(function(f){return f.type===type;})){
        var nf = { id: uid('f'), type: type, label: labels[type], unit: '' };
        if (type==='distance') nf.distScale = 'large';
        ui.exerciseDraft.fields.push(nf);
        ui.exerciseDraft.fieldsFromPreset = false;
        ui.exerciseDraft.fieldsTouched = true;
      }

    case 'ex-dist-scale': {
      ui.exerciseDraft.fields.forEach(function(f){
        if (f.type==='distance') f.distScale = el.dataset.scale==='small' ? 'small' : 'large';
      });
      renderExerciseModal();

    case 'ex-remove-field': {
      ui.exerciseDraft.fields = ui.exerciseDraft.fields.filter(function(f){return f.id!==el.dataset.fieldid;});
      ui.exerciseDraft.fieldsFromPreset = false;
      ui.exerciseDraft.fieldsTouched = true;

      refreshMusclePicker();

    }
    case 'ex-toggle-custom': ui.showCustomFieldForm = !ui.showCustomFieldForm; renderExerciseModal(); break;
    case 'ex-add-custom-field': {
      var cname = document.getElementById('ex-custom-name').value.trim();
      if (!cname) break;
      var ctype = document.getElementById('ex-custom-type').value;
      var cunit = document.getElementById('ex-custom-unit').value.trim();
      ui.exerciseDraft.fields.push({ id: uid('f'), type: ctype, label: cname, unit: ctype==='number' ? cunit : '' });
      ui.exerciseDraft.fieldsFromPreset = false;
      ui.exerciseDraft.fieldsTouched = true;
      ui.showCustomFieldForm = false;
      renderExerciseModal();
      break;
    }
    case 'ex-modal-save': {
      var d = ui.exerciseDraft;
      var ex = { id: d.editingId || uid('ex'), name: d.name.trim(), tags: d.tags.slice(),
                 muscles: { primary: d.muscles.primary.slice(), secondary: d.muscles.secondary.slice() },
                 /* records that the muscles were actually considered, so
                    clearing them all stays cleared instead of being re-filled
                    from the name. Set only when the picker was used or there
                    is something in it - otherwise editing the rest time of an
                    untagged exercise would silently retire its "add muscles"
                    prompt. */
                 musclesSet: !!(d.musclesTouched || d.muscles.primary.length || d.muscles.secondary.length),
                 fields: d.fields, defaultRestSec: d.defaultRestSec };
      /* kept in step so a build without this feature still finds its categories */
      ex.tag = tagsToLegacyTag(ex.tags);
      if (d.editingId){
        data.exercises = data.exercises.map(function(e){ return e.id===ex.id ? ex : e; });
      } else {
        data.exercises.push(ex);
      }
      save();
      if (ui.pickerContextForModal){
        if (ui.pickerContextForModal==='plan') currentPlan().items.push(newPlanItem(ex.id));
        else addExerciseToActiveWorkout(ex.id);
        save();
        ui.picker = null;
      }
      writeMuscleSidecar();
      if (!d.editingId) ui.selectedExerciseId = ex.id;
      closeExerciseModal();
      renderMain();
      break;
    }

    case 'open-profile': setView('profile'); break;
    case 'profile-back': setView(ui.lastTab || 'home'); break;
    case 'avatar-pick': {
      var afi = document.getElementById('avatar-file-input');
      if (afi) afi.click();
      break;
    }
    case 'crop-cancel': closeCropper(); break;
    case 'crop-reset':
      if (cropper){ cropper.z = 1; centerCropper(); drawCropper();
        var zs = document.getElementById('crop-zoom'); if (zs) zs.value = 1; }
      break;
    case 'crop-zoom-in': if (cropper) setCropZoom(cropper.z * 1.2); break;
    case 'crop-zoom-out': if (cropper) setCropZoom(cropper.z / 1.2); break;
    case 'crop-save': {
      if (cropper && cropper.mode==='photo'){ commitPhotoCrop(); break; }
      var cropped = commitCrop();
      if (cropped.error){
        ui.profileMessage = { kind:'error', text: cropped.error };
      } else if (!setAvatar(cropped.dataUrl)){
        ui.profileMessage = { kind:'error', text:'Not enough room left to save the picture. Export a backup, then try again.' };
      } else {
        ui.profileMessage = { kind:'ok', text:'Picture updated \u2014 stored at '+Math.round(cropped.bytes/1024)+' KB.' };
      }
      closeCropper();
      if (ui.view!=='profile') setView('profile'); else renderMain();
      break;
    }
    case 'avatar-remove': {
      profile().avatar = null;
      save();
      renderAvatarButton();
      ui.profileMessage = { kind:'ok', text:'Picture removed.' };
      renderMain();
      break;
    }

    case 'settings-open':
      ui.importPreview = null; ui.settingsMessage = null;
      renderSettingsModal(); document.getElementById('settings-modal').hidden = false;
      /* the answer arrives a tick later; redraw the row once it does */
      refreshPersisted(function(){
        if (!document.getElementById('settings-modal').hidden) renderSettingsModal();
      });
      break;
    case 'settings-close': closeSettings(); break;
    case 'request-persist': {
      data.persistRequested = true; save();
      requestPersisted(function(granted){
        ui.settingsMessage = granted
          ? { kind:'ok', text:'Protected. This browser will not clear your data to reclaim space \u2014 though clearing site data by hand still would, so keep exporting.' }
          : { kind:'error', text:'This browser turned the request down. It usually grants it once the app is installed to your home screen.' };
        renderSettingsModal();
      });
      break;
    }
    case 'about-toggle': {
      var aKey = el.dataset.key;
      ui.aboutOpen = (ui.aboutOpen === aKey) ? null : aKey;
      refreshAboutSections(aKey);
      break;
    }
    case 'theme': {
      var choice = el.dataset.themeChoice;
      data.settings.theme = (choice === 'light' || choice === 'dark') ? choice : 'system';
      save();
      applyTheme();
      renderSettingsModal();
      renderMain();
      break;
    }
    case 'unit-system': {
      var sys = el.dataset.sys === 'imperial' ? 'imperial' : 'metric';
      data.settings.weightUnit = sys === 'imperial' ? 'lb' : 'kg';
      data.settings.distanceSystem = sys;
      save(); renderSettingsModal(); renderMain();
      break;
    }
    case 'unit-distance': {
      data.settings.distanceSystem = el.dataset.sys === 'imperial' ? 'imperial' : 'metric';
      save(); renderSettingsModal(); renderMain();
      break;
    }
    case 'units-toggle': {
      ui.unitsOpen = !ui.unitsOpen;
      renderSettingsModal();
      break;
    }
    case 'body-type': {
      data.settings.bodyType = el.dataset.body==='female' ? 'female' : 'male';
      save(); resetMuscleMaps(); renderSettingsModal(); renderMain();
      break;
    }
    case 'unit-lb': data.settings.weightUnit='lb'; save(); renderSettingsModal(); renderMain(); break;
    case 'unit-kg': data.settings.weightUnit='kg'; save(); renderSettingsModal(); renderMain(); break;

    case 'export-json': {
      exportJSON(function(jsonStatus){
        ui.settingsMessage = exportMessage(jsonStatus, isNativeApp()
          ? 'Backup saved where you picked. Keep a copy off this phone too \u2014 uninstalling the app deletes everything in it.'
          : 'Backup saved. Move it somewhere that is not this browser \u2014 Files, iCloud Drive, or your computer.');
        renderSettingsModal();
      });
      break;
    }
    case 'export-html': {
      exportPortable(function(htmlStatus){
        ui.settingsMessage = exportMessage(htmlStatus,
          'Portable copy saved. Opening that file gives you the app with this data already in it, with no internet needed.');
        renderSettingsModal();
      });
      break;
    }
    case 'share-json': {
      stagePhotoBlobs(includePhotosInBackup(), function(){
        var jsonText = jsonBackupText();
        var jsonCarried = !!pendingPhotoBlobs;
        pendingPhotoBlobs = null;
        shareOrHold(jsonBackupName(), 'application/json', jsonText, function(jsonShare){
          if (jsonShare === 'saved'){ markExported(); if (jsonCarried) markPhotosExported(); }
          ui.settingsMessage = shareMessage(jsonShare, 'Backup shared.');
          renderSettingsModal();
        });
      });
      break;
    }
    case 'share-html': {
      stagePhotoBlobs(includePhotosInBackup(), function(){
        var htmlText = buildPortableHTML();
        var htmlCarried = !!pendingPhotoBlobs;
        pendingPhotoBlobs = null;
        shareOrHold(portableBackupName(), 'text/html', htmlText, function(htmlShare){
          if (htmlShare === 'saved'){ markExported(); if (htmlCarried) markPhotosExported(); }
          ui.settingsMessage = shareMessage(htmlShare, 'Portable copy shared.');
          renderSettingsModal();
        });
      });
      break;
    }
    case 'share-held': {
      var held = heldShare;
      heldShare = null;
      /* a fresh tap, and the file already made - the sheet opens this time */
      if (held) shareFile(held.filename, held.mime, held.content, function(heldStatus){
        held.cb(heldStatus === 'shared' ? 'saved' : heldStatus === 'blocked' ? 'failed' : heldStatus);
      });
      break;
    }
    case 'backup-nudge-dismiss':
      data.backupNudgeDismissedAt = Date.now();
      save(); renderMain();
      break;
    case 'backup-nudge-export': {
      var nudgeWas = data.backupNudgeDismissedAt;
      data.backupNudgeDismissedAt = Date.now();
      /* if photos are what is unprotected, the file has to carry them */
      if (photosSinceExport() > 0) ui.backupIncludePhotos = true;
      exportJSON(function(nudgeStatus){
        /* a save screen backed out of is not a backup - the reminder stays */
        if (nudgeStatus !== 'saved'){ data.backupNudgeDismissedAt = nudgeWas; save(); }
        renderMain();
      });
      break;
    }
    case 'save-alert-export':
      exportJSON(function(alertStatus){
        if (alertStatus === 'saved'){ saveAlertExported = true; renderSaveAlert(); }
      });
      break;
    case 'reload-app': location.reload(); break;
    case 'import-pick': {
      var fi = document.getElementById('import-file-input');
      if (fi) fi.click();
      break;
    }
    case 'import-cancel':
      ui.importPreview = null; ui.settingsMessage = null; renderSettingsModal(); break;
    case 'import-replace': {
      applyImportedData(ui.importPreview.data);
      ui.importPreview = null;
      ui.settingsMessage = { kind:'ok', text:'Data replaced with the backup.' };
      renderSettingsModal();
      renderMain();
      break;
    }
    case 'import-merge': {
      var addedCounts = mergeImportedData(ui.importPreview.data);
      ui.importPreview = null;
      var parts = [];
      if (addedCounts.exercises) parts.push(addedCounts.exercises+' exercise'+(addedCounts.exercises!==1?'s':''));
      if (addedCounts.plans) parts.push(addedCounts.plans+' plan'+(addedCounts.plans!==1?'s':''));
      if (addedCounts.workouts) parts.push(addedCounts.workouts+' workout'+(addedCounts.workouts!==1?'s':''));
      ui.settingsMessage = parts.length
        ? { kind:'ok', text:'Merged in '+parts.join(', ')+'. Nothing existing was changed.' }
        : { kind:'ok', text:'Nothing new to add \u2014 you already have everything in that backup.' };
      renderSettingsModal();
      renderMain();
      break;
    }

    case 'restore-apply': {
      applyImportedData(pendingRestore.data);
      pendingRestore = null;
      document.getElementById('restore-modal').hidden = true;
      setView('home');
      break;
    }
    case 'restore-keep':
      pendingRestore = null;
      document.getElementById('restore-modal').hidden = true;
      break;

    case 'confirm-reset-data': armOrConfirm(el, function(){
      data = defaultData(); save();
      clearMuscleSidecar();
      applyTheme();
      reconcilePhotoStore();   /* metadata is empty now, so this empties the store */
      ui.importPreview = null; ui.settingsMessage = null; ui.aboutOpen = null; ui.unitsOpen = false;
      document.getElementById('settings-modal').hidden = true;
      setView('home');
    }); break;

    case 'timer-pause-resume': {
      var tmr = runtime.timer;
      if (!tmr || tmr.done) break;
      if (timerIsRunning(tmr)){
        tmr.pausedRemainingMs = timerRemainingMs(tmr);   /* freeze */
      } else {
        tmr.endAt = Date.now() + tmr.pausedRemainingMs;  /* rebase off now */
        tmr.pausedRemainingMs = null;
      }
      persistTimer();
      renderTimerBar();
      break;
    }
    case 'timer-adjust': {
      var tAdj = runtime.timer;
      if (!tAdj || tAdj.done) break;
      var deltaMs = parseInt(el.dataset.delta,10) * 1000;
      if (timerIsRunning(tAdj)) tAdj.endAt = Math.max(Date.now(), tAdj.endAt + deltaMs);
      else tAdj.pausedRemainingMs = Math.max(0, tAdj.pausedRemainingMs + deltaMs);
      persistTimer();
      renderTimerBar();
      break;
    }
    case 'timer-dismiss':
      clearRestTimer();
      break;

    case 'progress-tab': {
      data.settings.progressTab = el.dataset.seg==='photos' ? 'photos' : 'sessions';
      ui.viewingWorkoutId = null;
      ui.photoMessage = null;
      save(); renderMain(); updateInProgressBar();
      break;
    }
    case 'photo-add': {
      if (ui.view!=='progress' || progressTab()!=='photos'){
        data.settings.progressTab = 'photos'; save();
        if (ui.view!=='progress') setView('progress'); else renderMain();
      }
      startPhotoCapture(ui.photoPose);
      break;
    }
    case 'photo-source': pickPhotoFrom(el.dataset.source); break;
    case 'photo-source-close': closePhotoSource(); break;
    case 'photo-pose':
      ui.photoPose = el.dataset.pose || null;
      ui.addingPose = false;
      renderMain();
      break;
    case 'pose-add': {
      ui.addingPose = true; renderMain();
      var poseInput = document.getElementById('new-pose-input');
      if (poseInput) poseInput.focus();
      break;
    }
    case 'pose-add-cancel': ui.addingPose = false; renderMain(); break;
    case 'pose-add-commit': {
      var npi = document.getElementById('new-pose-input');
      var poseName = npi ? npi.value.trim().slice(0,18) : '';
      ui.addingPose = false;
      if (poseName){
        var pid = poseName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid('pose');
        if (!photoPoses().filter(function(x){ return x.id===pid; }).length){
          photoPoses().push({ id: pid, label: poseName });
          save();
        }
        ui.photoPose = pid;
      }
      renderMain();
      break;
    }
    case 'photo-open':
      ui.viewingPhotoId = el.dataset.id; ui.compareOpen = false;
      renderMain(); updateInProgressBar();
      break;
    case 'photo-close': ui.viewingPhotoId = null; renderMain(); updateInProgressBar(); break;
    case 'photos-reveal': ui.photosRevealed = true; renderMain(); break;
    case 'photo-compare-open': {
      var seedPhoto = el.dataset.id ? photoById(el.dataset.id) : null;
      if (seedPhoto){ ui.photoPose = seedPhoto.pose; ui.compareB = seedPhoto.id; ui.compareA = null; }
      ui.viewingPhotoId = null;
      ui.compareOpen = true;
      renderMain(); updateInProgressBar();
      break;
    }
    case 'compare-close': ui.compareOpen = false; renderMain(); updateInProgressBar(); break;
    case 'compare-pose':
      ui.photoPose = el.dataset.pose; ui.compareA = null; ui.compareB = null;
      renderMain();
      break;
    case 'compare-pick':
      if (el.dataset.side==='a') ui.compareA = el.dataset.id; else ui.compareB = el.dataset.id;
      renderMain();
      break;
    case 'confirm-delete-photo': armOrConfirm(el, function(){ deletePhoto(el.dataset.id); }); break;

    case 'photo-backup-toggle':
      ui.backupIncludePhotos = el.dataset.on === '1';
      renderSettingsModal();
      break;
    case 'auto-rest-toggle':
      data.settings.autoRest = el.dataset.on === '1';
      save(); renderSettingsModal();
      break;
    case 'blur-photos-toggle':
      data.settings.blurPhotos = el.dataset.on === '1';
      if (!data.settings.blurPhotos) ui.photosRevealed = false;
      save(); renderSettingsModal(); renderMain();
      break;
    case 'export-photos':
      runPhotoZipExport(function(m){ ui.settingsMessage = m; renderSettingsModal(); });
      break;
    case 'share-photos':
      runPhotoZipShare(function(m){ ui.settingsMessage = m; renderSettingsModal(); });
      break;
    case 'photo-zip-save':
      runPhotoZipExport(function(m){ ui.photoMessage = m; renderMain(); });
      break;
    case 'photo-zip-share':
      runPhotoZipShare(function(m){ ui.photoMessage = m; renderMain(); });
      break;

    case 'heatmap-day-click':
      ui.historyFilterDate = (ui.historyFilterDate === el.dataset.date) ? null : el.dataset.date;
      renderMain();
      break;
    case 'view-workout-detail': ui.viewingWorkoutId = el.dataset.id; renderMain(); break;
    case 'back-to-history': ui.viewingWorkoutId = null; renderMain(); break;
    case 'confirm-delete-workout': armOrConfirm(el, function(){
      data.workouts = data.workouts.filter(function(w){return w.id!==el.dataset.id;});
      ui.viewingWorkoutId = null; save(); renderMain();
    }); break;
  }
}

/* --------------------------------------------------------- commit inputs */

function handlePlanSetCommit(kind, t){
  var item = currentPlan().items[t.dataset.idx*1];
  var set = item.sets[t.dataset.set*1];
  var ex = data.exercises.find(function(e){return e.id===item.exerciseId;});
  var field = ex ? ex.fields.find(function(f){return f.id===t.dataset.field;}) : null;
  if (!field) return;
  if (kind==='set-num'){
    var raw = t.value.trim();
    if (raw===''){ set.values[field.id] = null; }
    else {
      var n = parseDecimal(raw);
      if (isNaN(n)){ set.values[field.id] = null; t.value=''; }
      else {
        if (field.type==='weight') set.values[field.id] = displayToKg(n, data.settings.weightUnit);
        else if (field.type==='assisted') set.values[field.id] = displayToKg(Math.abs(n), data.settings.weightUnit);
        else if (field.type==='distance') set.values[field.id] = displayToMetres(n, distanceUnit(field));
        else if (field.type==='reps') set.values[field.id] = Math.round(n);
        else if (isEffortType(field.type)) set.values[field.id] = clampEffort(field.type, n);
        else set.values[field.id] = n;
        t.value = fieldDisplayValue(field, set.values[field.id], data.settings.weightUnit);
      }
    }
  } else if (kind==='set-time'){
    var raw2 = t.value.trim();
    var sec = raw2==='' ? null : mmssToSec(raw2);
    set.values[field.id] = sec;
    t.value = sec===null ? '' : secToMMSS(sec);
  } else if (kind==='set-text'){
    set.values[field.id] = t.value;
  }
  save();
}

function onFocusOut(e){
  var t = e.target;
  var planCommit = t.dataset ? t.dataset.planCommit : null;
  if (planCommit){ handlePlanSetCommit(planCommit, t); return; }
  var commit = t.dataset ? t.dataset.commit : null;
  if (!commit) return;
  switch(commit){
    case 'profile-name': {
      var pn = profile();
      pn.name = t.value.trim().slice(0,40);
      if (pn.name && !pn.createdAt) pn.createdAt = Date.now();
      t.value = pn.name;
      save(); renderAvatarButton();
      break;
    }
    case 'profile-username': {
      var pu = profile();
      pu.username = t.value.trim().replace(/^@+/,'').replace(/\s+/g,'').slice(0,24);
      if (pu.username && !pu.createdAt) pu.createdAt = Date.now();
      t.value = pu.username;
      save(); renderAvatarButton();
      break;
    }
    case 'photo-note': {
      var ph = photoById(t.dataset.id);
      if (ph){ ph.note = t.value.trim().slice(0,140); t.value = ph.note; save(); }
      break;
    }
    case 'plan-category-name': {
      var catEntry = currentPlan().items[t.dataset.idx*1];
      if (catEntry){ catEntry.name = t.value.trim() || 'Untitled Category'; t.value = catEntry.name; save(); }
      break;
    }
    case 'plan-name': {
      var plan = data.plans.find(function(p){return p.id===t.dataset.id;});
      if (plan){ plan.name = t.value.trim() || 'Untitled Plan'; t.value = plan.name; save(); }
      break;
    }
    case 'ex-tags': ui.exerciseDraft.tags = parseTagInput(t.value); break;
    case 'ex-default-rest': {
      var val = t.value.trim();
      ui.exerciseDraft.defaultRestSec = val==='' ? null : Math.max(0, parseInt(val,10)||0);
      t.value = ui.exerciseDraft.defaultRestSec==null ? '' : ui.exerciseDraft.defaultRestSec;
      break;
    }
    case 'workout-name': {
      if (data.activeWorkout){ data.activeWorkout.name = t.value.trim() || 'Workout'; t.value = data.activeWorkout.name; save(); }
      break;
    }
    case 'set-num': {
      var wex = data.activeWorkout.exercises[t.dataset.wex*1];
      var set = wex.sets[t.dataset.set*1];
      var field = wex.fields.find(function(f){return f.id===t.dataset.field;});
      var raw = t.value.trim();
      if (raw===''){ set.values[field.id] = null; }
      else {
        var n = parseDecimal(raw);
        if (isNaN(n)){ set.values[field.id] = null; t.value=''; }
        else {
          if (field.type==='weight') set.values[field.id] = displayToKg(n, data.settings.weightUnit);
          else if (field.type==='assisted') set.values[field.id] = displayToKg(Math.abs(n), data.settings.weightUnit);
          else if (field.type==='distance') set.values[field.id] = displayToMetres(n, distanceUnit(field));
          else if (field.type==='reps') set.values[field.id] = Math.round(n);
          else if (isEffortType(field.type)) set.values[field.id] = clampEffort(field.type, n);
          else set.values[field.id] = n;
          t.value = fieldDisplayValue(field, set.values[field.id], data.settings.weightUnit);
        }
      }
      save();
      break;
    }
    case 'set-time': {
      var wex2 = data.activeWorkout.exercises[t.dataset.wex*1];
      var set2 = wex2.sets[t.dataset.set*1];
      var field2 = wex2.fields.find(function(f){return f.id===t.dataset.field;});
      var raw2 = t.value.trim();
      var sec = raw2==='' ? null : mmssToSec(raw2);
      set2.values[field2.id] = sec;
      t.value = sec===null ? '' : secToMMSS(sec);
      save();
      break;
    }
    case 'set-text': {
      var wex3 = data.activeWorkout.exercises[t.dataset.wex*1];
      var set3 = wex3.sets[t.dataset.set*1];
      set3.values[t.dataset.field] = t.value;
      save();
      break;
    }
  }
}

function onInput(e){
  var t = e.target;
  if (t.id==='ex-name-input'){
    ui.exerciseDraft.name = t.value;
    if (autofillMuscles(ui.exerciseDraft)) refreshMusclePicker();
    if (autofillFields(ui.exerciseDraft)) refreshFieldsSection();
    refreshNameDependents();
    openNameSuggestions(t);
    return;
  }
  if (t.id==='ex-tags-input'){
    if (ui.exerciseDraft) ui.exerciseDraft.tags = parseTagInput(t.value);
    openTagSuggestions(t);
    return;
  }
  if (t.id==='picker-search'){ ui.picker.query = t.value; renderPickerResults(); return; }
  if (t.id==='exercise-search-input'){ ui.exerciseSearch = t.value; renderExerciseListResults(); return; }
}

function onChange(e){
  if (e.target.id==='ex-custom-type'){
    var unitInput = document.getElementById('ex-custom-unit');
    if (unitInput) unitInput.style.display = e.target.value==='number' ? '' : 'none';
  }
  if (e.target.id==='avatar-file-input'){
    var avFile = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!avFile) return;
    loadImageFromFile(avFile, function(res){
      if (res.error){
        ui.profileMessage = { kind:'error', text: res.error };
        renderMain();
        return;
      }
      openCropper(res.img);
    });
    return;
  }
  if (e.target.id==='photo-file-input'){
    var picFile = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!picFile) return;
    var pose = ui.photoDraftPose || photoPoses()[0].id;
    loadImageFromFile(picFile, function(res){
      if (res.error){
        ui.photoMessage = { kind:'error', text: res.error };
        renderMain();
        return;
      }
      loadPoseGhost(pose, function(ghost){
        openCropper(res.img, { mode:'photo', pose: pose, ghost: ghost });
      });
    });
    return;
  }
  if (e.target.id==='import-file-input'){
    var file = e.target.files && e.target.files[0];
    e.target.value = ''; /* allow re-picking the same file */
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var res = parseBackupText(String(reader.result));
      if (!res.ok){
        ui.importPreview = null;
        ui.settingsMessage = { kind:'error', text: res.error };
      } else {
        ui.importPreview = { data: res.data, exportedAt: res.exportedAt };
        ui.settingsMessage = null;
      }
      renderSettingsModal();
    };
    reader.onerror = function(){
      ui.importPreview = null;
      ui.settingsMessage = { kind:'error', text:'Could not read that file.' };
      renderSettingsModal();
    };
    reader.readAsText(file);
  }
}

function onKeyDown(e){
  if (e.key==='Enter'){
    var el = e.target.closest('[data-action-enter]');
    if (el){ e.preventDefault(); handleAction(el.dataset.actionEnter, el); return; }
  }
  if (e.key==='Escape'){
    var settingsModal = document.getElementById('settings-modal');
    var exModal = document.getElementById('exercise-modal');
    var finModal = document.getElementById('finish-modal');
    var cropModal = document.getElementById('cropper-modal');
    if (!cropModal.hidden){ closeCropper(); return; }
    if (!document.getElementById('photo-source-modal').hidden){ closePhotoSource(); return; }
    if (!exModal.hidden){ closeExerciseModal(); return; }
    if (!finModal.hidden){ closeFinishModal(); return; }
    if (!settingsModal.hidden){ closeSettings(); return; }
    if (ui.editingRest || ui.editingDefaultRest!==null){ ui.editingRest=null; ui.editingDefaultRest=null; renderMain(); return; }
  }
}

/* Android's back button - the APK's MainActivity asks here before doing
   anything itself. Closes the innermost thing that is open, the way Escape
   does, then steps out of a detail screen, then back to Home. False means
   there was nothing left to close, and the app may go to the background. */
var REST_EDITS = ['editingRest','editingDefaultRest','editingPlanRest','editingPlanSetRest','editingPlanRestBlock','editingRestBlock','editingTopRest'];
function handleBack(){
  if (combo.el){ comboClose(); return true; }
  if (infoPop.el){ hideFieldInfo(); return true; }
  if (!document.getElementById('cropper-modal').hidden){ closeCropper(); return true; }
  if (!document.getElementById('photo-source-modal').hidden){ closePhotoSource(); return true; }
  if (!document.getElementById('exercise-modal').hidden){ closeExerciseModal(); return true; }
  if (!document.getElementById('finish-modal').hidden){ closeFinishModal(); return true; }
  if (!document.getElementById('settings-modal').hidden){ closeSettings(); return true; }
  if (ui.picker){ handleAction('picker-close'); return true; }
  var editing = REST_EDITS.filter(function(k){ return ui[k] != null; });
  if (editing.length){ editing.forEach(function(k){ ui[k] = null; }); renderMain(); return true; }
  if (ui.view==='exercises' && ui.selectedExerciseId){ handleAction('deselect-exercise'); return true; }
  if (ui.view==='plans' && ui.selectedPlanId){ handleAction('deselect-plan'); return true; }
  if (ui.view==='progress'){
    if (ui.addingPose){ handleAction('pose-add-cancel'); return true; }
    if (ui.compareOpen){ handleAction('compare-close'); return true; }
    if (ui.viewingPhotoId){ handleAction('photo-close'); return true; }
    if (ui.viewingWorkoutId){ handleAction('back-to-history'); return true; }
  }
  if (ui.view==='profile'){ handleAction('profile-back'); return true; }
  /* a running workout is only minimised - it is still there to resume */
  if (ui.view!=='home'){ setView('home'); return true; }
  return false;
}
window.athleticismBack = handleBack;

function onClick(e){
  var btn = e.target.closest('[data-action]');
  if (btn){
    if (btn.tagName==='A') e.preventDefault();
    handleAction(btn.dataset.action, btn);
    return;
  }
  /* Only a press that began on the backdrop closes the pop-up. Selecting the
     name with the mouse and letting go past the card's edge also ends in a
     click on the backdrop, and it threw the whole draft away. */
  if (e.target !== pressStart) return;
  if (e.target.id==='settings-modal') closeSettings();
  if (e.target.id==='exercise-modal') closeExerciseModal();
  if (e.target.id==='finish-modal') closeFinishModal();
  if (e.target.id==='cropper-modal') closeCropper();
  if (e.target.id==='photo-source-modal') closePhotoSource();
}
var pressStart = null;
document.addEventListener('pointerdown', function(e){ pressStart = e.target; }, true);

/* ------------------------------------------------------------------ init */

/* ---- Drag to reorder / move between categories ---------------------------
   Uses Pointer Events rather than HTML5 drag-and-drop, because the latter
   does not fire on iOS Safari. Works with mouse and touch from one code path.
   Dragging a category heading carries its member exercises with it. ---- */

var drag = null;

function planDragTargets(){
  var els = document.querySelectorAll('#plan-items [data-drag-idx]');
  var list = [];
  for (var i=0;i<els.length;i++){
    var r = els[i].getBoundingClientRect();
    list.push({ el: els[i], idx: els[i].dataset.dragIdx*1, top: r.top, bottom: r.bottom, mid: r.top + r.height/2 });
  }
  return list;
}
function clearDropMarkers(){
  var m = document.querySelectorAll('.drop-before, .drop-after, .exit-active');
  for (var i=0;i<m.length;i++) m[i].classList.remove('drop-before','drop-after','exit-active');
}
/* exit zones sit just past a category's last member; hitting one means
   "below the heading, but outside it" */
function exitZoneAt(clientY){
  var zones = document.querySelectorAll('#plan-items [data-drop-exit]');
  for (var i=0;i<zones.length;i++){
    var r = zones[i].getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) return { el: zones[i], idx: zones[i].dataset.dropExit*1 };
  }
  return null;
}
function computeDropIndex(clientY, targets){
  for (var i=0;i<targets.length;i++){
    if (clientY < targets[i].mid) return targets[i].idx;
  }
  return currentPlan().items.length;
}
function onPointerDown(e){
  if (ui.view!=='plans' || !ui.selectedPlanId) return;
  var handle = e.target.closest ? e.target.closest('.drag-handle') : null;
  if (!handle) return;
  var host = handle.closest('[data-drag-idx]');
  if (!host) return;
  /* Before anything moves: a half-typed target commits by its card's position,
     and after the drop that position belongs to another card - and cancelling
     this press means nothing else would have blurred the field. */
  commitFocusedField();
  e.preventDefault();
  var items = currentPlan().items;
  var fromIdx = host.dataset.dragIdx*1;
  drag = {
    fromIdx: fromIdx,
    blockLen: planBlockLength(items, fromIdx),
    isCategory: itemKind(items[fromIdx])==='category',
    host: host,
    startY: e.clientY,
    active: false,
    dropIdx: null,
    exit: false
  };
  document.addEventListener('pointermove', onPointerMove, {passive:false});
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
}
function onPointerMove(e){
  if (!drag) return;
  if (!drag.active){
    if (Math.abs(e.clientY - drag.startY) < 5) return; /* ignore taps */
    drag.active = true;
    drag.host.classList.add('dragging');
    document.body.classList.add('is-dragging');
    if (!drag.isCategory) document.body.classList.add('dragging-exercise');
  }
  e.preventDefault();
  clearDropMarkers();

  /* an exit zone wins over the normal midpoint calculation when hovered */
  var exit = drag.isCategory ? null : exitZoneAt(e.clientY);
  if (exit){
    drag.dropIdx = exit.idx;
    drag.exit = true;
    exit.el.classList.add('exit-active');
    return;
  }
  drag.exit = false;

  var targets = planDragTargets();
  var idx = computeDropIndex(e.clientY, targets);
  /* can't drop a block inside itself */
  if (idx > drag.fromIdx && idx < drag.fromIdx + drag.blockLen) idx = drag.fromIdx;
  drag.dropIdx = idx;
  var match = null;
  for (var i=0;i<targets.length;i++){ if (targets[i].idx===idx){ match = targets[i]; break; } }
  if (match) match.el.classList.add('drop-before');
  else {
    var endZone = document.querySelector('[data-drop-end]');
    if (endZone) endZone.classList.add('drop-after');
  }
}
function onPointerUp(){
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerUp);
  if (!drag) return;
  var d = drag;
  drag = null;
  document.body.classList.remove('is-dragging','dragging-exercise');
  clearDropMarkers();
  if (d.host) d.host.classList.remove('dragging');
  if (d.active && d.dropIdx!==null && (d.dropIdx!==d.fromIdx || d.exit)){
    movePlanBlock(d.fromIdx, d.dropIdx, d.exit);
  }
}
document.addEventListener('pointerdown', onPointerDown);

document.addEventListener('click', onClick);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('focusout', onFocusOut);
document.addEventListener('keydown', onKeyDown);

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab-btn');
  if (!b) return;
  setView(b.dataset.tab);
});
document.querySelector('[data-action="settings-open"]').innerHTML = icon('settings');

function tick(){
  if (data.activeWorkout){
    if (ui.view!=='workout') updateInProgressBar();
    else {
      var elapsedEl = document.getElementById('workout-elapsed');
      if (elapsedEl) elapsedEl.textContent = fmtElapsed(Date.now()-data.activeWorkout.startedAt);
    }
  }
}
setInterval(tick, 1000);

document.addEventListener('visibilitychange', onVisible);
window.addEventListener('pageshow', onVisible);
window.addEventListener('focus', onVisible);

renderSettingsModal();
applyTheme();
watchSystemTheme();
renderAvatarButton();
setView('home');
restoreTimer();
/* ---- field explanation popover -----------------------------------------
   Hover on a mouse, tap or press-and-hold on touch. Built as a real element
   rather than title= so it works on iOS, matches the design, and can carry
   the whole scale rather than one line of text. */
var infoPop = { el:null, anchor:null, holdT:null };
function fieldInfoHTML(key){
  var d = FIELD_INFO[key];
  return '<div class="fi-title">'+esc(d.title)+'</div>'+
    '<div class="fi-body">'+esc(d.body)+'</div>'+
    (d.scale ? ('<div class="fi-scale">'+d.scale.map(function(s){
      return '<div class="fi-scale-row"><span class="fi-key">'+esc(s[0])+'</span><span>'+esc(s[1])+'</span></div>';
    }).join('')+'</div>') : '')+
    (d.foot?('<div class="fi-foot">'+esc(d.foot)+'</div>'):'');
}
function positionFieldInfo(){
  var el = infoPop.el, a = infoPop.anchor;
  if (!el || !a || !a.isConnected) return;
  var r = a.getBoundingClientRect(), m = 12, ins = safeInsets();
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.max(ins.left + m, Math.min(r.left + r.width/2 - w/2, window.innerWidth - ins.right - w - m));
  /* the edges it must stay inside, clear of the phone's bars */
  var minTop = ins.top + m, maxBottom = window.innerHeight - ins.bottom - m;
  var top = r.bottom + 10;
  var flip = (top + h > maxBottom) && (r.top - h - 10 >= minTop);
  if (flip) top = r.top - h - 10;
  top = Math.max(minTop, Math.min(top, maxBottom - h));
  el.style.left = left+'px';
  el.style.top = top+'px';
  el.classList.toggle('flip', flip);
  el.style.setProperty('--arrow-x', Math.max(16, Math.min(r.left + r.width/2 - left, w-16))+'px');
}
function hideFieldInfo(){
  clearTimeout(infoPop.holdT);
  if (infoPop.anchor) infoPop.anchor.removeAttribute('aria-describedby');
  if (infoPop.el && infoPop.el.parentNode) infoPop.el.parentNode.removeChild(infoPop.el);
  infoPop.el = null; infoPop.anchor = null;
}
function showFieldInfo(anchor){
  var key = anchor.getAttribute('data-info');
  if (!FIELD_INFO[key]) return;
  if (infoPop.anchor === anchor) return;
  hideFieldInfo();
  var el = document.createElement('div');
  el.className = 'field-pop';
  el.id = 'field-pop';
  el.setAttribute('role','tooltip');
  el.innerHTML = fieldInfoHTML(key);
  document.body.appendChild(el);
  infoPop.el = el; infoPop.anchor = anchor;
  anchor.setAttribute('aria-describedby','field-pop');
  positionFieldInfo();
  requestAnimationFrame(function(){ if (infoPop.el===el) el.classList.add('in'); });
}
function infoAnchorFrom(e){
  var t = e.target;
  return (t && t.closest) ? t.closest('[data-info]') : null;
}
document.addEventListener('pointerover', function(e){
  if (e.pointerType && e.pointerType!=='mouse') return;
  var a = infoAnchorFrom(e);
  if (a) showFieldInfo(a);
});
document.addEventListener('pointerout', function(e){
  if (e.pointerType && e.pointerType!=='mouse') return;
  var a = infoAnchorFrom(e);
  if (a && a===infoPop.anchor && !a.contains(e.relatedTarget)) hideFieldInfo();
});
document.addEventListener('pointerdown', function(e){
  var a = infoAnchorFrom(e);
  if (!a){ hideFieldInfo(); return; }
  if (e.pointerType==='mouse') return;
  clearTimeout(infoPop.holdT);
  infoPop.holdT = setTimeout(function(){ showFieldInfo(a); }, 380);
}, true);
['pointerup','pointercancel','pointerleave'].forEach(function(evt){
  document.addEventListener(evt, function(){ clearTimeout(infoPop.holdT); }, true);
});
/* Capture phase: a tap on the label must not fall through to the app's own
   click handling, and a tap anywhere else closes the popover. */
document.addEventListener('click', function(e){
  var a = infoAnchorFrom(e);
  if (!a) return;
  e.preventDefault(); e.stopPropagation();
  if (infoPop.anchor===a) hideFieldInfo(); else showFieldInfo(a);
}, true);
document.addEventListener('keydown', function(e){
  if (e.key==='Escape' && infoPop.el){ hideFieldInfo(); return; }
  var a = infoAnchorFrom(e);
  if (a && (e.key==='Enter' || e.key===' ')){
    e.preventDefault();
    if (infoPop.anchor===a) hideFieldInfo(); else showFieldInfo(a);
  }
});
document.addEventListener('focusout', function(e){
  if (e.target && e.target===infoPop.anchor) hideFieldInfo();
});
window.addEventListener('scroll', function(){ if (infoPop.el) hideFieldInfo(); }, true);
window.addEventListener('resize', function(){ if (infoPop.el) positionFieldInfo(); });

/* ------------------------------------------------- keyboard-aware dock */
function isTextField(el){
  if (!el) return false;
  if (el.isContentEditable) return true;
  if (el.tagName === 'TEXTAREA') return true;
  if (el.tagName !== 'INPUT') return false;
  return !/^(button|submit|reset|checkbox|radio|range|color|file|image)$/i.test(el.type || 'text');
}

/* Blurring does exactly what tapping elsewhere does - the field's focusout
   commits what was typed. This is for the moments when nothing else would:
   a drag that cancels the press, or the app being sent to the background,
   where iOS keeps the field focused and may then close the app outright. */
function commitFocusedField(){
  var el = document.activeElement;
  if (el && isTextField(el) && el.blur) el.blur();
}
document.addEventListener('visibilitychange', function(){ if (document.hidden) commitFocusedField(); });
window.addEventListener('pagehide', commitFocusedField);

/* Keeps the field being typed into clear of the keyboard, which the dock used
   to do by proxy. visualViewport is the part of the page the keyboard leaves. */
function keepFieldVisible(el){
  if (!isTextField(el)) return;
  var vv = window.visualViewport;
  var top = vv ? vv.offsetTop : 0;
  var bottom = top + (vv ? vv.height : window.innerHeight);
  /* a field tucked under the status bar is as hidden as one off-screen */
  var clearTop = Math.max(top, safeInsets().top);
  var r = el.getBoundingClientRect();
  if (r.bottom > bottom - 12 || r.top < clearTop + 8){
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

var kbTimer = null, kbHeading = null;
function setKeyboardOpen(on){
  clearTimeout(kbTimer);
  kbHeading = on;
  /* Re-rendering a card blurs and refocuses its input. Showing the dock a beat
     late keeps it from flashing in and out while you edit. */
  kbTimer = setTimeout(function(){
    kbHeading = null;
    /* the field can be gone again by now - see the observer below */
    document.body.classList.toggle('kb-open', on && isTextField(document.activeElement));
    if (on) keepFieldVisible(document.activeElement);
  }, on ? 0 : 140);
}

document.addEventListener('focusin', function(e){ if (isTextField(e.target)) setKeyboardOpen(true); });
document.addEventListener('focusout', function(e){ if (isTextField(e.target)) setKeyboardOpen(false); });

/* WebKit - so Safari, every other browser on an iPhone, and the home-screen
   app - takes focus away without any focusout when the focused field itself
   is removed from the page. Picking a name suggestion repaints the exercise
   form under the caret, and Return in a rest box redraws its card, so on an
   iPhone the dock stayed hidden after either until another field was tapped.
   Whatever removed the field changed the page, so that is the moment to ask
   whether anything is still being typed in. The rest timer repaints four
   times a second; once the dock is already on its way back, it is left be. */
new MutationObserver(function(){
  if (kbHeading === false || !document.body.classList.contains('kb-open')) return;
  if (!isTextField(document.activeElement)) setKeyboardOpen(false);
}).observe(document.body, { childList: true, subtree: true });

/* Android hides the keyboard on Back but leaves the field focused, so nothing
   said the typing was over and the dock stayed away with no keyboard in
   sight. The page growing back to full height is that signal; taking it as
   leaving the field also commits what was typed, as a tap elsewhere would.
   Android only - iOS blurs the field itself when its keyboard goes. The
   margins are generous because Chrome's own toolbar comes and goes by ~56px,
   and no keyboard is shorter than 150. */
var IS_ANDROID = /Android/i.test(navigator.userAgent);
var kbFullHeight = 0, kbSeenUp = false;
function watchKeyboardClose(){
  var h = window.visualViewport.height;
  var el = document.activeElement;
  if (!isTextField(el)){ kbFullHeight = h; kbSeenUp = false; return; }
  if (h < kbFullHeight - 150){ kbSeenUp = true; return; }
  if (kbSeenUp && h >= kbFullHeight - 90){ kbSeenUp = false; el.blur(); }
}
if (window.visualViewport){
  kbFullHeight = window.visualViewport.height;
  window.visualViewport.addEventListener('resize', function(){
    if (document.body.classList.contains('kb-open')) keepFieldVisible(document.activeElement);
    if (IS_ANDROID) watchKeyboardClose();
  });
}

/* iOS ignores user-scalable=no, so stop the pinch gesture itself. */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});

refreshPersisted(function(){});

if (pendingRestore) renderRestoreModal();

})();
</script>

if ('serviceWorker' in navigator && !window.Capacitor && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Athleticism: service worker did not register', e);
    });
  });
}
