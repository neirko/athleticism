function attachCropperGestures(){
  var canvas = document.getElementById('crop-canvas');
  if (!canvas) return;
  var slider = document.getElementById('crop-zoom');
  if (slider){
    slider.addEventListener('input', function(){ setCropZoom(slider.value*1); });
  }
  var ghostSlider = document.getElementById('crop-ghost');
  if (ghostSlider){
    ghostSlider.addEventListener('input', function(){
      if (!cropper) return;
      cropper.ghostAlpha = ghostSlider.value*1;
      drawCropper();
    });
  }
  function pointerList(){
    var ids = Object.keys(cropper.pointers);
    return ids.map(function(k){ return cropper.pointers[k]; });
  }
  canvas.addEventListener('pointerdown', function(e){
    if (!cropper) return;
    e.preventDefault();
    e.stopPropagation();
    canvas.setPointerCapture(e.pointerId);
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length === 2){
      cropper.pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      cropper.pinchZoom = cropper.z;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!cropper || !cropper.pointers[e.pointerId]) return;
    e.preventDefault();
    var prev = cropper.pointers[e.pointerId];
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length >= 2){
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if (cropper.pinchDist > 0){
        setCropZoom(cropper.pinchZoom * (dist / cropper.pinchDist));
      }
      return;
    }
    cropper.ox += dx;
    cropper.oy += dy;
    clampCropper();
    drawCropper();
  });
  function release(e){
    if (!cropper) return;
    delete cropper.pointers[e.pointerId];
    cropper.pinchDist = 0;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', function(e){
    if (!cropper) return;
    e.preventDefault();
    setCropZoom(cropper.z * (e.deltaY < 0 ? 1.12 : 1/1.12));
  }, { passive:false });
}
/* Re-encode only the square currently under the viewport. */
function commitCrop(){
  var c = cropper;
  if (!c) return { error:'Nothing to save.' };
  try{
    var out = document.createElement('canvas');
    out.width = AVATAR_PX;
    out.height = AVATAR_PX;
    var ctx = out.getContext('2d');
    var f = c.base * c.z;
    var sx = (-c.ox) / f;
    var sy = (-c.oy) / f;
    var sSide = c.viewW / f;
    ctx.drawImage(c.img, sx, sy, sSide, sSide, 0, 0, AVATAR_PX, AVATAR_PX);

    var q = AVATAR_QUALITY;
    var dataUrl = out.toDataURL('image/jpeg', q);
    while (dataUrlBytes(dataUrl) > AVATAR_MAX_BYTES && q > 0.4){
      q -= 0.15;
      dataUrl = out.toDataURL('image/jpeg', q);
    }
    if (!dataUrl || dataUrl.indexOf('data:image') !== 0) return { error:'Could not process that image.' };
    return { dataUrl: dataUrl, bytes: dataUrlBytes(dataUrl) };
  }catch(e){
    return { error:'Could not process that image.' };
  }
}

/* ---- Categories ---------------------------------------------------------
   plan.items is a FLAT sequence. A category entry acts as a section header;
   every exercise entry after it belongs to that category until the next
   category entry. Entries before any header are uncategorised. This keeps
   drag-and-drop to a single flat reorder instead of nested tree surgery. */

function newPlanCategory(){
  return { kind:'category', id: uid('cat'), name: 'New Category', collapsed: false };
}
function itemKind(it){ return it.kind || 'exercise'; }
/* A 'break' entry closes the category above it, so exercises can sit BELOW a
   category while staying outside it. Without it, position alone would always
   pull them back into the nearest heading above. */
function newPlanBreak(){ return { kind:'break', id: uid('brk') }; }
/* how many entries move together when this one is dragged:
   a category takes its members with it, an exercise moves alone */
function planBlockLength(items, idx){
  if (itemKind(items[idx]) !== 'category') return 1;
  var n = 1;
  for (var i=idx+1; i<items.length; i++){
    var k = itemKind(items[i]);
    if (k==='category' || k==='break') break;
    n++;
  }
  return n;
}
/* index of the category heading governing this entry, or -1 if uncategorised */
function owningCategoryIdx(items, idx){
  for (var i=idx-1; i>=0; i--){
    var k = itemKind(items[i]);
    if (k==='break') return -1;
    if (k==='category') return i;
  }
  return -1;
}
/* true when this entry is the last member of the category block it belongs to */
function isLastInCategory(items, idx){
  if (itemKind(items[idx])!=='exercise') return false;
  if (owningCategoryIdx(items, idx) === -1) return false;
  var next = items[idx+1];
  if (!next) return true;
  var nk = itemKind(next);
  return nk==='category' || nk==='break';
}
/* drop a break marker wherever it no longer separates anything */
function normalizePlanItems(items){
  var out = [];
  for (var i=0;i<items.length;i++){
    if (itemKind(items[i])!=='break'){ out.push(items[i]); continue; }
    var prev = out[out.length-1];
    if (!prev) continue;                                  /* nothing above to close */
    if (itemKind(prev)==='break') continue;               /* duplicate */
    if (owningCategoryIdx(out, out.length) === -1) continue; /* not inside a category */
    var next = items[i+1];
    if (!next) continue;                                  /* nothing below to separate */
    if (itemKind(next)==='category') continue;            /* next heading already closes it */
    out.push(items[i]);
  }
  return out;
}
function planExerciseCount(plan){
  return (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; }).length;
}
function movePlanBlock(fromIdx, toIdx, exitCategory){
  var plan = currentPlan();
  var items = plan.items;
  var len = planBlockLength(items, fromIdx);
  if (toIdx > fromIdx && toIdx < fromIdx + len) return; /* dropped inside itself */
  var moved = items.splice(fromIdx, len);
  var dest = toIdx > fromIdx ? toIdx - len : toIdx;
  /* dropping into a category's exit zone: close the category first, so the
     item lands below the heading but outside it */
  if (exitCategory && itemKind(moved[0])!=='category'){
    items.splice(dest, 0, newPlanBreak());
    dest++;
  }
  for (var i=0;i<moved.length;i++) items.splice(dest+i, 0, moved[i]);
  plan.items = normalizePlanItems(items);
  save(); renderMain();
}

function renderHeatmap(trainedSet, weeks, interactive){
  var countByDate = {};
  data.workouts.forEach(function(w){
    if (!w.completedAt) return;
    var c = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);
    countByDate[w.date] = (countByDate[w.date]||0) + c;
  });
  var today = new Date();
  var end = new Date(today);
  end.setDate(end.getDate() + (6-end.getDay()));
  var totalDays = weeks*7;
  var start = new Date(end);
  start.setDate(start.getDate()-totalDays+1);

  var cells = '';
  for (var i=0;i<totalDays;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    if (d > today){ cells += '<div class="heatmap-cell" style="visibility:hidden"></div>'; continue; }
    var iso = toLocalISO(d);
    var cnt = countByDate[iso] || 0;
    var level = cnt>0 ? (cnt>=12?4:cnt>=8?3:cnt>=4?2:1) : 0;
    var isToday = iso===toLocalISO(today);
    var isSelected = interactive && ui.historyFilterDate===iso;
    var cls = 'heatmap-cell' + (isToday?' today':'') + (isSelected?' selected':'');
    var titleTxt = iso + (cnt ? ': '+cnt+' sets' : '');
    if (interactive){
      cells += '<button class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'" data-action="heatmap-day-click" data-date="'+iso+'"></button>';
    } else {
      cells += '<div class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'"></div>';
    }
  }
  return '<div class="heatmap-wrap"><div class="heatmap">'+cells+'</div></div>'+
    '<div class="heatmap-legend"><span>Less</span>'+
    '<div class="heatmap-cell" data-level="0"></div><div class="heatmap-cell" data-level="1"></div>'+
    '<div class="heatmap-cell" data-level="2"></div><div class="heatmap-cell" data-level="3"></div>'+
    '<div class="heatmap-cell" data-level="4"></div><span>More</span></div>';
}

      listHtml += '<button class="split-item '+(p.id===plan.id?'active':'')+'" data-action="select-plan" data-id="'+p.id+'"><span>'+esc(p.name)+'</span>'+icon('chevronRight')+'</button>';
    });

    var rowsHtml = '';
    if (plan.items.length===0){
      rowsHtml = '<div class="empty-state"><p>No exercises yet.</p><p class="empty-sub">Add exercises to build this plan &mdash; set target weight, reps and rest for each set, just like an active workout. Group them into categories like Warm-up or Cooldown.</p></div>';
    } else {
      var hiddenUntilNextCategory = false;
      plan.items.forEach(function(entry, idx){
        var k = itemKind(entry);
        if (k==='category'){
          hiddenUntilNextCategory = !!entry.collapsed;
          rowsHtml += renderPlanCategoryHeader(idx, entry, plan);

        rowsHtml += renderPlanExerciseCard(idx);

      '<div class="split has-selection">'+
        '<div class="split-list">'+listHtml+'</div>'+

          '<div class="detail-head">'+
            '<input class="title-input" style="font-size:19px;font-weight:600;flex:1" data-commit="plan-name" data-id="'+plan.id+'" value="'+esc(plan.name)+'">'+
            '<button class="btn btn-ghost" data-action="confirm-delete-plan" data-id="'+plan.id+'">'+icon('trash')+' Delete</button>'+
          '</div>'+
          '<div id="plan-items">'+rowsHtml+'</div>'+
          '<div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;">'+
            '<button class="btn btn-ghost" data-action="open-plan-picker">'+icon('plus')+' Add Exercise</button>'+
            '<button class="btn btn-ghost" data-action="plan-add-category">'+icon('plus')+' Add Category</button>'+
            '<div style="flex:1"></div>'+
            '<button class="btn btn-primary" data-action="start-plan" data-id="'+plan.id+'" '+(planExerciseCount(plan)===0?'disabled':'')+'>'+icon('play')+' Start Workout</button>'+
          '</div>'+
          '<div id="plan-picker" hidden></div>'+
        '</div>'+
      '</div>';
  } else {
    var body = '';
    if (data.plans.length===0){
      body = '<div class="empty-state"><p>No plans yet.</p><p class="empty-sub">Build a reusable plan so you can start a workout in one click.</p><button class="btn btn-primary" data-action="new-plan">'+icon('plus')+' New Plan</button></div>';
    } else {
      body = '<div class="plan-grid">' + data.plans.map(function(p){
        var pc = planExerciseCount(p);
        return '<button class="plan-card" data-action="select-plan" data-id="'+p.id+'"><div class="plan-card-name">'+esc(p.name)+'</div><div class="plan-card-sub">'+pc+' exercise'+(pc!==1?'s':'')+'</div></button>';
      }).join('') + '</div>';
    }
    main.innerHTML = '<div class="section-title"><span>Plans</span><button class="btn btn-primary small" data-action="new-plan">'+icon('plus')+' New Plan</button></div>' + body;
  }
}

function renderPlanCategoryHeader(idx, entry, plan){
  var count = 0;
  for (var i=idx+1; i<plan.items.length; i++){
    var ck = itemKind(plan.items[i]);
    if (ck==='category' || ck==='break') break;
    if (ck==='exercise') count++;
  }
  return '<div class="cat-header" data-drag-idx="'+idx+'">'+
    '<button class="drag-handle" title="Drag to reorder">'+icon('grip')+'</button>'+
    '<button class="cat-caret '+(entry.collapsed?'collapsed':'')+'" data-action="plan-toggle-category" data-idx="'+idx+'" title="'+(entry.collapsed?'Expand':'Collapse')+'">'+icon('chevronDown')+'</button>'+
    '<input class="cat-name" data-commit="plan-category-name" data-idx="'+idx+'" value="'+esc(entry.name)+'">'+
    '<span class="cat-count">'+count+' exercise'+(count!==1?'s':'')+'</span>'+
    '<button class="icon-btn" data-action="plan-remove-category" data-idx="'+idx+'" title="Remove category (keeps exercises)">'+icon('x')+'</button>'+
  '</div>';
}

function movePlanItem(idx, dir){
  var plan = currentPlan();
  var j = idx+dir;
  if (j<0 || j>=plan.items.length) return;
  var tmp = plan.items[idx]; plan.items[idx]=plan.items[j]; plan.items[j]=tmp;
  save(); renderMain();
}

/* ------------------------------------------------------------ exercises */

/* ------------------------------------------------------- progress charts ---
   Metrics are derived from whatever fields an exercise actually has, so a
   handstand hold and a bench press both work without special-casing. Anything
   needing two fields at once (estimated 1RM, volume) only appears when both
   are present - an estimated 1RM on a skill hold would be noise dressed up as
   a number. */
var CHART_REG = {};
var chartSeq = 0;
var DAY_MS = 86400000;

function chSets(wex){ return wex.sets.filter(function(s){ return (s.kind||'set')==='set'; }); }
function chFields(wex, t){ return wex.fields.filter(function(f){ return f.type===t; }); }
function chVals(wex, t){
  var fs = chFields(wex, t), out = [];
  chSets(wex).forEach(function(s){
    fs.forEach(function(f){
      var v = s.values[f.id];
      if (v!==null && v!==undefined && v!=='' && !isNaN(v*1)) out.push(v*1);
    });
  });
  return out;
}
function chPairs(wex){
  var wf = chFields(wex,'weight')[0], rf = chFields(wex,'reps')[0];
  if (!wf || !rf) return [];
  var out = [];
  chSets(wex).forEach(function(s){
    var w = s.values[wf.id], r = s.values[rf.id];
    if (w!==null && w!==undefined && w!=='' && r!==null && r!==undefined && r!=='') out.push({w:w*1, r:r*1});
  });
  return out;
}
function chMax(a){ return a.length ? Math.max.apply(null, a) : null; }
function chMin(a){ return a.length ? Math.min.apply(null, a) : null; }
function chSum(a){ return a.length ? a.reduce(function(x,y){return x+y;},0) : null; }
function chAvg(a){ return a.length ? chSum(a)/a.length : null; }

function fmtWeightVal(v){
  var u = data.settings.weightUnit;
  var d = kgToDisplay(v, u);
  return (Math.round(d*10)/10) + ' ' + u;
}
function fmtWeightAxis(v){
  var d = kgToDisplay(v, data.settings.weightUnit);
  return String(Math.abs(d)>=100 ? Math.round(d) : Math.round(d*10)/10);
}

var CHART_METRICS = [
  { key:'top', label:'Top Set', needs:['weight'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'weight')); },
    value:fmtWeightVal, axis:fmtWeightAxis },
  { key:'bestreps', label:'Best Set', needs:['reps'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'reps')); },
    value:function(v){ return Math.round(v)+' reps'; }, axis:function(v){ return String(Math.round(v)); } },
  { key:'hold', label:'Longest Hold', needs:['time'], agg:'max',
    calc:function(w){ return chMax(chVals(w,'time')); },
    value:function(v){ return secToMMSS(Math.round(v)); }, axis:function(v){ return secToMMSS(Math.round(v)); } },
  { key:'totreps', label:'Total Reps', needs:['reps'], agg:'sum',
    calc:function(w){ return chSum(chVals(w,'reps')); },
    value:function(v){ return Math.round(v)+' reps'; }, axis:function(v){ return String(Math.round(v)); } },
  { key:'e1rm', label:'Est. 1RM', needs:['weight','reps'], agg:'max',
    calc:function(w){ var p=chPairs(w); return p.length ? Math.max.apply(null, p.map(function(x){ return x.w*(1+x.r/30); })) : null; },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Epley estimate from your heaviest set' },
  { key:'volume', label:'Session Volume', needs:['weight','reps'], agg:'sum',
    calc:function(w){ var p=chPairs(w); return p.length ? p.reduce(function(a,x){ return a+x.w*x.r; },0) : null; },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Weight multiplied by reps, summed across sets' },
  { key:'assist', label:'Least Assistance', needs:['assisted'], agg:'min',
    calc:function(w){ return chMin(chVals(w,'assisted')); },
    value:fmtWeightVal, axis:fmtWeightAxis, note:'Lower is better - less help each session' },
  { key:'rpe', label:'Avg RPE', needs:['rpe'], agg:'avg',
    calc:function(w){ return chAvg(chVals(w,'rpe')); },
    value:function(v){ return 'RPE '+(Math.round(v*10)/10); }, axis:function(v){ return String(Math.round(v*10)/10); },
    note:'Higher means the session felt harder' },
  { key:'rir', label:'Avg RIR', needs:['rir'], agg:'avg',
    calc:function(w){ return chAvg(chVals(w,'rir')); },
    value:function(v){ return 'RIR '+(Math.round(v*10)/10); }, axis:function(v){ return String(Math.round(v*10)/10); },
    note:'Lower means the session felt harder' }
];

function customNumberMetrics(ex){
  return ex.fields.filter(function(f){ return f.type==='number'; }).map(function(f){
    var suffix = f.unit ? (' '+f.unit) : '';
    return { key:'num:'+f.id, label:'Best '+f.label, needs:[], agg:'max', fieldId:f.id,
      calc:function(w){
        var out=[]; chSets(w).forEach(function(s){
          var v=s.values[f.id];
          if (v!==null && v!==undefined && v!=='' && !isNaN(v*1)) out.push(v*1);
        });
        return chMax(out);
      },
      value:function(v){ return (Math.round(v*100)/100)+suffix; },
      axis:function(v){ return String(Math.round(v*100)/100); } };
  });
}
function metricsFor(ex){
  var types = ex.fields.map(function(f){ return f.type; });
  var base = CHART_METRICS.filter(function(m){
    return m.needs.every(function(t){ return types.indexOf(t)>=0; });
  });
  return base.concat(customNumberMetrics(ex));
}
function combine(agg, vals){
  if (!vals.length) return null;
  if (agg==='max') return chMax(vals);
  if (agg==='min') return chMin(vals);
  if (agg==='sum') return chSum(vals);
  return chAvg(vals);
}
/* One point per session. Two entries of the same exercise in one workout are
   folded together with the metric's own aggregation, not silently plotted twice. */
function seriesFor(ex, metric){
  var pts = [];
  data.workouts.forEach(function(w){
    var vals = [];
    (w.exercises||[]).forEach(function(wex){
      if ((wex.kind||'exercise')!=='exercise' || wex.exerciseId!==ex.id) return;
      var v = metric.calc(wex);
      if (v!==null && v!==undefined && !isNaN(v)) vals.push(v);
    });
    var v = combine(metric.agg, vals);
    if (v===null) return;
    var t = w.completedAt || w.startedAt || (w.date ? new Date(w.date+'T12:00:00').getTime() : null);
    if (!t) return;
    pts.push({ t:t, v:v });
  });
  pts.sort(function(a,b){ return a.t-b.t; });
  return pts;
}

function chartDate(ms){
  return new Date(ms).toLocaleDateString(undefined, {day:'numeric', month:'short'});
}
function niceStep(span, target){
  if (span<=0) return 1;
  var raw = span/target, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), n = raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}

/* Registers a chart and returns the markup for it. paintCharts() fills it in
   once the browser has laid the container out and a real width exists. */
function chartBlock(ex, metric){
  var id = 'ch'+(++chartSeq);
  var pts = seriesFor(ex, metric);
  CHART_REG[id] = { points:pts, metric:metric };
  var head, foot = '';
  if (pts.length >= 3){
    var last = pts[pts.length-1], prev = pts[pts.length-2];
    var d = last.v - prev.v, cls = Math.abs(d) < 1e-9 ? '' : (d>0 ? 'up' : 'down');
    var sign = d>0 ? '+' : (d<0 ? '\u2212' : '');
    var deltaTxt = Math.abs(d) < 1e-9 ? 'no change' : (sign + metric.value(Math.abs(d)));
    head = '<div><div class="chart-value" data-chart-value="'+id+'">'+esc(metric.value(last.v))+'</div>'+
      '<div class="chart-sub" data-chart-sub="'+id+'"><span>'+esc(chartDate(last.t))+'</span>'+
      '<span class="chart-delta '+cls+'">'+esc(deltaTxt)+'</span></div></div>';
    var bestV = combine(metric.agg==='min'?'min':'max', pts.map(function(p){ return p.v; }));
    var best = pts.filter(function(p){ return p.v===bestV; }).pop();
    foot = '<div class="chart-foot">'+pts.length+' sessions'+
      (best && best!==pts[pts.length-1] ? (' &middot; best '+esc(metric.value(best.v))+' on '+esc(chartDate(best.t))) : '')+
      (metric.note ? ('<br>'+esc(metric.note)) : '')+'</div>';
  } else {
    var latest = pts.length ? pts[pts.length-1] : null;
    head = '<div><div class="chart-value">'+(latest ? esc(metric.value(latest.v)) : '\u2014')+'</div>'+
      '<div class="chart-sub">'+(latest ? esc(chartDate(latest.t)) : 'Nothing logged yet')+'</div></div>';
  }
  var opts = metricsFor(ex).map(function(m){
    return '<option value="'+esc(m.key)+'"'+(m.key===metric.key?' selected':'')+'>'+esc(m.label)+'</option>';
  }).join('');
  return '<div class="chart-card">'+
    '<div class="chart-top">'+head+
      '<select class="chart-metric" data-chart-metric="'+esc(ex.id)+'" aria-label="Chart metric">'+opts+'</select>'+
    '</div>'+
    '<div class="chart-plot" data-chart="'+id+'"></div>'+ foot +'</div>';
}

/* Below three sessions a line chart is a lie dressed as a trend, so show the
   readings themselves and say what's missing. */
function sparseHTML(pts, metric){
  if (!pts.length){
    return '<div class="chart-empty">No sessions logged yet'+
      '<span>Finish a workout with this exercise and it starts plotting here.</span></div>';
  }
  return '<div class="chart-empty">'+
    '<div class="chart-seed">'+pts.map(function(p){
      return '<div class="chart-seed-pill"><div class="chart-seed-val">'+esc(metric.value(p.v))+'</div>'+
        '<div class="chart-seed-day">'+esc(chartDate(p.t))+'</div></div>';
    }).join('')+'</div>'+
    '<span>'+(pts.length===1?'One session so far':'Two sessions so far')+
    ' \u2014 a third turns this into a chart.</span></div>';
}

function drawChart(el){
  var spec = CHART_REG[el.dataset.chart];
  if (!spec) return;
  var pts = spec.points, m = spec.metric;
  if (pts.length < 3){ el.innerHTML = sparseHTML(pts, m); return; }

  var W = el.clientWidth;
  if (!W) return;                                   /* hidden: paint when shown */
  var H = Math.max(158, Math.min(236, Math.round(W*0.44)));
  var padL = 46, padR = 14, padT = 14, padB = 26;
  var iw = W-padL-padR, ih = H-padT-padB;

  var vs = pts.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi===lo){ hi = lo + (Math.abs(lo)||1)*0.1; lo = lo - (Math.abs(lo)||1)*0.1; }
  var step = niceStep(hi-lo, 3);
  var yLo = Math.floor(lo/step)*step, yHi = Math.ceil(hi/step)*step;
  if (yHi===yLo) yHi = yLo + step;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t;
  if (t1===t0) t1 = t0 + DAY_MS;

  var X = function(t){ return padL + (t-t0)/(t1-t0)*iw; };
  var Y = function(v){ return padT + (1-(v-yLo)/(yHi-yLo))*ih; };
  var xy = pts.map(function(p){ return {x:X(p.t), y:Y(p.v), p:p}; });

  var g = '';
  for (var v=yLo; v<=yHi+1e-9; v+=step){
    var y = Y(v);
    g += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+
         '" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>'+
         '<text x="'+(padL-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ch-ax">'+esc(m.axis(v))+'</text>';
  }

  /* A break of three weeks or more is drawn dashed, so a lapse reads as a lapse
     rather than as a confident straight line through nothing. */
  var solid = [], bridges = [], run = [xy[0]];
  for (var i=1;i<xy.length;i++){
    if (xy[i].p.t - xy[i-1].p.t > 21*DAY_MS){
      solid.push(run); bridges.push([xy[i-1], xy[i]]); run = [xy[i]];
    } else run.push(xy[i]);
  }
  solid.push(run);
  var d = function(a){ return a.map(function(q,i){ return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1); }).join(' '); };

  var base = H-padB;
  var area = '<path d="'+d(xy)+' L'+xy[xy.length-1].x.toFixed(1)+' '+base+' L'+xy[0].x.toFixed(1)+' '+base+
             ' Z" fill="url(#chg'+el.dataset.chart+')"/>';
  var lines = bridges.map(function(b){
    return '<path d="'+d(b)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="3 6" '+
           'stroke-linecap="round" opacity=".45"/>';
  }).join('') + solid.filter(function(r){ return r.length>1; }).map(function(r){
    return '<path d="'+d(r)+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  }).join('');

  var dots = '';
  if (xy.length <= 40){
    dots = xy.slice(0,-1).map(function(q){
      return '<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4.2" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.4"/>';
    }).join('');
  }
  var lastQ = xy[xy.length-1];
  dots += '<circle cx="'+lastQ.x.toFixed(1)+'" cy="'+lastQ.y.toFixed(1)+'" r="9" fill="var(--accent)" opacity=".18"/>'+
          '<circle cx="'+lastQ.x.toFixed(1)+'" cy="'+lastQ.y.toFixed(1)+'" r="5.2" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.4"/>';

  var ticks = xy.length<=2 ? [0, xy.length-1] : (W<380 ? [0, xy.length-1] : [0, Math.floor((xy.length-1)/2), xy.length-1]);
  var xlab = ticks.filter(function(v,i,a){ return a.indexOf(v)===i; }).map(function(i){
    var q = xy[i];
    var anchor = i===0 ? 'start' : (i===xy.length-1 ? 'end' : 'middle');
    var x = i===0 ? padL : (i===xy.length-1 ? W-padR : q.x);
    return '<text x="'+x.toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+anchor+'" class="ch-ax">'+esc(chartDate(q.p.t))+'</text>';
  }).join('');

  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" '+
    'aria-label="'+esc(m.label)+' over '+pts.length+' sessions">'+
    '<defs><linearGradient id="chg'+el.dataset.chart+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="var(--accent)" stop-opacity="0.22"/>'+
      '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient>'+
    '<style>.ch-ax{font-family:var(--font-ui);font-size:11px;font-weight:700;fill:var(--text-faint);}</style></defs>'+
    g + area + lines + dots + xlab +
    '<line class="ch-guide" y1="'+padT+'" y2="'+base+'" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0"/>'+
    '<circle class="ch-cursor" r="5.6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.6" opacity="0"/>'+
    '<rect class="ch-hit" x="'+padL+'" y="0" width="'+iw+'" height="'+H+'" fill="transparent" style="cursor:crosshair"/></svg>';
  el._xy = xy;
}

/* Scrubbing: dragging across the plot swaps the big readout to that session
   instead of floating a tooltip, which is unusable with a thumb over it. */
function chartScrub(el, clientX){
  var xy = el._xy, spec = CHART_REG[el.dataset.chart];
  if (!xy || !spec) return;
  var r = el.getBoundingClientRect(), svg = el.querySelector('svg');
  if (!svg) return;
  var x = (clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  var best = 0;
  for (var i=1;i<xy.length;i++) if (Math.abs(xy[i].x-x) < Math.abs(xy[best].x-x)) best = i;
  var q = xy[best];
  var guide = el.querySelector('.ch-guide'), cur = el.querySelector('.ch-cursor');
  guide.setAttribute('x1', q.x); guide.setAttribute('x2', q.x); guide.setAttribute('opacity','.9');
  cur.setAttribute('cx', q.x); cur.setAttribute('cy', q.y); cur.setAttribute('opacity','1');
  var id = el.dataset.chart;
  var vEl = document.querySelector('[data-chart-value="'+id+'"]');
  var sEl = document.querySelector('[data-chart-sub="'+id+'"]');
  if (vEl) vEl.textContent = spec.metric.value(q.p.v);
  if (sEl) sEl.innerHTML = '<span>'+esc(chartDate(q.p.t))+'</span>';
}
function chartScrubEnd(el){
  var spec = CHART_REG[el.dataset.chart];
  var guide = el.querySelector('.ch-guide'), cur = el.querySelector('.ch-cursor');
  if (guide) guide.setAttribute('opacity','0');
  if (cur) cur.setAttribute('opacity','0');
  if (!spec || spec.points.length<2) return;
  var pts = spec.points, m = spec.metric, last = pts[pts.length-1], prev = pts[pts.length-2];
  var dd = last.v-prev.v, cls = Math.abs(dd)<1e-9 ? '' : (dd>0?'up':'down');
  var sign = dd>0?'+':(dd<0?'\u2212':'');
  var txt = Math.abs(dd)<1e-9 ? 'no change' : (sign+m.value(Math.abs(dd)));
  var id = el.dataset.chart;
  var vEl = document.querySelector('[data-chart-value="'+id+'"]');
  var sEl = document.querySelector('[data-chart-sub="'+id+'"]');
  if (vEl) vEl.textContent = m.value(last.v);
  if (sEl) sEl.innerHTML = '<span>'+esc(chartDate(last.t))+'</span><span class="chart-delta '+cls+'">'+esc(txt)+'</span>';
}

function paintCharts(){
  var els = document.querySelectorAll('[data-chart]');
  for (var i=0;i<els.length;i++) drawChart(els[i]);
}
var chartResizeT = null;
window.addEventListener('resize', function(){
  clearTimeout(chartResizeT);
  chartResizeT = setTimeout(paintCharts, 140);
});
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (!el || !el._xy) return;
  el._scrub = true;
  if (el.setPointerCapture && e.pointerId!==undefined){ try{ el.setPointerCapture(e.pointerId); }catch(_){} }
  chartScrub(el, e.clientX);
});
document.addEventListener('pointermove', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (!el || !el._xy) return;
  if (e.pointerType==='mouse' || el._scrub) chartScrub(el, e.clientX);
});
document.addEventListener('pointerup', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (el){ el._scrub = false; chartScrubEnd(el); }
});
document.addEventListener('pointerleave', function(e){
  var el = e.target.closest && e.target.closest('[data-chart]');
  if (el && e.pointerType==='mouse'){ el._scrub = false; chartScrubEnd(el); }
}, true);
document.addEventListener('change', function(e){
  var sel = e.target.closest && e.target.closest('[data-chart-metric]');

  data.settings.chartMetric = sel.value;

});

/* Focusing an input on a touch screen opens the keyboard, which reads as the
   app misbehaving. Only a mouse-and-keyboard setup gets the head start; on a

  if (!el || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return false;

}

/* --------------------------------------------------------- rest helper */

function effectiveRest(wex, set){
  if (set.restSec!==null && set.restSec!==undefined) return set.restSec;
  if (wex.defaultRestSec!==null && wex.defaultRestSec!==undefined) return wex.defaultRestSec;
  return null;
}
function renderDefaultRest(wexIdx, wex){
  if (ui.editingDefaultRest===wexIdx){
    return '<div class="ex-default-rest"><span>Default rest:</span>'+
      '<input id="default-rest-input" type="number" min="0" step="5" placeholder="sec" value="'+(wex.defaultRestSec==null?'':wex.defaultRestSec)+'" data-action-enter="commit-default-rest" data-wex="'+wexIdx+'">'+
      '<button class="rest-icon-btn" data-action="commit-default-rest" data-wex="'+wexIdx+'">'+icon('check')+'</button></div>';
  }
  return '<div class="ex-default-rest"><span>Default Rest: '+(wex.defaultRestSec!=null?fmtRest(wex.defaultRestSec):'not set')+'</span>'+
    '<button data-action="edit-default-rest" data-wex="'+wexIdx+'">Edit</button>'+
    (wex.defaultRestSec!=null?('<button data-action="clear-default-rest" data-wex="'+wexIdx+'">Clear</button>'):'')+
  '</div>';
}
function renderRestCell(wexIdx, setIdx, wex, set){
  var eff = effectiveRest(wex, set);
  var isCustom = set.restSec!==null && set.restSec!==undefined;
  if (ui.editingRest === (wexIdx+'-'+setIdx)){
    return '<div class="rest-cell">'+
      '<input id="rest-edit-input" class="num-input" style="max-width:60px;min-width:50px" type="number" min="0" step="5" placeholder="sec" value="'+(isCustom?set.restSec:(wex.defaultRestSec==null?'':wex.defaultRestSec))+'" data-action-enter="commit-rest" data-wex="'+wexIdx+'" data-set="'+setIdx+'">'+
      '<button class="rest-icon-btn" data-action="commit-rest" data-wex="'+wexIdx+'" data-set="'+setIdx+'">'+icon('check')+'</button>'+
    '</div>';
  }
  if (eff!==null){
    return '<div class="rest-cell">'+
      '<button class="rest-pill '+(isCustom?'custom':'')+'" data-action="edit-rest" data-wex="'+wexIdx+'" data-set="'+setIdx+'">'+fmtRest(eff)+'</button>'+
      (isCustom?('<button class="rest-icon-btn" data-action="clear-rest" data-wex="'+wexIdx+'" data-set="'+setIdx+'" title="Use default">'+icon('x')+'</button>'):'')+
      '<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+eff+'" title="Start rest timer">'+icon('play')+'</button>'+
    '</div>';
  }
  return '<div class="rest-cell"><button class="rest-add" data-action="edit-rest" data-wex="'+wexIdx+'" data-set="'+setIdx+'">+ Add rest</button></div>';
}

/* -------------------------------------------------------- active workout */

function startBlankWorkout(){
  data.activeWorkout = { id:uid('w'), planId:null, name:'Workout', date:todayISO(), startedAt:Date.now(), completedAt:null, exercises:[] };
  save(); setView('workout');
}
function startFromPlan(planId){
  var plan = data.plans.find(function(p){return p.id===planId;});
  if (!plan) return;
  var wExercises = plan.items.map(function(entry){
    if (itemKind(entry)==='category'){
      return { kind:'category', id:uid('cat'), name:entry.name };
    }
    if (itemKind(entry)==='break'){
      return { kind:'break', id:uid('brk') };
    }
    var ex = data.exercises.find(function(e){return e.id===entry.exerciseId;});
    if (!ex) return null;
    var fields = snapshotFields(ex);
    var sets = (entry.sets||[]).map(function(s){
      if ((s.kind||'set')==='rest'){ return { kind:'rest', id:uid('r'), seconds:s.seconds }; }
      return { kind:'set', id:uid('s'), values:Object.assign({}, s.values), restSec:s.restSec, done:false };
    });
    if (sets.length===0){ sets.push({ kind:'set', id:uid('s'), values:blankSetValues(fields), restSec:null, done:false }); }
    var effRest = (entry.defaultRestSec!==null && entry.defaultRestSec!==undefined) ? entry.defaultRestSec : (ex.defaultRestSec===undefined?null:ex.defaultRestSec);
    return { kind:'exercise', exerciseId:ex.id, name:ex.name, fields:fields, defaultRestSec:effRest, sets:sets };
  }).filter(Boolean);
  data.activeWorkout = { id:uid('w'), planId:plan.id, name:plan.name, date:todayISO(), startedAt:Date.now(), completedAt:null, exercises:wExercises };
  save(); setView('workout');
}
function addExerciseToActiveWorkout(exId){
  var ex = data.exercises.find(function(e){return e.id===exId;});
  if (!ex || !data.activeWorkout) return;
  var fields = snapshotFields(ex);
  data.activeWorkout.exercises.push({ kind:'exercise', exerciseId:ex.id, name:ex.name, fields:fields, defaultRestSec:(ex.defaultRestSec===undefined?null:ex.defaultRestSec), sets:[{kind:'set', id:uid('s'), values:blankSetValues(fields), restSec:null, done:false}] });
  save();
}
/* ---- Finish flow -------------------------------------------------------
   Finishing opens a confirmation sheet with up to three choices:
     1. save the logged values as next session's reference (greyed hints)
     2. push changed TARGET TIMES back into the source plan
     3. overwrite the whole source plan template with this session
   2 and 3 only appear when the workout came from a plan and actually
   differs from it. ---- */

function normVal(v){ return (v===null||v===undefined||v==='') ? null : v; }

function diffWorkoutVsPlan(w){
  if (!w.planId) return null;
  var plan = data.plans.find(function(p){return p.id===w.planId;});
  if (!plan) return null;
  var timesChanged = false, structureChanged = false;
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pItems = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  /* category headings and their order are part of the template too */
  function groupSig(list, nameOf, kindOf){
    return list.map(function(x){
      var k = kindOf(x);
      if (k==='category') return 'C:'+nameOf(x);
      if (k==='break') return 'B';
      return 'E';
    }).join('\u0000');
  }
  var wCats = groupSig(w.exercises, function(e){return e.name;}, function(e){return e.kind||'exercise';});
  var pCats = groupSig(plan.items||[], function(it){return it.name;}, itemKind);
  if (wCats !== pCats) structureChanged = true;
  if (wEx.length !== pItems.length) structureChanged = true;
  var n = Math.min(wEx.length, pItems.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pItems[i];
    if (we.exerciseId !== pi.exerciseId){ structureChanged = true; continue; }
    if (normVal(we.defaultRestSec) !== normVal(pi.defaultRestSec)) structureChanged = true;
    var wSets = we.sets || [], pSets = pi.sets || [];
    if (wSets.length !== pSets.length) structureChanged = true;
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      var ws = wSets[j], ps = pSets[j];
      var wk = ws.kind||'set', pk = ps.kind||'set';
      if (wk !== pk){ structureChanged = true; continue; }
      if (wk==='rest'){
        if (normVal(ws.seconds) !== normVal(ps.seconds)) structureChanged = true;
        continue;
      }
      if (normVal(ws.restSec) !== normVal(ps.restSec)) structureChanged = true;
      we.fields.forEach(function(f){
        if (f.type==='time') return; /* measured time is never part of the preset */
        var a = normVal(ws.values ? ws.values[f.id] : null);
        var b = normVal(ps.values ? ps.values[f.id] : null);
        if (a !== b){
          if (f.type==='timer') timesChanged = true;
          else structureChanged = true;
        }
      });
    }
  }
  return { plan: plan, timesChanged: timesChanged, structureChanged: structureChanged };
}

function planSetsFromWorkoutExercise(we){
  return (we.sets||[]).map(function(s){
    if ((s.kind||'set')==='rest') return { kind:'rest', id:uid('r'), seconds:s.seconds };
    var values = {};
    we.fields.forEach(function(f){
      if (f.type==='time') { values[f.id] = null; return; } /* measured stays unset in the preset */
      values[f.id] = s.values ? s.values[f.id] : null;
    });
    return { kind:'set', id:uid('s'), values:values, restSec:s.restSec };
  });
}

function applyPlanTimesUpdate(w, plan){
  var wEx = w.exercises.filter(function(e){ return (e.kind||'exercise')==='exercise'; });
  var pEx = (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; });
  var n = Math.min(wEx.length, pEx.length);
  for (var i=0;i<n;i++){
    var we = wEx[i], pi = pEx[i];
    if (we.exerciseId !== pi.exerciseId) continue;
    var timerFields = we.fields.filter(function(f){ return f.type==='timer'; });
    if (!timerFields.length) continue;
    var wSets = (we.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var pSets = (pi.sets||[]).filter(function(s){ return (s.kind||'set')==='set'; });
    var m = Math.min(wSets.length, pSets.length);
    for (var j=0;j<m;j++){
      timerFields.forEach(function(f){
        if (!pSets[j].values) pSets[j].values = {};
        pSets[j].values[f.id] = wSets[j].values ? wSets[j].values[f.id] : null;
      });
    }
  }
}

function applyPlanFullUpdate(w, plan){
  var items = [];
  w.exercises.forEach(function(we){
    var k = we.kind || 'exercise';
    if (k==='category'){ items.push({ kind:'category', id:uid('cat'), name:we.name, collapsed:false }); return; }
    if (k==='break'){ items.push(newPlanBreak()); return; }
    if (k!=='exercise') return; /* top-level rest blocks live inside the session, not the preset */
    items.push({ kind:'exercise', exerciseId: we.exerciseId, defaultRestSec: (we.defaultRestSec===undefined?null:we.defaultRestSec), sets: planSetsFromWorkoutExercise(we) });
  });
  plan.items = normalizePlanItems(items);
}

function openFinishModal(){
  var w = data.activeWorkout;
  if (!w) return;
  var d = diffWorkoutVsPlan(w);
  ui.finishDraft = {
    saveValues: true,
    updateTimes: false,
    updateTemplate: false,
    planName: d ? d.plan.name : null,
    timesChanged: d ? d.timesChanged : false,
    structureChanged: d ? d.structureChanged : false
  };
  document.getElementById('finish-modal').hidden = false;
  renderFinishModal();
}
function closeFinishModal(){
  ui.finishDraft = null;
  document.getElementById('finish-modal').hidden = true;
}
function renderFinishModal(){
  var wrap = document.getElementById('finish-modal');
  var f = ui.finishDraft;
  var w = data.activeWorkout;
  if (!f || !w){ wrap.innerHTML=''; return; }
  var doneSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);

  function toggleRow(key, title, sub, checked){
    return '<button class="toggle-row" data-action="finish-toggle" data-key="'+key+'">'+
      '<span class="toggle-box '+(checked?'on':'')+'">'+(checked?icon('check'):'')+'</span>'+
      '<span class="toggle-text"><span class="toggle-title">'+title+'</span><span class="toggle-sub">'+sub+'</span></span>'+
    '</button>';
  }

  var rows = toggleRow('saveValues', 'Save These Values for Next Time',
    'Next session shows them as greyed-out hints for this exercise.', f.saveValues);

  if (f.timesChanged){
    rows += toggleRow('updateTimes', 'Update Target Times in &ldquo;'+esc(f.planName)+'&rdquo;',
      'You changed preset times this session. Off keeps the plan&rsquo;s original times.', f.updateTimes);
  }
  if (f.structureChanged){
    rows += toggleRow('updateTemplate', 'Update the Whole Template',
      'Save this session&rsquo;s sets, targets and rests back into &ldquo;'+esc(f.planName)+'&rdquo;.', f.updateTemplate);
  }

  wrap.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><h2>Finish Workout</h2><button class="icon-btn" data-action="finish-cancel">'+icon('x')+'</button></div>'+
    '<div style="color:var(--text-dim);font-size:13.5px;margin-bottom:16px;">'+doneSets+' set'+(doneSets!==1?'s':'')+' completed &middot; '+fmtElapsed(Date.now()-w.startedAt)+'</div>'+
    rows+
    '<div style="display:flex;gap:10px;margin-top:18px;">'+
      '<button class="btn btn-ghost full-width" data-action="finish-cancel">Back</button>'+
      '<button class="btn btn-primary full-width" data-action="finish-confirm">Finish</button>'+
    '</div>'+
  '</div>';
}

function finishWorkout(){
  var w = data.activeWorkout;
  if (!w) return;
  var f = ui.finishDraft || { saveValues:true, updateTimes:false, updateTemplate:false };
  var d = diffWorkoutVsPlan(w);
  if (d){
    if (f.updateTemplate) applyPlanFullUpdate(w, d.plan);
    else if (f.updateTimes) applyPlanTimesUpdate(w, d.plan);
  }
  w.completedAt = Date.now();
  if (!f.saveValues) w.excludeFromReference = true;
  data.workouts.push(w);
  data.activeWorkout = null;
  closeFinishModal();
  clearRestTimer();
  save(); setView('home');
}
function discardWorkout(){
  data.activeWorkout = null;
  clearRestTimer();
  save(); setView('home');
}

function renderWorkout(){
  var main = document.getElementById('main');
  var w = data.activeWorkout;
  if (!w){ setView('home'); return; }
  var totalSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set';}).length : 0); },0);
  var doneSets = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);

  var html = '<div class="workout-head">'+
    '<div class="workout-head-left">'+
      '<button class="icon-btn" data-action="minimize-workout" title="Back to Home">'+icon('chevronLeft')+'</button>'+
      '<input class="title-input" data-commit="workout-name" value="'+esc(w.name)+'">'+
    '</div>'+
    '<div class="workout-head-right">'+
      '<span class="workout-meta" id="workout-elapsed">'+fmtElapsed(Date.now()-w.startedAt)+'</span>'+
      '<button class="btn btn-ghost" data-action="confirm-discard-workout">Discard</button>'+
      '<button class="btn btn-primary" data-action="finish-workout">Finish Workout</button>'+
    '</div>'+
  '</div>'+
  '<div class="workout-progress"><span id="workout-progress-count">'+doneSets+'/'+totalSets+'</span> sets completed</div>';

  if (w.exercises.length===0){
    html += '<div class="empty-state"><p>No exercises yet.</p><p class="empty-sub">Add your first exercise to start logging.</p></div>';
  } else {
    var hiddenUnderCategory = false;
    w.exercises.forEach(function(block, idx){
      var kind = block.kind || 'exercise';
      if (kind==='category'){
        hiddenUnderCategory = !!block.collapsed;
        html += renderWorkoutCategoryHeader(idx, block, w);
        return;
      }
      if (kind==='break'){
        hiddenUnderCategory = false;
        return;
      }
      if (hiddenUnderCategory) return;
      if (kind==='rest') html += renderTopRestBlock(idx, block);
      else html += renderExerciseCard(idx);
    });
  }
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
    '<button class="btn btn-ghost" data-action="open-workout-picker">'+icon('plus')+' Add Exercise</button>'+
    '<button class="btn btn-ghost" data-action="add-rest-between-exercises">'+icon('plus')+' Add Rest</button>'+
  '</div>'+
  '<div id="workout-picker" hidden></div>';

  main.innerHTML = html;
}

function renderWorkoutCategoryHeader(idx, block, w){
  var total = 0, done = 0;
  for (var i=idx+1; i<w.exercises.length; i++){
    var e = w.exercises[i];
    var k = e.kind || 'exercise';
    if (k==='category' || k==='break') break;
    if (k!=='exercise') continue;
    e.sets.forEach(function(s){
      if ((s.kind||'set')!=='set') return;
      total++; if (s.done) done++;
    });
  }
  var complete = total>0 && done===total;
  return '<div class="cat-header workout '+(complete?'complete':'')+'">'+
    '<button class="cat-caret '+(block.collapsed?'collapsed':'')+'" data-action="workout-toggle-category" data-wex="'+idx+'">'+icon('chevronDown')+'</button>'+
    '<span class="cat-title">'+esc(block.name)+'</span>'+
    '<span class="cat-count">'+done+'/'+total+'</span>'+
  '</div>';
}

function renderTopRestBlock(idx, block){
  var editing = ui.editingTopRest === idx;
  var body;
  if (editing){
    body = '<input id="toprest-edit-input" class="num-input" style="max-width:80px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(block.seconds==null?'':block.seconds)+'" data-action-enter="commit-top-rest" data-wex="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-top-rest" data-wex="'+idx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-weight:600;color:var(--text-dim);margin-right:4px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="edit-top-rest" data-wex="'+idx+'">'+fmtRest(block.seconds)+'</button>'+
      '<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+block.seconds+'" title="Start rest timer">'+icon('play')+'</button>';
  }
  return '<div class="ex-card rest-card">'+body+
    '<button class="rest-icon-btn" data-action="remove-exercise-block" data-wex="'+idx+'" style="margin-left:10px;" title="Remove">'+icon('trash')+'</button></div>';
}

function renderExerciseCard(wexIdx){
  var wex = data.activeWorkout.exercises[wexIdx];
  var unit = data.settings.weightUnit;
  var lastEntry = lastEntryFor(wex.exerciseId, data.activeWorkout.id);

  var headerCols = '<th></th>' + wex.fields.map(function(f){
    return fieldHeaderCell(f, unit);
  }).join('') + '<th>Rest</th><th></th><th></th>';

  var setCounter = 0;
  var rows = wex.sets.map(function(item, idx){
    var kind = item.kind || 'set';
    if (kind==='rest'){
      return renderRestBlockRow(wexIdx, idx, item, wex.fields.length);
    }
    var rowHtml = renderSetRow(wexIdx, idx, setCounter, wex, item, lastEntry, unit);
    setCounter++;
    return rowHtml;
  }).join('');

  return '<div class="ex-card" id="ex-card-'+wexIdx+'">'+
    '<div class="ex-card-head"><div><div class="ex-card-name">'+esc(wex.name)+'</div>'+renderDefaultRest(wexIdx, wex)+'</div>'+
    '<button class="btn btn-ghost" data-action="confirm-remove-exercise" data-wex="'+wexIdx+'">'+icon('trash')+' Remove</button></div>'+
    '<table class="set-table"><thead><tr>'+headerCols+'</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+
      '<button class="btn btn-ghost small" data-action="add-set" data-wex="'+wexIdx+'">'+icon('plus')+' Add Set</button>'+
      '<button class="btn btn-ghost small" data-action="add-rest-block" data-wex="'+wexIdx+'">'+icon('plus')+' Add Rest</button>'+
    '</div>'+
  '</div>';
}

function renderRestBlockRow(wexIdx, idx, item, fieldCount){
  var colspan = fieldCount + 2; /* # column + field columns + Rest column */
  var editing = ui.editingRestBlock === (wexIdx+'-'+idx);
  var body;
  if (editing){
    body = '<input id="restblock-edit-input" class="num-input" style="max-width:70px;min-width:56px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(item.seconds==null?'':item.seconds)+'" data-action-enter="commit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-right:6px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="edit-rest-block" data-wex="'+wexIdx+'" data-set="'+idx+'">'+fmtRest(item.seconds)+'</button>'+
      '<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+item.seconds+'" title="Start rest timer">'+icon('play')+'</button>';
  }
  return '<tr class="rest-block-row"><td colspan="'+colspan+'" style="text-align:center;">'+body+'</td>'+
    '<td></td>'+
    '<td><button class="rest-icon-btn" data-action="remove-set" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('trash')+'</button></td></tr>';
}

function renderSetRow(wexIdx, idx, setNumber, wex, set, lastEntry, unit){
  var lastSets = lastEntry ? lastEntry.sets.filter(function(x){ return (x.kind||'set')==='set'; }) : null;
  var lastSet = lastSets ? lastSets[setNumber] : null;
  var cells = '<td>'+(setNumber+1)+'</td>';
  wex.fields.forEach(function(f){
    var currentRaw = set.values[f.id];
    var hasCurrent = currentRaw!==null && currentRaw!==undefined && currentRaw!=='';
    var currentDisplay = hasCurrent ? fieldDisplayValue(f, currentRaw, unit) : '';
    var placeholderRaw = lastSet ? lastSet.values[f.id] : null;
    var placeholderDisplay = (placeholderRaw!==null && placeholderRaw!==undefined && placeholderRaw!=='') ? fieldDisplayValue(f, placeholderRaw, unit) : '';
    if (f.type==='text'){
      cells += '<td><input class="num-input" data-commit="set-text" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay)+'"></td>';
    } else if (f.type==='timer'){
      var targetSec = (currentRaw!==null && currentRaw!==undefined && currentRaw!=='') ? currentRaw : null;
      cells += '<td><div class="rest-cell">'+
        '<input class="num-input" style="max-width:70px;min-width:56px;" data-commit="set-time" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||'mm:ss')+'">'+
        (targetSec!==null ? ('<button class="rest-icon-btn" data-action="start-timer" data-seconds="'+targetSec+'" title="Start countdown">'+icon('play')+'</button>') : '')+
      '</div></td>';
    } else if (f.type==='time'){
      cells += '<td><input class="num-input" data-commit="set-time" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="numeric" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||'mm:ss')+'"></td>';
    } else {
      cells += '<td><input class="num-input" data-commit="set-num" data-type="'+f.type+'" data-wex="'+wexIdx+'" data-set="'+idx+'" data-field="'+f.id+'" inputmode="'+(f.type==='rir'?'numeric':'decimal')+'" value="'+esc(currentDisplay)+'" placeholder="'+esc(placeholderDisplay||effortPlaceholder(f.type))+'"></td>';
    }
  });
  cells += '<td>'+renderRestCell(wexIdx, idx, wex, set)+'</td>';
  cells += '<td><button class="check-btn '+(set.done?'done':'')+'" data-action="toggle-set-done" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('check')+'</button></td>';
  cells += '<td><button class="rest-icon-btn" data-action="remove-set" data-wex="'+wexIdx+'" data-set="'+idx+'">'+icon('trash')+'</button></td>';
  return '<tr>'+cells+'</tr>';
}


/* ---- the Photos half of the Progress tab -------------------------------- */

function photosBlurred(){ return !!data.settings.blurPhotos && !ui.photosRevealed; }
function syncPhotoBlur(){ document.body.classList.toggle('photos-hidden', photosBlurred()); }

function poseChipsHTML(){
  var poses = photoPoses();

/* --------------------------------------------------------------- timer */

function ensureAudio(){
  if (!runtime.audioCtx){
    try{ runtime.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if (runtime.audioCtx && runtime.audioCtx.state==='suspended'){
    runtime.audioCtx.resume().catch(function(){});
  }
}
function beep(ctx, delay){
  if (!ctx) return;
  var t0 = ctx.currentTime + (delay||0);
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = 880;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.25, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
  o.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0+0.4);
}
function playCompletionBeep(){
  if (!runtime.audioCtx) return;
  beep(runtime.audioCtx, 0);
  beep(runtime.audioCtx, 0.45);
}
function flashTitleIfHidden(){
  if (!document.hidden) return;
  document.title = 'Rest done! \u2014 Athleticism';
  function restore(){ document.title = originalTitle; document.removeEventListener('visibilitychange', restore); }
  document.addEventListener('visibilitychange', restore);
}
/* The rest timer is driven by an absolute end timestamp, never by counting
   interval ticks. Phones suspend background pages, so a decrementing counter
   stalls exactly when you leave the app mid-set. Storing endAt means the
   remaining time is recomputed correctly whenever we come back - including
   after the page has been killed and reloaded. */

function timerRemainingMs(t){
  if (!t) return 0;
  if (t.pausedRemainingMs !== null && t.pausedRemainingMs !== undefined) return t.pausedRemainingMs;
  return Math.max(0, t.endAt - Date.now());
}
function timerIsRunning(t){
  return !!t && !t.done && (t.pausedRemainingMs === null || t.pausedRemainingMs === undefined);
}
function persistTimer(){
  data.restTimer = runtime.timer;
  save();
}
function clearRestTimer(){
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = null;
  runtime.timer = null;
  runtime.pendingBeep = false;
  data.restTimer = null;
  save();
  renderTimerBar();
}
function startTimer(seconds){
  ensureAudio();
  clearInterval(runtime.timerHandle);
  runtime.pendingBeep = false;
  runtime.timer = {
    totalSec: seconds,
    endAt: Date.now() + seconds*1000,
    pausedRemainingMs: null,
    done: false,
    doneAt: null
  };
  persistTimer();
  renderTimerBar();
  runtime.timerHandle = setInterval(timerTick, 250);
}
function timerTick(){
  var t = runtime.timer;
  if (!t){ clearInterval(runtime.timerHandle); runtime.timerHandle = null; return; }

  if (t.done){
    /* while the app is in the background, keep pushing the auto-dismiss out
       so a finished rest is still on screen when you come back to it */
    if (document.hidden){ t.doneAt = Date.now(); return; }
    if (Date.now() - t.doneAt > 8000) clearRestTimer();
    return;
  }
  if (!timerIsRunning(t)) return;

  if (timerRemainingMs(t) <= 0){
    t.done = true;
    t.doneAt = Date.now();
    persistTimer();
    if (document.hidden){
      runtime.pendingBeep = true;   /* audio is blocked while hidden - fire on return */
      flashTitleIfHidden();
    } else {
      playCompletionBeep();
    }
    renderTimerBar();
    return;
  }
  renderTimerBar();
}
/* Coming back to the app: recompute, settle any completion that happened
   while we were away, and sound it then. */
function onVisible(){
  if (document.hidden) return;
  if (!runtime.timer) return;
  ensureAudio();
  timerTick();
  if (runtime.pendingBeep){
    runtime.pendingBeep = false;
    playCompletionBeep();
  }
  renderTimerBar();
}
/* Restore a rest that was running when the page was last closed. */
function restoreTimer(){
  var t = data.restTimer;
  if (!t || typeof t.endAt !== 'number') return;
  var staleMs = Date.now() - (t.doneAt || t.endAt);
  if (t.done || timerRemainingMs(t) <= 0){
    /* a rest that finished long ago is not worth resurfacing */
    if (staleMs > 10*60*1000){ data.restTimer = null; save(); return; }
    t.done = true;
    if (!t.doneAt) t.doneAt = t.endAt;
  }
  runtime.timer = t;
  renderTimerBar();
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = setInterval(timerTick, 250);
}
function renderTimerBar(){
  var bar = document.getElementById('timerbar');
  if (!runtime.timer){ bar.className='timerbar'; bar.innerHTML=''; return; }
  var t = runtime.timer;
  var running = timerIsRunning(t);
  bar.className = 'timerbar show' + (t.done?' done':'');
  bar.innerHTML = '<div class="timerbar-inner">'+
    '<div class="timerbar-label">'+(t.done?'Rest Complete':(running?'Resting':'Paused'))+'</div>'+
    '<div class="timerbar-time">'+fmtElapsed(timerRemainingMs(t))+'</div>'+
    (!t.done ? (
      '<button data-action="timer-adjust" data-delta="-15">&minus;15</button>'+
      '<button data-action="timer-pause-resume">'+(running?icon('pause'):icon('play'))+'</button>'+
      '<button data-action="timer-adjust" data-delta="15">+15</button>'
    ) : '')+
    '<button data-action="timer-dismiss">'+icon('x')+'</button>'+
  '</div>';
}

/* -------------------------------------------------------------- modals */

function daysSince(ts){ return ts ? Math.floor((Date.now()-ts)/86400000) : null; }
function workoutsSinceExport(){
  var since = data.lastExportAt || 0;
  return data.workouts.filter(function(w){ return w.completedAt && w.completedAt > since; }).length;
}
/* Nudge only once there is something real to lose. */
function backupIsStale(){
  var n = workoutsSinceExport();
  if (n === 0) return false;
  var dismissed = data.backupNudgeDismissedAt;
  if (dismissed && (Date.now()-dismissed) < 7*86400000) return false;
  if (!data.lastExportAt) return n >= 5;
  return n >= 8 || daysSince(data.lastExportAt) >= 30;
}
function lastExportLine(){
  if (!data.lastExportAt) return 'Never exported';
  var d = daysSince(data.lastExportAt);
  var when = d===0 ? 'today' : (d===1 ? 'yesterday' : d+' days ago');
  var n = workoutsSinceExport();
  return 'Last export '+when+(n ? ' \u00b7 '+n+' workout'+(n!==1?'s':'')+' since' : '');
}

/* ------------------------------------------------------- confirm-arm ui */

var armedButtons = new WeakSet();
var armTimers = new WeakMap();
function armOrConfirm(el, onConfirm){
  if (armedButtons.has(el)){
    clearTimeout(armTimers.get(el));
    armedButtons.delete(el);
    onConfirm();
  } else {
    armedButtons.add(el);
    el.dataset.originalLabel = el.innerHTML;
    el.innerHTML = 'Confirm?';
    el.classList.add('btn-danger');
    var t = setTimeout(function(){
      armedButtons.delete(el);
      el.innerHTML = el.dataset.originalLabel;
      el.classList.remove('btn-danger');
    }, 2500);
    armTimers.set(el, t);
  }
}

function handleAction(action, el){
  switch(action){

    case 'start-plan': startFromPlan(el.dataset.id); break;
    case 'goto-plans': setView('plans'); break;
    case 'goto-history':
      data.settings.progressTab = 'sessions'; save();
      setView('progress');
      break;

    case 'new-plan': {
      var p = { id: uid('plan'), name: 'New Plan', items: [] };
      data.plans.push(p); save();
      ui.selectedPlanId = p.id;
      setView('plans');
      break;
    }
    case 'select-plan': ui.selectedPlanId = el.dataset.id; renderMain(); break;
    case 'deselect-plan': ui.selectedPlanId = null; renderMain(); break;

      data.plans = data.plans.filter(function(p){return p.id!==el.dataset.id;});

    }); break;

    case 'plan-add-category': {
      currentPlan().items.push(newPlanCategory());
      save(); renderMain();

    case 'plan-toggle-category': {
      var catItem = currentPlan().items[el.dataset.idx*1];

      save(); renderMain();
      break;

    case 'plan-remove-category': {

      for (var plsi=pItem.sets.length-1; plsi>=0; plsi--){ if ((pItem.sets[plsi].kind||'set')==='set'){ pLastSet = pItem.sets[plsi]; break; } }
      var pValues = pLastSet ? Object.assign({}, pLastSet.values) : blankSetValues(pFields);

      save(); renderMain();

    }
    case 'plan-add-rest-block': {
      var pItemR = currentPlan().items[el.dataset.idx*1];

    }
    case 'plan-remove-set': {

    case 'plan-clear-set-rest': {
      currentPlan().items[el.dataset.idx*1].sets[el.dataset.set*1].restSec = null;
      save(); renderMain();
      break;
    }
    case 'plan-commit-set-rest': {

    }
    case 'plan-edit-rest-block':
      ui.editingPlanRestBlock = el.dataset.idx+'-'+el.dataset.set;
      renderMain();
      focusIfPointer(document.getElementById('planrestblock-edit-input'));

    }
    case 'add-rest-block': {

    }
    case 'commit-default-rest': {
      var dinput = document.getElementById('default-rest-input');
      var dval = dinput.value.trim();
      data.activeWorkout.exercises[el.dataset.wex*1].defaultRestSec = dval==='' ? null : Math.max(0, parseInt(dval,10)||0);

    case 'confirm-remove-exercise': armOrConfirm(el, function(){

    }); break;

    case 'add-rest-between-exercises': {

      save(); renderMain();
      break;
    }
    case 'remove-exercise-block': {
      data.activeWorkout.exercises.splice(el.dataset.wex*1, 1);
      save(); renderMain();
      break;
    }
    case 'edit-top-rest':
      ui.editingTopRest = el.dataset.wex*1;
      renderMain();

    case 'commit-top-rest': {
      var trinput = document.getElementById('toprest-edit-input');
      var trval = trinput.value.trim();
      data.activeWorkout.exercises[el.dataset.wex*1].seconds = trval==='' ? 0 : Math.max(0, parseInt(trval,10)||0);
      ui.editingTopRest = null; save(); renderMain();

    }

    case 'confirm-discard-workout': armOrConfirm(el, discardWorkout); break;
    case 'finish-workout': openFinishModal(); break;
    case 'finish-cancel': closeFinishModal(); break;
    case 'finish-toggle': {

      /* full template update supersedes the times-only update */

      if (fkey==='updateTimes' && ui.finishDraft.updateTimes) ui.finishDraft.updateTemplate = false;

    case 'minimize-workout': setView('home'); break;

    case 'new-exercise': openExerciseModal(null, null); break;
    case 'select-exercise': ui.selectedExerciseId = el.dataset.id; renderMain(); break;
    case 'toggle-chart': data.settings.chartOpen = !data.settings.chartOpen; save(); renderMain(); break;
    case 'deselect-exercise': ui.selectedExerciseId = null; renderMain(); break;
    case 'edit-exercise': {

    case 'confirm-delete-exercise': armOrConfirm(el, function(){

      if (!ui.exerciseDraft.fields.some(function(f){return f.type===type;})){

    case 'ex-toggle-custom': ui.showCustomFieldForm = !ui.showCustomFieldForm; renderExerciseModal(); break;
    case 'ex-add-custom-field': {

      var cunit = document.getElementById('ex-custom-unit').value.trim();

      var d = ui.exerciseDraft;
      var ex = { id: d.editingId || uid('ex'), name: d.name.trim(), tag: d.tag.trim(), fields: d.fields, defaultRestSec: d.defaultRestSec };
      if (d.editingId){
        data.exercises = data.exercises.map(function(e){ return e.id===ex.id ? ex : e; });
      } else {
        data.exercises.push(ex);

    }
    case 'crop-cancel': closeCropper(); break;
    case 'crop-reset':

        var zs = document.getElementById('crop-zoom'); if (zs) zs.value = 1; }
      break;
    case 'crop-zoom-in': if (cropper) setCropZoom(cropper.z * 1.2); break;
    case 'crop-zoom-out': if (cropper) setCropZoom(cropper.z / 1.2); break;
    case 'crop-save': {
      if (cropper && cropper.mode==='photo'){ commitPhotoCrop(); break; }
      var cropped = commitCrop();
      if (cropped.error){
        ui.profileMessage = { kind:'error', text: cropped.error };
      } else if (!setAvatar(cropped.dataUrl)){
        ui.profileMessage = { kind:'error', text:'Not enough room left in this browser to save the picture. Export a backup, then try again.' };
      } else {
        ui.profileMessage = { kind:'ok', text:'Picture updated \u2014 stored at '+Math.round(cropped.bytes/1024)+' KB.' };
      }
      closeCropper();
      if (ui.view!=='profile') setView('profile'); else renderMain();
      break;
    }
    case 'avatar-remove': {
      profile().avatar = null;
      save();
      renderAvatarButton();
      ui.profileMessage = { kind:'ok', text:'Picture removed.' };
      renderMain();
      break;
    }

    case 'settings-open':
      ui.importPreview = null; ui.settingsMessage = null;
      renderSettingsModal(); document.getElementById('settings-modal').hidden = false; break;
    case 'settings-close':
      ui.importPreview = null; ui.settingsMessage = null;
      document.getElementById('settings-modal').hidden = true; break;
    case 'unit-lb': data.settings.weightUnit='lb'; save(); renderSettingsModal(); renderMain(); break;
    case 'unit-kg': data.settings.weightUnit='kg'; save(); renderSettingsModal(); renderMain(); break;

    case 'export-json': {
      exportJSON(function(okJson){
        ui.settingsMessage = okJson
          ? { kind:'ok', text:'Backup saved. Move it somewhere that is not this browser \u2014 Files, iCloud Drive, or your computer.' }
          : { kind:'error', text:'Could not create the file. Try again, or use a different browser.' };
        renderSettingsModal();
      });
      break;
    }
    case 'export-html': {
      exportPortable(function(okHtml){
        ui.settingsMessage = okHtml
          ? { kind:'ok', text:'Portable copy saved. Opening that file gives you the app with this data already in it, with no internet needed.' }
          : { kind:'error', text:'Could not create the file. Try again, or use a different browser.' };
        renderSettingsModal();
      });
      break;
    }
    case 'share-json': {
      stagePhotoBlobs(includePhotosInBackup(), function(){
        var jsonText = jsonBackupText();
        pendingPhotoBlobs = null;
        shareFile(jsonBackupName(), 'application/json', jsonText, function(sent){
          if (sent){
            markExported();
            ui.settingsMessage = { kind:'ok', text:'Backup shared.' };
          }
          renderSettingsModal();
        });
      });
      break;
    }
    case 'share-html': {
      stagePhotoBlobs(includePhotosInBackup(), function(){
        var htmlText = buildPortableHTML();
        pendingPhotoBlobs = null;
        shareFile(portableBackupName(), 'text/html', htmlText, function(sent){
          if (sent){
            markExported();
            ui.settingsMessage = { kind:'ok', text:'Portable copy shared.' };
          }
          renderSettingsModal();
        });
      });
      break;
    }
    case 'backup-nudge-dismiss':
      data.backupNudgeDismissedAt = Date.now();
      save(); renderMain();
      break;
    case 'backup-nudge-export':
      data.backupNudgeDismissedAt = Date.now();
      exportJSON(function(){ renderMain(); });
      break;
    case 'import-pick': {
      var fi = document.getElementById('import-file-input');
      if (fi) fi.click();
      break;
    }
    case 'import-cancel':
      ui.importPreview = null; ui.settingsMessage = null; renderSettingsModal(); break;
    case 'import-replace': {
      applyImportedData(ui.importPreview.data);
      ui.importPreview = null;
      ui.settingsMessage = { kind:'ok', text:'Data replaced with the backup.' };
      renderSettingsModal();
      renderMain();
      break;
    }
    case 'import-merge': {
      var addedCounts = mergeImportedData(ui.importPreview.data);
      ui.importPreview = null;
      var parts = [];
      if (addedCounts.exercises) parts.push(addedCounts.exercises+' exercise'+(addedCounts.exercises!==1?'s':''));
      if (addedCounts.plans) parts.push(addedCounts.plans+' plan'+(addedCounts.plans!==1?'s':''));
      if (addedCounts.workouts) parts.push(addedCounts.workouts+' workout'+(addedCounts.workouts!==1?'s':''));
      ui.settingsMessage = parts.length
        ? { kind:'ok', text:'Merged in '+parts.join(', ')+'. Nothing existing was changed.' }
        : { kind:'ok', text:'Nothing new to add \u2014 you already have everything in that backup.' };
      renderSettingsModal();
      renderMain();
      break;
    }

    case 'restore-apply': {
      applyImportedData(pendingRestore.data);
      pendingRestore = null;
      document.getElementById('restore-modal').hidden = true;
      setView('home');
      break;
    }
    case 'restore-keep':
      pendingRestore = null;
      document.getElementById('restore-modal').hidden = true;
      break;

    case 'confirm-reset-data': armOrConfirm(el, function(){
      data = defaultData(); save();
      reconcilePhotoStore();   /* metadata is empty now, so this empties the store */
      ui.importPreview = null; ui.settingsMessage = null;
      document.getElementById('settings-modal').hidden = true;
      setView('home');
    }); break;

    case 'timer-pause-resume': {
      var tmr = runtime.timer;
      if (!tmr || tmr.done) break;
      if (timerIsRunning(tmr)){
        tmr.pausedRemainingMs = timerRemainingMs(tmr);   /* freeze */
      } else {
        tmr.endAt = Date.now() + tmr.pausedRemainingMs;  /* rebase off now */
        tmr.pausedRemainingMs = null;
      }
      persistTimer();
      renderTimerBar();
      break;
    }
    case 'timer-adjust': {
      var tAdj = runtime.timer;
      if (!tAdj || tAdj.done) break;
      var deltaMs = parseInt(el.dataset.delta,10) * 1000;
      if (timerIsRunning(tAdj)) tAdj.endAt = Math.max(Date.now(), tAdj.endAt + deltaMs);
      else tAdj.pausedRemainingMs = Math.max(0, tAdj.pausedRemainingMs + deltaMs);
      persistTimer();
      renderTimerBar();
      break;
    }
    case 'timer-dismiss':
      clearRestTimer();
      break;

    case 'progress-tab': {
      data.settings.progressTab = el.dataset.seg==='photos' ? 'photos' : 'sessions';
      ui.viewingWorkoutId = null;
      ui.photoMessage = null;
      save(); renderMain(); updateInProgressBar();
      break;
    }
    case 'photo-add': {
      if (ui.view!=='progress' || progressTab()!=='photos'){
        data.settings.progressTab = 'photos'; save();
        if (ui.view!=='progress') setView('progress'); else renderMain();
      }
      startPhotoCapture(ui.photoPose);
      break;
    }
    case 'photo-pose':
      ui.photoPose = el.dataset.pose || null;
      ui.addingPose = false;
      renderMain();
      break;
    case 'pose-add': {
      ui.addingPose = true; renderMain();
      var poseInput = document.getElementById('new-pose-input');
      if (poseInput) poseInput.focus();
      break;
    }
    case 'pose-add-cancel': ui.addingPose = false; renderMain(); break;
    case 'pose-add-commit': {
      var npi = document.getElementById('new-pose-input');
      var poseName = npi ? npi.value.trim().slice(0,18) : '';
      ui.addingPose = false;
      if (poseName){
        var pid = poseName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid('pose');
        if (!photoPoses().filter(function(x){ return x.id===pid; }).length){
          photoPoses().push({ id: pid, label: poseName });
          save();
        }
        ui.photoPose = pid;
      }
      renderMain();
      break;
    }
    case 'photo-open':
      ui.viewingPhotoId = el.dataset.id; ui.compareOpen = false;
      renderMain(); updateInProgressBar();
      break;
    case 'photo-close': ui.viewingPhotoId = null; renderMain(); updateInProgressBar(); break;
    case 'photos-reveal': ui.photosRevealed = true; renderMain(); break;
    case 'photo-compare-open': {
      var seedPhoto = el.dataset.id ? photoById(el.dataset.id) : null;
      if (seedPhoto){ ui.photoPose = seedPhoto.pose; ui.compareB = seedPhoto.id; ui.compareA = null; }
      ui.viewingPhotoId = null;
      ui.compareOpen = true;
      renderMain(); updateInProgressBar();

    }
    case 'compare-close': ui.compareOpen = false; renderMain(); updateInProgressBar(); break;
    case 'compare-pose':
      ui.photoPose = el.dataset.pose; ui.compareA = null; ui.compareB = null;
      renderMain();
      break;
    case 'compare-pick':
      if (el.dataset.side==='a') ui.compareA = el.dataset.id; else ui.compareB = el.dataset.id;
      renderMain();
      break;
    case 'confirm-delete-photo': armOrConfirm(el, function(){ deletePhoto(el.dataset.id); }); break;

    case 'photo-backup-toggle':
      ui.backupIncludePhotos = el.dataset.on === '1';
      renderSettingsModal();
      break;
    case 'blur-photos-toggle':
      data.settings.blurPhotos = el.dataset.on === '1';
      if (!data.settings.blurPhotos) ui.photosRevealed = false;
      save(); renderSettingsModal(); renderMain();
      break;
    case 'export-photos': {
      ui.settingsMessage = { kind:'ok', text:'Packing your photos\u2026' };
      renderSettingsModal();
      buildPhotosZip(function(bytes){
        if (!bytes){
          ui.settingsMessage = { kind:'error', text:'Could not build the photo archive.' };
        } else {
          ui.settingsMessage = downloadFile(photosZipName(), 'application/zip', bytes)
            ? { kind:'ok', text:'Photo archive saved \u2014 dated .jpg files in a .zip. It is for keeping, not for importing back.' }
            : { kind:'error', text:'Could not create the file.' };
        }
        renderSettingsModal();
      });

    case 'share-photos': {

function handlePlanSetCommit(kind, t){
  var item = currentPlan().items[t.dataset.idx*1];
  var set = item.sets[t.dataset.set*1];
  var ex = data.exercises.find(function(e){return e.id===item.exerciseId;});
  var field = ex ? ex.fields.find(function(f){return f.id===t.dataset.field;}) : null;
  if (!field) return;
  if (kind==='set-num'){
    var raw = t.value.trim();
    if (raw===''){ set.values[field.id] = null; }
    else {
      var n = parseFloat(raw);
      if (isNaN(n)){ set.values[field.id] = null; t.value=''; }
      else {
        if (field.type==='weight') set.values[field.id] = displayToKg(n, data.settings.weightUnit);
        else if (field.type==='assisted') set.values[field.id] = displayToKg(Math.abs(n), data.settings.weightUnit);
        else if (field.type==='reps') set.values[field.id] = Math.round(n);
        else if (isEffortType(field.type)) set.values[field.id] = clampEffort(field.type, n);
        else set.values[field.id] = n;
        t.value = fieldDisplayValue(field, set.values[field.id], data.settings.weightUnit);
      }
    }
  } else if (kind==='set-time'){
    var raw2 = t.value.trim();
    var sec = raw2==='' ? null : mmssToSec(raw2);
    set.values[field.id] = sec;
    t.value = sec===null ? '' : secToMMSS(sec);
  } else if (kind==='set-text'){
    set.values[field.id] = t.value;
  }
  save();
}

function onFocusOut(e){
  var t = e.target;
  var planCommit = t.dataset ? t.dataset.planCommit : null;
  if (planCommit){ handlePlanSetCommit(planCommit, t); return; }
  var commit = t.dataset ? t.dataset.commit : null;
  if (!commit) return;
  switch(commit){
    case 'profile-name': {
      var pn = profile();
      pn.name = t.value.trim().slice(0,40);
      if (pn.name && !pn.createdAt) pn.createdAt = Date.now();
      t.value = pn.name;
      save(); renderAvatarButton();
      break;
    }
    case 'profile-username': {
      var pu = profile();
      pu.username = t.value.trim().replace(/^@+/,'').replace(/\s+/g,'').slice(0,24);
      if (pu.username && !pu.createdAt) pu.createdAt = Date.now();
      t.value = pu.username;
      save(); renderAvatarButton();
      break;
    }
    case 'photo-note': {
      var ph = photoById(t.dataset.id);
      if (ph){ ph.note = t.value.trim().slice(0,140); t.value = ph.note; save(); }
      break;
    }
    case 'plan-category-name': {
      var catEntry = currentPlan().items[t.dataset.idx*1];
      if (catEntry){ catEntry.name = t.value.trim() || 'Untitled Category'; t.value = catEntry.name; save(); }
      break;
    }
    case 'plan-name': {
      var plan = data.plans.find(function(p){return p.id===t.dataset.id;});
      if (plan){ plan.name = t.value.trim() || 'Untitled Plan'; t.value = plan.name; save(); }
      break;
    }
    case 'ex-tag': ui.exerciseDraft.tag = t.value; break;
    case 'ex-default-rest': {
      var val = t.value.trim();
      ui.exerciseDraft.defaultRestSec = val==='' ? null : Math.max(0, parseInt(val,10)||0);
      t.value = ui.exerciseDraft.defaultRestSec==null ? '' : ui.exerciseDraft.defaultRestSec;
      break;
    }
    case 'workout-name': {
      if (data.activeWorkout){ data.activeWorkout.name = t.value.trim() || 'Workout'; t.value = data.activeWorkout.name; save(); }
      break;
    }
    case 'set-num': {
      var wex = data.activeWorkout.exercises[t.dataset.wex*1];
      var set = wex.sets[t.dataset.set*1];
      var field = wex.fields.find(function(f){return f.id===t.dataset.field;});
      var raw = t.value.trim();
      if (raw===''){ set.values[field.id] = null; }
      else {
        var n = parseFloat(raw);
        if (isNaN(n)){ set.values[field.id] = null; t.value=''; }
        else {
          if (field.type==='weight') set.values[field.id] = displayToKg(n, data.settings.weightUnit);
          else if (field.type==='assisted') set.values[field.id] = displayToKg(Math.abs(n), data.settings.weightUnit);
          else if (field.type==='reps') set.values[field.id] = Math.round(n);
          else if (isEffortType(field.type)) set.values[field.id] = clampEffort(field.type, n);
          else set.values[field.id] = n;
          t.value = fieldDisplayValue(field, set.values[field.id], data.settings.weightUnit);
        }
      }
      save();
      break;
    }
    case 'set-time': {
      var wex2 = data.activeWorkout.exercises[t.dataset.wex*1];
      var set2 = wex2.sets[t.dataset.set*1];
      var field2 = wex2.fields.find(function(f){return f.id===t.dataset.field;});
      var raw2 = t.value.trim();
      var sec = raw2==='' ? null : mmssToSec(raw2);
      set2.values[field2.id] = sec;
      t.value = sec===null ? '' : secToMMSS(sec);
      save();
      break;
    }
    case 'set-text': {
      var wex3 = data.activeWorkout.exercises[t.dataset.wex*1];
      var set3 = wex3.sets[t.dataset.set*1];
      set3.values[t.dataset.field] = t.value;
      save();
      break;
    }
  }
}
