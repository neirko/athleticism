var EXERCISE_MUSCLE_LOOKUP = (function(){
  var map = {};
  EXERCISE_MUSCLE_SEED.forEach(function(row){
    row[0].split('|').forEach(function(name){
      map[name] = { primary: row[1], secondary: row[2] };
    });
  });
  return map;
})();

/* Every spelling in a row points back at the row's first name, so whatever
   matched can be traced to one canonical exercise. Muscles and tracking
   fields then agree about what you typed - "pull ups" cannot fill one and
   not the other. */
var EXERCISE_CANONICAL = (function(){
  var map = {};
  EXERCISE_MUSCLE_SEED.forEach(function(row){
    var names = row[0].split('|');
    names.forEach(function(n){ map[n] = names[0]; });
  });
  return map;
})();

function normaliseExerciseName(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}

/* Keys with their spaces closed up, so "push up" can be found by someone who
   typed "pushup". Longest original key wins a collision. */
var SQUASHED_MUSCLE_LOOKUP = (function(){
  var map = {}, k, sq;
  for (k in EXERCISE_MUSCLE_LOOKUP){
    sq = k.replace(/ /g,'');
    if (!map[sq] || map[sq].key.length < k.length) map[sq] = { key: k, hit: EXERCISE_MUSCLE_LOOKUP[k] };
  }
  return map;
})();

/* Exact match, then the longest whole phrase inside the typed name, so
   "Weighted Barbell Bench Press" still finds "bench press".

   The last pass closes up spaces to make "pushup", "push-up" and "push up"
   one thing - but only across runs of WHOLE words. Searching the closed-up
   name for a closed-up key as a plain substring finds "run" inside "trunk
   rotation" and "rdl" inside "hurdle jump", and a confidently wrong
   auto-fill is worse than none at all. */
/* Returns the canonical name of whatever the typed text matched, or null. */
function lookupExerciseKey(name){
  var n = normaliseExerciseName(name);
  if (!n) return null;
  if (EXERCISE_CANONICAL[n]) return EXERCISE_CANONICAL[n];

  var best = null, bestLen = 0, k;
  for (k in EXERCISE_CANONICAL){
    if (k.length > bestLen && (' '+n+' ').indexOf(' '+k+' ') >= 0){
      best = EXERCISE_CANONICAL[k]; bestLen = k.length;
    }
  }
  if (best) return best;

  var words = n.split(' ');
  for (var len = words.length; len >= 1; len--){
    for (var i = 0; i + len <= words.length; i++){
      var cand = words.slice(i, i + len).join('');
      var tries = [cand];
      /* "crunches" -> "crunch", "dips" -> "dip" */
      if (cand.length > 3 && cand.slice(-2) === 'es') tries.push(cand.slice(0, -2));
      if (cand.length > 2 && cand.slice(-1) === 's') tries.push(cand.slice(0, -1));
      for (var t = 0; t < tries.length; t++){
        if (SQUASHED_MUSCLE_LOOKUP[tries[t]]) return EXERCISE_CANONICAL[SQUASHED_MUSCLE_LOOKUP[tries[t]].key];
      }
    }
  }
  return null;
}

function lookupExerciseMuscles(name){
  var k = lookupExerciseKey(name);
  return k ? EXERCISE_MUSCLE_LOOKUP[k] : null;
}

/* ---- Name suggestions ---------------------------------------------------
   The same table that fills in muscles also knows ~144 exercise names, so it
   may as well offer them while you type. A hint, not a menu: nothing appears
   until two characters are in, at most eight ever show, your own exercises
   come first, and typing straight past them costs nothing.

   Only the first name in each row is ever suggested - the rest are spellings
   kept for matching ("rdl", "hspu", "db bench press"), not names worth
   putting in front of anyone. */

function titleCaseExerciseName(s){
  return String(s).split(' ').map(function(w){
    return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  }).join(' ');
}

var EXERCISE_NAME_SUGGESTIONS = EXERCISE_MUSCLE_SEED.map(function(row){
  return titleCaseExerciseName(row[0].split('|')[0]);
});

var MAX_NAME_SUGGESTIONS = 8;
var MIN_SUGGEST_CHARS = 2;

/* Start of the name, or start of any word in it. "pr" finds Preacher Curl and
   Overhead Press; it does not find Scapular Retraction.

   Matching is against the name you can SEE, never against the hidden
   spellings the muscle lookup keeps. Typing "ba" and being offered "Bench
   Press" - because "barbell bench press" is one of its aliases - reads as a
   bug, however correct it is. Every suggestion visibly starts with what was
   typed.

   The spaces-closed-up pass is back now that we draw the list ourselves: a
   native <datalist> ran its own substring filter on top of ours and would
   never show "Push Up" to someone typing "pushup". It is prefix-only, so it
   cannot make "run" find "Trunk Rotation". */
function nameStartsWith(candidate, q){
  if (candidate.indexOf(q) === 0) return true;
  if ((' '+candidate).indexOf(' '+q) >= 0) return true;
  return candidate.replace(/ /g,'').indexOf(q.replace(/ /g,'')) === 0;
}

function exerciseNameSuggestions(query, excludeId){
  var q = normaliseExerciseName(query);
  if (q.length < MIN_SUGGEST_CHARS) return [];
  var out = [], seen = {};
  /* prefixed so a name like "constructor" cannot collide with Object.prototype,
     and spaces closed up so your own "Pushup" hides the built-in "Push Up" */
  function mark(n){ return 'k' + n.replace(/ /g,''); }

  /* what you actually train beats what was guessed for you */
  data.exercises.forEach(function(ex){
    if (out.length >= MAX_NAME_SUGGESTIONS) return;
    if (!ex.name || ex.id === excludeId) return;
    var n = normaliseExerciseName(ex.name);
    if (!n || seen[mark(n)] || n === q || !nameStartsWith(n, q)) return;
    seen[mark(n)] = 1;
    out.push(ex.name);
  });

  EXERCISE_NAME_SUGGESTIONS.forEach(function(label){
    if (out.length >= MAX_NAME_SUGGESTIONS) return;
    var n = normaliseExerciseName(label);
    if (seen[mark(n)] || n === q || !nameStartsWith(n, q)) return;
    seen[mark(n)] = 1;
    out.push(label);
  });

  return out;
}

/* ---- A name you already have ---------------------------------------------
   Workouts, charts and plans hold on to an exercise by its id, never by its
   name. A second "Pull Up" is therefore not a copy of the first: it starts
   with no history, and from then on every list shows two. Nothing stops you
   making one on purpose - the editor only makes sure it is on purpose.

   Names match the way the suggestions match them - case, spaces and
   punctuation ignored - plus the plural of one of yours ("Pull Ups"). Only
   that direction: taking an "s" off instead would flag "Bench Pres" as your
   Bench Press while it is still being typed. */
function exerciseNameKey(name){ return normaliseExerciseName(name).replace(/ /g,''); }
function existingExerciseNamed(name, exceptId){
  var k = exerciseNameKey(name);
  if (!k) return null;
  return data.exercises.find(function(ex){
    if (ex.id === exceptId) return false;
    var h = exerciseNameKey(ex.name);
    return !!h && (k === h || k === h+'s' || k === h+'es');
  }) || null;
}

/* The <datalist> is refilled as you type rather than carrying all 144 names,
   so tapping an empty field never drops a wall of options over the keyboard. */
function openNameSuggestions(input){
  var d = ui.exerciseDraft;
  if (!d) return comboClose();
  var names = exerciseNameSuggestions(input.value, d.editingId);
  /* yours are listed first; say which they are, because picking one of them
     here starts a second one rather than reusing it */
  var tags = names.map(function(n){
    var k = exerciseNameKey(n);
    return data.exercises.some(function(ex){ return ex.id !== d.editingId && exerciseNameKey(ex.name) === k; }) ? 'Yours' : '';
  });
  comboOpen(input, names, function(picked){
    input.value = picked;
    d.name = picked;
    /* the half-typed name matched nothing, so the muscles were cleared as you
       went - fill them from the name that was actually chosen */
    autofillMuscles(d);
    applyPreset(d, picked);
    renderExerciseModal();
  }, tags);
}

/* Tags are comma separated, so only the fragment after the last comma is
   being typed - suggest against that, and replace only that. */
function tagFragment(value){
  var parts = String(value||'').split(',');
  return { parts: parts, frag: parts[parts.length-1].trim().toLowerCase() };
}
function openTagSuggestions(input){
  var d = ui.exerciseDraft;
  if (!d) return comboClose();
  var cut = tagFragment(input.value);
  if (!cut.frag){ return comboClose(); }
  var used = cut.parts.slice(0,-1).map(function(t){ return t.trim().toLowerCase(); });
  var list = allTagOptions().filter(function(t){
    var lt = t.toLowerCase();
    return used.indexOf(lt) < 0 && lt !== cut.frag && lt.indexOf(cut.frag) === 0;
  }).slice(0, MAX_NAME_SUGGESTIONS);
  comboOpen(input, list, function(picked){
    var parts = tagFragment(input.value).parts;
    parts[parts.length-1] = (parts.length > 1 ? ' ' : '') + picked;
    input.value = parts.join(',');
    d.tags = parseTagInput(input.value);
  });
}

/* ---- Field presets ------------------------------------------------------
   Picking a name off the suggestion list is a deliberate act, so it may bring
   its tracking fields with it. Typing the same words by hand does not - that
   is the line between choosing a preset and naming an exercise.

   It only ever fills an EMPTY field list. Nothing you set is overwritten,
   nothing is removed, and every field it adds is editable exactly like one
   you added yourself.

   Codes, because most of the 144 want the same two columns:
     wr  weight + reps      (the default for anything not listed)
     r   reps               bodyweight
     t   measured time      holds and skills
     d   distance + time    long cardio, shown in km/mi
     ds  distance + time    short efforts, shown in m/ft
     wd  weight + distance  loaded carries */
var FIELD_SETS = {
  wr: [['weight','Weight'], ['reps','Reps']],
  r:  [['reps','Reps']],
  t:  [['time','Time']],
  d:  [['distance','Distance','large'], ['time','Time']],
  ds: [['distance','Distance','small'], ['time','Time']],
  wd: [['weight','Weight'], ['distance','Distance','small']]
};

var EXERCISE_FIELD_PRESET = (function(){
  var map = {};
  function set(code, names){ names.split('|').forEach(function(n){ map[n] = code; }); }

  set('r', 'push up|incline push up|decline push up|diamond push up|wide push up|archer push up|'+
           'pseudo planche push up|dip|bench dip|handstand push up|pike push up|pull up|chin up|'+
           'wide grip pull up|muscle up|inverted row|bodyweight squat|pistol squat|box jump|'+
           'jump squat|burpee|crunch|hanging leg raise|leg raise|knee raise|toes to bar|'+
           'russian twist|ab wheel|bicycle crunch|dead bug|mountain climber|superman|'+
           'back extension|nordic curl|glute bridge|kip up|six step|windmill|flare|swipe|'+
           'turtle|windshield wiper');

  set('t', 'handstand|forearm stand|dead hang|plank|side plank|hollow hold|l sit|v sit|'+
           'dragon flag|front lever|back lever|planche|human flag|headstand|crow pose|bridge|'+
           'neck bridge|wall sit|freeze|chair freeze|elbow freeze|headspin|toprock|jump rope|'+
           'battle ropes');

  set('d',  'running|cycling|swimming|rowing');
  set('ds', 'sprint');
  set('wd', 'farmer carry|sled push');

  return map;
})();

function presetFieldsFor(name){
  /* Same matcher the muscles use, so "pull ups" and "Squats" are recognised
     here too. A name nobody recognises still arrives with an empty form. */
  var key = lookupExerciseKey(name);
  if (!key) return null;
  var code = EXERCISE_FIELD_PRESET[key] || 'wr';
  return FIELD_SETS[code].map(function(spec){
    var f = { id: uid('f'), type: spec[0], label: spec[1], unit: '' };
    if (spec[2]) f.distScale = spec[2];
    return f;
  });
}

/* Returns true when it actually put something in. */
/* Fields are ours to change only while every one of them was put there by a
   guess and you have not touched the list yourself. */
function fieldsAreOurs(d){
  if (!d || d.fieldsTouched) return false;
  return d.fields.length === 0 || !!d.fieldsFromPreset;
}

function applyPreset(d, name){
  if (!fieldsAreOurs(d)) return false;
  var fields = presetFieldsFor(name);
  if (!fields) return false;
  d.fields = fields;
  d.fieldsFromPreset = true;
  d.flashFields = true;
  return true;
}

/* The typing counterpart, mirroring autofillMuscles: keeps up with the name
   while it is still a guess, and lets go the moment you edit the list. */
function autofillFields(d){
  if (!fieldsAreOurs(d)) return false;
  var next = presetFieldsFor(d.name);
  var shape = function(list){
    return (list||[]).map(function(f){ return f.type+':'+(f.distScale||''); }).join(',');
  };
  if (shape(next) === shape(d.fields)) return false;
  if (!next){
    if (!d.fields.length) return false;
    d.fields = [];
    d.fieldsFromPreset = false;
    return true;
  }
  d.fields = next;
  d.fieldsFromPreset = true;
  d.flashFields = true;
  return true;
}

/* ---- Migration ----------------------------------------------------------
   The old free-text Category was a single string on the exercise. It becomes
   the first entry of `tags`. Nothing is guessed into muscle slugs from it -
   "Chest" as a category does not prove the exercise trains the chest.

   `tag` is left behind, rewritten from `tags`, on purpose. An install shares
   one localStorage blob with whatever build last opened it, so a copy of the
   app without this feature must still find its categories where it left
   them. New code never reads it. */
function tagsToLegacyTag(tags){ return (tags||[]).join(', '); }

/* ---- Muscle side-car ----------------------------------------------------
   `tags` survives a build without this feature because `tag` carries it, and
   that build writes `tag` back. `muscles` has no such carrier: that build's
   exercise editor rebuilds the record from a fixed list of keys, so saving
   any single exercise there drops its muscles entirely and silently.

   So they are also kept under a second key, which a build that knows nothing
   about them cannot rewrite. It is only ever read back when `muscles` is
   missing from an exercise ALTOGETHER - which this build never does, since
   both the editor and the migration always write one - so a missing key is
   proof that something else rewrote that record. An empty-but-present
   `muscles` means the user cleared them by hand, and is never restored over. */
var MUSCLE_SIDECAR_KEY = 'athleticism_muscles_v1';

function readMuscleSidecar(){
  try{
    var raw = localStorage.getItem(MUSCLE_SIDECAR_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    return (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){ return {}; }
}
function writeMuscleSidecar(){
  var out = {};
  data.exercises.forEach(function(ex){
    if (!ex.muscles) return;
    if (!hasMuscleData(ex) && !ex.musclesSet) return;
    out[ex.id] = {
      primary: (ex.muscles.primary||[]).slice(),
      secondary: (ex.muscles.secondary||[]).slice(),
      musclesSet: !!ex.musclesSet
    };
  });
  try{ localStorage.setItem(MUSCLE_SIDECAR_KEY, JSON.stringify(out)); }
  catch(e){ /* a full quota costs the safety net, not the app */ }
}
function clearMuscleSidecar(){
  try{ localStorage.removeItem(MUSCLE_SIDECAR_KEY); }catch(e){}
}

function legacyTagString(ex){
  return (ex.tag === null || ex.tag === undefined) ? '' : String(ex.tag).trim();
}
function migrateMuscleData(){
  var changed = false;
  var sidecar = readMuscleSidecar();
  data.exercises.forEach(function(ex){
    if (!Array.isArray(ex.tags)){
      ex.tags = parseTagInput(legacyTagString(ex));
      changed = true;
    } else if (typeof ex.tag === 'string' && ex.tag.trim() !== tagsToLegacyTag(ex.tags)){
      /* `tag` and `tags` only drift apart when something other than this
         build wrote one of them - i.e. the app was opened in a copy without
         this feature and a category was edited there. That edit is the newer
         intent, so it wins. */
      ex.tags = parseTagInput(legacyTagString(ex));
      changed = true;
    }
    /* `muscles` gone entirely means another build rewrote this record, so
       put back what was last seen here rather than installing an empty one */
    var carried = ex.muscles ? null : sidecar[ex.id];
    if (carried){
      ex.muscles = { primary: (carried.primary||[]).slice(), secondary: (carried.secondary||[]).slice() };
      if (carried.musclesSet) ex.musclesSet = true;
      changed = true;
    }

    /* repaired a tier at a time: one malformed list should not discard the
       other one */
    if (!ex.muscles || typeof ex.muscles !== 'object'){ ex.muscles = emptyMuscles(); changed = true; }
    if (!Array.isArray(ex.muscles.primary)){ ex.muscles.primary = []; changed = true; }
    if (!Array.isArray(ex.muscles.secondary)){ ex.muscles.secondary = []; changed = true; }

    var legacy = tagsToLegacyTag(ex.tags);
    if (ex.tag !== legacy){ ex.tag = legacy; changed = true; }
  });
  if (changed) save();
  writeMuscleSidecar();
}

function exerciseTags(ex){ return (ex && Array.isArray(ex.tags)) ? ex.tags : []; }
function allTagOptions(){
  var seen = {}, out = [];
  data.exercises.forEach(function(e){
    exerciseTags(e).forEach(function(t){ if (t && !seen[t]){ seen[t]=1; out.push(t); } });
  });
  return out.sort(function(a,b){ return a.localeCompare(b); });
}
function parseTagInput(s){
  var seen = {};
  return String(s||'').split(',').map(function(t){ return t.trim(); })
    .filter(function(t){ if (!t || seen[t.toLowerCase()]) return false; seen[t.toLowerCase()]=1; return true; });
}
function exerciseMatchesQuery(e, q){
  if (!q) return true;
  if (e.name.toLowerCase().indexOf(q) >= 0) return true;
  return exerciseTags(e).some(function(t){ return t.toLowerCase().indexOf(q) >= 0; });
}
function tagBadgesHTML(ex){

}

/* Declared here rather than beside the rest of the photo code because
   defaultData() runs while the file is still being evaluated. */
var DEFAULT_POSES = [{id:'front',label:'Front'},{id:'side',label:'Side'},{id:'back',label:'Back'}];

function defaultData(){
  return { version:1, profile:{ name:'', username:'', avatar:null, createdAt:null }, exercises:[], plans:[], workouts:[], activeWorkout:null, restTimer:null, lastExportAt:null, lastPhotoExportAt:null, backupNudgeDismissedAt:null, persistRequested:false,
    progressPhotos:[], photoPoses: DEFAULT_POSES.map(function(p){ return {id:p.id, label:p.label}; }),

function loadData(){
  var raw = null;

   data we ask first rather than silently overwriting it. */
var pendingRestore = null;
(function(){
  var el = document.getElementById(EMBED_ID);

  var payload = snap && snap.data ? snap.data : null;
  if (!payload || !Array.isArray(payload.exercises)) return;
  var isEmpty = (data.exercises||[]).length===0 && (data.plans||[]).length===0 && (data.workouts||[]).length===0;
  if (isEmpty){

/* Two copies open at once - a browser tab and the installed app, or two
   windows - each hold everything in memory and write all of it back on every
   save, so the one left open behind quietly put an old copy back over
   workouts logged in the other (its rest timer finishing was enough). The
   moment another copy saves, this one stops saving and asks for a reload. */
var staleCopy = false;
window.addEventListener('storage', function(e){
  if (e.key !== STORAGE_KEY || staleCopy) return;
  staleCopy = true;
  renderSaveAlert();
});
/* Returns whether it stuck. A failed save used to go only to the console:
   the app kept running from memory, and everything since was gone the moment
   it closed. Now it says so, on every screen, until a save works again - and
   the export it offers is built from memory, so it carries all of it. */
var saveFailing = false, saveAlertExported = false;
function save(){
  if (staleCopy) return false;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    if (saveFailing){ saveFailing = false; renderSaveAlert(); }
    return true;
  }catch(e){
    console.error('Athleticism: save failed', e);
    if (!saveFailing){ saveFailing = true; renderSaveAlert(); }
    return false;
  }
}
function renderSaveAlert(){
  var el = document.getElementById('save-alert');
  if (!el) return;
  el.hidden = !(saveFailing || staleCopy);
  if (staleCopy){
    el.innerHTML = '<div class="backup-nudge-text">'+
        '<strong>Open in Another Window Too</strong>'+
        '<span>The app was used in another tab or window since this one loaded, so this copy is out of date. '+
          'It has stopped saving, so it cannot write older data over newer. Reload to carry on from there.</span>'+
      '</div>'+
      '<div class="backup-nudge-actions">'+
        '<button class="btn btn-primary small" data-action="reload-app">Reload</button>'+
      '</div>';
    return;
  }
  if (!saveFailing) saveAlertExported = false;
  el.innerHTML = !saveFailing ? '' :
    '<div class="backup-nudge-text">'+
      '<strong>Changes Are Not Being Saved</strong>'+
      '<span>'+(saveAlertExported
        ? 'Backup exported, with everything in it. Free up some space and the app will save again on its own.'
        : 'There is no room left for the app’s data, so anything since the last save is lost when the app closes. '+
          'Export a backup now — it includes everything — then free up some space.')+'</span>'+
    '</div>'+
    (saveAlertExported ? '' :
    '<div class="backup-nudge-actions">'+
      '<button class="btn btn-primary small" data-action="save-alert-export">Export Now</button>'+

/* ---- Durable storage ----------------------------------------------------
   By default a browser treats local data as disposable: it may drop it when
   the device runs short of space, or after a long stretch without a visit.
   navigator.storage.persist() asks it not to. An installed home-screen copy
   is usually granted it without a prompt.

   It is no defence against someone clearing site data by hand, and the
   Android app never needed it - its storage belongs to the app. Exporting a
   real file is still the only actual guarantee. */

var storagePersisted = null;   /* null until the browser has answered */

function storageCanPersist(){
  try{ return !!(navigator.storage && navigator.storage.persist && navigator.storage.persisted); }
  catch(e){ return false; }
}
function refreshPersisted(cb){
  if (!storageCanPersist()){ storagePersisted = false; if (cb) cb(false); return; }
  navigator.storage.persisted().then(function(v){
    storagePersisted = !!v;
    if (cb) cb(storagePersisted);
  })['catch'](function(){ storagePersisted = false; if (cb) cb(false); });
}
function requestPersisted(cb){
  if (!storageCanPersist()){ if (cb) cb(false); return; }
  navigator.storage.persist().then(function(v){
    storagePersisted = !!v;
    if (cb) cb(storagePersisted);
  })['catch'](function(){ if (cb) cb(false); });
}
/* Asked for once, the first time there is something worth keeping. Chrome
   decides silently; Firefox may prompt, which is why this waits for a moment
   where the user has just made something rather than firing on page load. */
function ensurePersisted(){
  if (data.persistRequested || !storageCanPersist()) return;
  data.persistRequested = true;
  save();
  requestPersisted(function(){});
}
function persistStateLine(){
  if (!storageCanPersist()) return 'This browser does not offer it.';
  if (storagePersisted === null) return 'Checking…';
  return storagePersisted
    ? 'Granted. This browser will not clear your data to reclaim space.'
    : 'Not granted. This browser may clear your data when space runs low.';
}

/* ---- Backup & restore ---------------------------------------------------
   localStorage is not permanent. iOS Safari in particular can evict site
   data for pages that are not installed to the Home Screen, so exporting a
   real file is the only durable safety net. Three formats:
     .json  - compact data-only backup
     .html  - a full working copy of the app with the data baked inside
   Importing accepts either. */

function backupPayload(){
  var snapshot = Object.assign({}, data);
  /* device-local state that should not travel with the data */
  delete snapshot.restTimer;
  delete snapshot.lastExportAt;
  delete snapshot.lastPhotoExportAt;
  delete snapshot.backupNudgeDismissedAt;
  delete snapshot.persistRequested;
  /* Photo bytes are only here when stagePhotoBlobs() has just put them there,
     which happens when "Include Progress Photos" is on. */
  if (pendingPhotoBlobs) snapshot.photoBlobs = pendingPhotoBlobs;
  else delete snapshot.photoBlobs;
  return {
    app: 'Athleticism',
    backupFormat: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    data: snapshot

}
function backupStamp(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function dataCounts(d){
  return {
    exercises: (d.exercises||[]).length,
    plans: (d.plans||[]).length,
    workouts: (d.workouts||[]).filter(function(w){return w.completedAt;}).length
  };
}
function countsLine(c){
  return c.exercises+' exercise'+(c.exercises!==1?'s':'')+' &middot; '+
         c.plans+' plan'+(c.plans!==1?'s':'')+' &middot; '+
         c.workouts+' workout'+(c.workouts!==1?'s':'');
}
function downloadFile(filename, mime, content){
  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);

  }catch(e){
    console.error('Athleticism: download failed', e);
    return false;

/* Inside the Android app a download has nowhere to go: the WebView gives a
   blob: URL no destination and has no share sheet, so the file used to vanish

function shareOrHold(filename, mime, content, cb){

/* A cancelled save screen gets no message at all - backing out is a choice. */
function exportMessage(status, savedText){
  if (status === 'saved') return { kind:'ok', text: savedText };
  if (status === 'ready') return readyMessage();
  if (status === 'failed') return { kind:'error', text: isNativeApp()
    ? 'Could not save the file. Try again, or pick another folder.'
    : 'Could not create the file. Try again, or use a different browser.' };
  return null;
}
/* The Share buttons: a closed sheet says nothing, a refused one says so and
   points at Save, which always has a way through. */
function shareMessage(status, sharedText){
  if (status === 'saved') return { kind:'ok', text: sharedText };
  if (status === 'ready') return readyMessage();
  if (status === 'failed') return { kind:'error', text:'Could not share that file here. Use Save instead.' };
  return null;
}
function readyMessage(){

}
/* Settings and the Photos pane show these; a message may carry one button. */
function messageHTML(msg){
  if (!msg) return '';

    (msg.action ? ' <button class="btn btn-primary small msg-action" data-action="'+esc(msg.action)+'">'+esc(msg.actionLabel)+'</button>' : '')+

function bytesToBase64(bytes){
  var s = '';

   really exists somewhere, and only that may count as a backup. 'ready' is an
   iPhone share sheet that wants one more tap (see shareOrHold). */
function saveFile(filename, mime, content, cb){

    if (savesThroughShare(filename, mime)){ shareOrHold(filename, mime, content, cb); return; }
    cb(downloadFile(filename, mime, content) ? 'saved' : 'failed');
    return;
  }

  try { payload = typeof content === 'string' ? { text: content } : { base64: bytesToBase64(content) }; }
  catch(e){ cb('failed'); return; }
  /* staged first, so the request left waiting on the picker stays small */
  native.stage(payload).then(function(){
    return native.save({ filename: filename, mime: mime });
  }).then(function(res){
    cb(res && res.saved ? 'saved' : 'cancelled');

/* On phones the OS share sheet is a far better destination than a silent
   download - it puts the file straight into Files, iCloud Drive or AirDrop.
   Asked per file: Chrome shares only a fixed list of types and .json and
   .zip are not on it, so asking about a .txt said yes and the share then

function canShareFile(filename, mime){
  try{
    if (!navigator.share || !navigator.canShare || typeof File !== 'function') return false;
    return navigator.canShare({ files: [ new File(['x'], filename, {type: mime}) ] });

/* A file the share sheet refused because preparing it took too long after

var heldShare = null;

/* cb(status) - see saveFile */
function exportJSON(cb){

/* Serialise a clean copy of this page with the current data embedded, so the

  var clone = document.documentElement.cloneNode(true);

  /* strip anything the app rebuilds on load, plus any embed from a file

  for (var j=0;j<scripts.length;j++){ if (!scripts[j].type) appScript = scripts[j]; }

  else if (cloneBody) cloneBody.appendChild(seed);

  return '<!DOCTYPE html>\n' + clone.outerHTML;
}
/* cb(status) - see saveFile */
function exportPortable(cb){
  stagePhotoBlobs(includePhotosInBackup(), function(){
    var carried = !!pendingPhotoBlobs;
    var html = buildPortableHTML();
    pendingPhotoBlobs = null;
    saveFile(portableBackupName(), 'text/html', html, function(status){
      if (status === 'saved'){ markExported(); if (carried) markPhotosExported(); }
      if (cb) cb(status);
    });
  });
}
/* Accepts a .json backup, or a portable .html backup (data pulled out of
   its embedded block). */
function parseBackupText(text){
  var trimmed = (text||'').trim();
  if (trimmed.charAt(0) !== '{'){
    var marker = 'id="'+EMBED_ID+'"';
    var at = trimmed.indexOf(marker);
    if (at === -1) return { ok:false, error:'That file does not contain any Athleticism data.' };
    var open = trimmed.indexOf('>', at);
    var close = trimmed.indexOf('<\/script>', open);
    if (open === -1 || close === -1) return { ok:false, error:'The backup block in that file is incomplete.' };
    trimmed = trimmed.slice(open+1, close).replace(/\\u003c/g, '<').trim();
  }
  var parsed;
  try { parsed = JSON.parse(trimmed); }
  catch(e){ return { ok:false, error:'That file is not valid backup data.' }; }
  if (parsed && typeof parsed.backupFormat==='number' && parsed.backupFormat > BACKUP_FORMAT){
    return { ok:false, error:'That backup was made by a newer version of Athleticism. Update this copy first.' };
  }
  var payload = (parsed && parsed.data && typeof parsed.data==='object') ? parsed.data : parsed;
  if (!payload || typeof payload!=='object') return { ok:false, error:'That file is not valid backup data.' };
  if (!Array.isArray(payload.exercises) || !Array.isArray(payload.plans) || !Array.isArray(payload.workouts)){
    return { ok:false, error:'That backup is missing its exercises, plans or workouts.' };
  }
  return { ok:true, data: payload, exportedAt: parsed.exportedAt || null };
}
/* Merge is additive and never destructive: anything whose id we already have
   is left exactly as it is. That makes combining two devices predictable -
   you can run it twice and get the same result. */
function mergeImportedData(payload){
  var added = { exercises:0, plans:0, workouts:0 };
  var seen = {};

  data.exercises.forEach(function(e){ seen['e:'+e.id] = true; });
  (payload.exercises||[]).forEach(function(e){
    if (!e || !e.id || seen['e:'+e.id]) return;
    seen['e:'+e.id] = true;
    data.exercises.push(e);
    added.exercises++;
  });

  data.plans.forEach(function(pl){ seen['p:'+pl.id] = true; });
  (payload.plans||[]).forEach(function(pl){
    if (!pl || !pl.id || seen['p:'+pl.id]) return;
    seen['p:'+pl.id] = true;
    pl.items = normalizePlanItems(pl.items || []);
    data.plans.push(pl);
    added.plans++;
  });

  data.workouts.forEach(function(w){ seen['w:'+w.id] = true; });
  (payload.workouts||[]).forEach(function(w){
    if (!w || !w.id || seen['w:'+w.id]) return;
    seen['w:'+w.id] = true;
    data.workouts.push(w);
    added.workouts++;
  });

  /* photos are additive the same way, and their bytes go to IndexedDB */
  allPhotos().forEach(function(p){ seen['pic:'+p.id] = true; });
  var incomingBlobs = takePhotoBlobs(payload);
  (payload.progressPhotos||[]).forEach(function(p){
    if (!p || !p.id || seen['pic:'+p.id]) return;
    seen['pic:'+p.id] = true;
    allPhotos().push(p);
  });
  (payload.photoPoses||[]).forEach(function(po){
    if (!po || !po.id) return;
    if (!photoPoses().filter(function(x){ return x.id===po.id; }).length) photoPoses().push(po);
  });
  if (incomingBlobs) absorbPhotoBlobs(incomingBlobs, function(){ renderMain(); });

  /* identity is not additive - only adopt it if this device has none */
  if (payload.profile){
    var mine = profile();
    if (!mine.name && !mine.username && !mine.avatar) data.profile = payload.profile;
  }

  data.workouts.sort(function(a,b){ return (a.completedAt||0) - (b.completedAt||0); });
  save();
  migratePlanItems();
  migrateMuscleData();
  return added;
}

function applyImportedData(payload){
  var incoming = takePhotoBlobs(payload);
  /* Progress photos ride through a Replace. A backup leaves the images out
     unless asked to, so one made before this month's photos - or on another
     phone - lists none of them, and replacing used to delete every image it
     did not list. The data is replaced; a picture only leaves by being
     deleted. */
  var ownPhotos = allPhotos().slice(), ownPoses = photoPoses().slice();
  clearInterval(runtime.timerHandle);
  runtime.timerHandle = null;
  runtime.timer = null;
  runtime.pendingBeep = false;
  data = Object.assign(defaultData(), payload);
  keepPhotosThroughReplace(ownPhotos, ownPoses);
  data.restTimer = null;
  if (!data.settings || !data.settings.weightUnit) data.settings = { weightUnit:'lb' };
  data.plans.forEach(function(plan){
    plan.items = normalizePlanItems(plan.items || []);
  });
  save();
  migratePlanItems();
  migrateMuscleData();
  applyTheme();
  renderAvatarButton();
  /* only images nothing refers to any more - the kept photos above still are */
  if (incoming) absorbPhotoBlobs(incoming, function(){ reconcilePhotoStore(); renderMain(); });
  else reconcilePhotoStore();
}
/* Adds back the photos (and any custom angle they were filed under) that the
   incoming data does not already list. */
function keepPhotosThroughReplace(photos, poses){
  var listed = {};
  allPhotos().forEach(function(p){ listed[p.id] = true; });
  var kept = photos.filter(function(p){ return !listed[p.id]; });
  if (!kept.length) return;
  data.progressPhotos = allPhotos().concat(kept);
  var known = {};
  photoPoses().forEach(function(p){ known[p.id] = true; });
  poses.forEach(function(p){
    if (known[p.id] || !kept.some(function(k){ return k.pose === p.id; })) return;
    data.photoPoses.push(p);
    known[p.id] = true;
  });
}

/* ---- Progress photos ----------------------------------------------------
   Photo bytes do NOT live in `data`. save() re-serialises the whole blob on
   every set you tick off, and localStorage tops out around 5MB, so a gallery
   in there would be both slow and quickly full. Only the metadata rides along
   in `data.progressPhotos`; the images themselves sit in IndexedDB keyed by
   photo id, where the quota is orders of magnitude larger.

   Each photo stores two JPEG data URLs: `full` (900x1200, what you look at)
   and `thumb` (225x300, what the grid draws). Data URLs rather than Blobs
   because they drop straight into an <img src> and into a backup file with
   no object-URL lifetime to get wrong.

   Rendering stays synchronous: views emit <img data-photo="id"> with no src,
   and paintPhotos() fills them in as IndexedDB answers - the same shape as
   paintCharts(). */

var PHOTO_DB_NAME = 'athleticism_photos';
var PHOTO_STORE = 'blobs';
var PHOTO_W = 900, PHOTO_H = 1200;          /* stored full size, 3:4 portrait */
var PHOTO_THUMB_W = 225, PHOTO_THUMB_H = 300;
var PHOTO_QUALITY = 0.82, PHOTO_THUMB_QUALITY = 0.7;

function photoPoses(){
  if (!Array.isArray(data.photoPoses) || !data.photoPoses.length){
    data.photoPoses = DEFAULT_POSES.map(function(p){ return {id:p.id, label:p.label}; });
  }
  return data.photoPoses;
}
function poseLabel(id){
  var hit = photoPoses().filter(function(p){ return p.id===id; })[0];
  return hit ? hit.label : id;
}
function allPhotos(){
  if (!Array.isArray(data.progressPhotos)) data.progressPhotos = [];
  return data.progressPhotos;
}
/* newest first, optionally narrowed to one pose */
function photosFor(poseId){
  return allPhotos().filter(function(p){ return !poseId || p.pose===poseId; })
    .sort(function(a,b){ return b.takenAt - a.takenAt; });
}
/* Comparing needs two shots of the SAME angle, so this is what decides
   whether the button is worth offering at all. */
function posesWithPairs(){
  return photoPoses().filter(function(p){ return photosFor(p.id).length >= 2; });
}
function photoById(id){ return allPhotos().filter(function(p){ return p.id===id; })[0] || null; }

/* ---- IndexedDB ---------------------------------------------------------- */

var photoDbHandle = null, photoDbBroken = false;

function withPhotoDB(cb){
  if (photoDbBroken){ cb(null); return; }
  if (photoDbHandle){ cb(photoDbHandle); return; }
  var req;
  try { req = indexedDB.open(PHOTO_DB_NAME, 1); }
  catch(e){ photoDbBroken = true; cb(null); return; }
  req.onupgradeneeded = function(){
    var db = req.result;
    if (!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE, {keyPath:'id'});
  };
  req.onsuccess = function(){ photoDbHandle = req.result; cb(photoDbHandle); };
  req.onerror = function(){ photoDbBroken = true; cb(null); };
  req.onblocked = function(){ photoDbBroken = true; cb(null); };
}
function photoPut(rec, cb){
  withPhotoDB(function(db){
    if (!db){ cb(false); return; }
    try{
      var tx = db.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).put(rec);
      tx.oncomplete = function(){ cb(true); };
      tx.onerror = function(){ cb(false); };
      tx.onabort = function(){ cb(false); };
    }catch(e){ cb(false); }
  });
}
function photoGet(id, cb){
  withPhotoDB(function(db){
    if (!db){ cb(null); return; }
    try{
      var req = db.transaction(PHOTO_STORE, 'readonly').objectStore(PHOTO_STORE).get(id);
      req.onsuccess = function(){ cb(req.result || null); };
      req.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  });
}
function photoDrop(id, cb){
  withPhotoDB(function(db){
    if (!db){ cb(false); return; }
    try{
      var tx = db.transaction(PHOTO_STORE, 'readwrite');
      tx.objectStore(PHOTO_STORE).delete(id);
      tx.oncomplete = function(){ cb(true); };
      tx.onerror = function(){ cb(false); };
    }catch(e){ cb(false); }
  });
}
/* Reads the stored records for a list of ids, in order. Used by both exports. */
function photoGetMany(ids, cb){
  var out = [], i = 0;
  (function next(){
    if (i >= ids.length){ cb(out); return; }
    photoGet(ids[i++], function(rec){
      if (rec) out.push(rec);
      next();
    });
  })();
}

/* ---- image cache + late binding ----------------------------------------- */

var photoThumbCache = {};
var photoFullCache = {}, photoFullOrder = [];

function cacheFull(id, dataUrl){
  if (!photoFullCache[id]) photoFullOrder.push(id);
  photoFullCache[id] = dataUrl;
  while (photoFullOrder.length > 4){
    var drop = photoFullOrder.shift();
    if (drop !== id) delete photoFullCache[drop];
  }
}
function forgetPhoto(id){
  delete photoThumbCache[id];
  delete photoFullCache[id];

}
/* Fills every <img data-photo> the current view emitted. Safe to call after
   any render: images already carrying a src are skipped. */
function paintPhotos(){
  var els = document.querySelectorAll('img[data-photo]');
  if (!els.length) return;
  Array.prototype.forEach.call(els, function(el){
    if (el.getAttribute('src')) return;
    var id = el.dataset.photo;
    var want = el.dataset.photoSize === 'full' ? 'full' : 'thumb';
    var cached = want==='full' ? photoFullCache[id] : photoThumbCache[id];
    if (cached){ el.src = cached; return; }
    photoGet(id, function(rec){
      if (!rec) return;
      var url = want==='full' ? (rec.full || rec.thumb) : (rec.thumb || rec.full);
      if (!url) return;
      if (want==='full') cacheFull(id, rec.full || rec.thumb);
      else photoThumbCache[id] = rec.thumb || rec.full;
      /* the view may have been re-rendered while IndexedDB was answering */
      var live = document.querySelectorAll('img[data-photo="'+id+'"][data-photo-size="'+want+'"]');
      Array.prototype.forEach.call(live, function(n){ if (!n.getAttribute('src')) n.src = url; });
    });
  });
}
function photoImgTag(id, size, cls){
  return '<img class="'+(cls||'')+'" data-photo="'+esc(id)+'" data-photo-size="'+size+'" alt="">';
}

/* ---- capture ------------------------------------------------------------ */

/* #photo-file-input deliberately carries no capture attribute. With one the

   markup so the dock's round button can reach it too.

  var input = document.getElementById('photo-file-input');

}
function openPhotoSource(){

    '<button class="btn btn-primary full-width" data-action="photo-source" data-source="camera">'+icon('camera')+' Take Photo</button>'+
    '<button class="btn btn-ghost full-width" data-action="photo-source" data-source="library">Choose From Gallery</button>'+
  '</div>';

}
function closePhotoSource(){

}
function pickPhotoFrom(source){

  var input = document.getElementById('photo-file-input');

  else input.removeAttribute('capture');

}
/* The previous shot in the same pose, loaded so it can be ghosted under the
   crop frame. Lining each month's photo up with the last is the whole point. */
function loadPoseGhost(poseId, cb){
  var prev = photosFor(poseId)[0];
  if (!prev){ cb(null); return; }
  photoGet(prev.id, function(rec){
    if (!rec || !rec.full){ cb(null); return; }
    var img = new Image();
    img.onload = function(){ cb(img); };
    img.onerror = function(){ cb(null); };
    img.src = rec.full;
  });
}
/* Re-encode the cropped region twice: once at full size, once as a thumbnail. */
function encodePhoto(c){
  function render(w, h, q){
    var out = document.createElement('canvas');
    out.width = w; out.height = h;
    var ctx = out.getContext('2d');
    var f = c.base * c.z;
    ctx.drawImage(c.img, (-c.ox)/f, (-c.oy)/f, c.viewW/f, c.viewH/f, 0, 0, w, h);
    return out.toDataURL('image/jpeg', q);
  }
  try{
    var full = render(PHOTO_W, PHOTO_H, PHOTO_QUALITY);
    if (!full || full.indexOf('data:image') !== 0) return { error:'Could not process that image.' };
    return { full: full, thumb: render(PHOTO_THUMB_W, PHOTO_THUMB_H, PHOTO_THUMB_QUALITY) };
  }catch(e){
    return { error:'Could not process that image.' };
  }
}
function commitPhotoCrop(){
  var c = cropper;
  if (!c) return;
  var enc = encodePhoto(c);
  if (enc.error){
    ui.photoMessage = { kind:'error', text: enc.error };
    closeCropper(); renderMain();
    return;
  }
  var id = uid('pic');
  var now = new Date();
  photoPut({ id:id, full:enc.full, thumb:enc.thumb }, function(ok){
    if (!ok){
      ui.photoMessage = { kind:'error', text:'This browser would not store the photo. It may be out of space, or in private browsing.' };
      closeCropper(); renderMain();
      return;
    }
    allPhotos().push({
      id: id,
      date: toLocalISO(now),
      takenAt: now.getTime(),
      pose: c.pose,
      note: '',
      bytes: dataUrlBytes(enc.full) + dataUrlBytes(enc.thumb)
    });
    photoThumbCache[id] = enc.thumb;
    cacheFull(id, enc.full);
    save();
    ensurePersisted();
    ui.photoPose = c.pose;
    ui.photoMessage = { kind:'ok', text:'Photo saved to '+poseLabel(c.pose)+'.' };
    closeCropper();
    renderMain();
  });
}
function deletePhoto(id){
  photoDrop(id, function(){
    data.progressPhotos = allPhotos().filter(function(p){ return p.id!==id; });
    forgetPhoto(id);
    if (ui.viewingPhotoId===id) ui.viewingPhotoId = null;
    if (ui.compareA===id) ui.compareA = null;
    if (ui.compareB===id) ui.compareB = null;
    save();
    renderMain();
  });
}
function photoLibraryBytes(){
  return allPhotos().reduce(function(n,p){ return n + (p.bytes||0); }, 0);
}
function fmtBytes(n){
  if (n < 1024) return n+' B';
  if (n < 1024*1024) return Math.round(n/1024)+' KB';
  return (n/(1024*1024)).toFixed(1)+' MB';
}
function fmtSpan(ms){
  var days = Math.round(ms/86400000);
  if (days < 1) return 'same day';
  if (days === 1) return '1 day';
  if (days < 45) return days+' days';
  var months = Math.round(days/30.44);
  if (months < 18) return months+' month'+(months!==1?'s':'');
  var years = Math.floor(days/365.25), rem = Math.round((days - years*365.25)/30.44);
  return years+' year'+(years!==1?'s':'') + (rem ? ' '+rem+' month'+(rem!==1?'s':'') : '');
}

/* ---- Photo export -------------------------------------------------------
   Two separate jobs, deliberately:

   1. The backup toggle. Ticking "Include progress photos" inlines every image
      as base64 inside the .json or portable .html, so importing that file puts
      them back in the app. It is off by default because it turns a backup you
      can email into one you cannot.
   2. Export Progress Photos. A .zip of dated .jpg files for your photo
      library, your computer, anywhere. It is an archive, not a restore point -
      the app does not read it back.

   The zip is written by hand with no compression (JPEGs are already
   compressed, so deflate would buy nothing) which keeps the app a single file
   with no dependency to fetch. */

var CRC_TABLE = null;
function crcTable(){
  if (CRC_TABLE) return CRC_TABLE;
  CRC_TABLE = new Uint32Array(256);
  for (var n=0;n<256;n++){
    var c = n;
    for (var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    CRC_TABLE[n] = c >>> 0;
  }
  return CRC_TABLE;
}
function crc32(bytes){
  var t = crcTable(), c = 0xFFFFFFFF;
  for (var i=0;i<bytes.length;i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dataUrlToBytes(dataUrl){
  var bin = atob(dataUrl.slice(dataUrl.indexOf(',')+1));
  var out = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function dosDateTime(d){
  return {
    time: ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds()/2) & 31),
    date: (((d.getFullYear()-1980) & 127) << 9) | (((d.getMonth()+1) & 15) << 5) | (d.getDate() & 31)
  };
}
/* files: [{ name, bytes, at }] -> Uint8Array holding a STORE-method zip */
function buildZip(files){
  var enc = files.map(function(f){
    var name = [];
    for (var i=0;i<f.name.length;i++) name.push(f.name.charCodeAt(i) & 0x7F);
    return { name: new Uint8Array(name), bytes: f.bytes, crc: crc32(f.bytes), dt: dosDateTime(f.at || new Date()) };
  });
  var local = 0, central = 0;
  enc.forEach(function(f){ local += 30 + f.name.length + f.bytes.length; central += 46 + f.name.length; });
  var buf = new Uint8Array(local + central + 22);
  var dv = new DataView(buf.buffer);
  var off = 0, offsets = [];

  enc.forEach(function(f){
    offsets.push(off);
    dv.setUint32(off, 0x04034b50, true);
    dv.setUint16(off+4, 20, true); dv.setUint16(off+6, 0, true);
    dv.setUint16(off+8, 0, true);
    dv.setUint16(off+10, f.dt.time, true); dv.setUint16(off+12, f.dt.date, true);
    dv.setUint32(off+14, f.crc, true);
    dv.setUint32(off+18, f.bytes.length, true); dv.setUint32(off+22, f.bytes.length, true);
    dv.setUint16(off+26, f.name.length, true); dv.setUint16(off+28, 0, true);
    off += 30;
    buf.set(f.name, off); off += f.name.length;
    buf.set(f.bytes, off); off += f.bytes.length;
  });

  var cdStart = off;
  enc.forEach(function(f, i){
    dv.setUint32(off, 0x02014b50, true);
    dv.setUint16(off+4, 20, true); dv.setUint16(off+6, 20, true);
    dv.setUint16(off+8, 0, true); dv.setUint16(off+10, 0, true);
    dv.setUint16(off+12, f.dt.time, true); dv.setUint16(off+14, f.dt.date, true);
    dv.setUint32(off+16, f.crc, true);
    dv.setUint32(off+20, f.bytes.length, true); dv.setUint32(off+24, f.bytes.length, true);
    dv.setUint16(off+28, f.name.length, true);
    dv.setUint16(off+30, 0, true); dv.setUint16(off+32, 0, true);
    dv.setUint16(off+34, 0, true); dv.setUint16(off+36, 0, true);
    dv.setUint32(off+38, 0, true);
    dv.setUint32(off+42, offsets[i], true);
    off += 46;
    buf.set(f.name, off); off += f.name.length;
  });

  dv.setUint32(off, 0x06054b50, true);
  dv.setUint16(off+4, 0, true); dv.setUint16(off+6, 0, true);
  dv.setUint16(off+8, enc.length, true); dv.setUint16(off+10, enc.length, true);
  dv.setUint32(off+12, off - cdStart, true); dv.setUint32(off+16, cdStart, true);
  dv.setUint16(off+20, 0, true);
  return buf;
}
function photoFileName(p){
  var safe = String(poseLabel(p.pose)).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'photo';
  return p.date + '-' + safe + '-' + p.id.slice(-4) + '.jpg';

function photosZipName(){ return 'athleticism-photos-'+backupStamp()+'.zip'; }
/* Reachable from two places - the Photos pane and Settings - so the work

function runPhotoZipExport(report){
  report({ kind:'ok', text:'Packing your photos\u2026' });
  buildPhotosZip(function(bytes){
    if (!bytes){ report({ kind:'error', text:'Could not build the photo archive.' }); return; }
    saveFile(photosZipName(), 'application/zip', bytes, function(status){
      if (status === 'saved') markPhotosExported();
      /* backing out of the save screen is a choice, not an error */
      report(status === 'saved'
        ? { kind:'ok', text:'Photo archive saved \u2014 dated .jpg files in a .zip. It is for keeping, not for importing back.' }
        : status === 'ready' ? readyMessage()
        : status === 'failed' ? { kind:'error', text:'Could not create the file.' } : null);
    });
  });
}
function runPhotoZipShare(report){
  report({ kind:'ok', text:'Packing your photos\u2026' });
  buildPhotosZip(function(bytes){
    if (!bytes){ report({ kind:'error', text:'Could not build the photo archive.' }); return; }
    shareOrHold(photosZipName(), 'application/zip', bytes, function(status){
      if (status === 'saved') markPhotosExported();
      report(shareMessage(status, 'Photo archive shared.'));
    });
  });
}
/* cb(Uint8Array|null) */
function buildPhotosZip(cb){
  var metas = allPhotos().slice().sort(function(a,b){ return a.takenAt - b.takenAt; });
  if (!metas.length){ cb(null); return; }
  photoGetMany(metas.map(function(p){ return p.id; }), function(recs){
    var byId = {};
    recs.forEach(function(r){ byId[r.id] = r; });
    var files = [];
    metas.forEach(function(p){
      var rec = byId[p.id];
      if (!rec || !rec.full) return;
      files.push({ name: photoFileName(p), bytes: dataUrlToBytes(rec.full), at: new Date(p.takenAt) });
    });
    if (!files.length){ cb(null); return; }
    try { cb(buildZip(files)); }
    catch(e){ console.error('Athleticism: zip failed', e); cb(null); }
  });
}

var pendingPhotoBlobs = null;   /* set just before backupPayload() is called */

/* cb() once pendingPhotoBlobs reflects `include` */
function stagePhotoBlobs(include, cb){
  if (!include || !allPhotos().length){ pendingPhotoBlobs = null; cb(); return; }
  photoGetMany(allPhotos().map(function(p){ return p.id; }), function(recs){
    pendingPhotoBlobs = recs.length ? recs : null;
    cb();
  });
}

/* Writes imported images back into IndexedDB, then clears the key so the
   base64 never reaches localStorage. */
function takePhotoBlobs(payload){
  var blobs = payload && payload.photoBlobs;
  if (payload) delete payload.photoBlobs;
  return Array.isArray(blobs) && blobs.length ? blobs : null;
}
function absorbPhotoBlobs(blobs, cb){
  if (!Array.isArray(blobs) || !blobs.length){ cb(0); return; }
  var i = 0, n = 0;
  (function next(){
    if (i >= blobs.length){ cb(n); return; }
    var rec = blobs[i++];
    if (!rec || !rec.id){ next(); return; }
    photoPut(rec, function(ok){ if (ok) n++; next(); });
  })();
}
/* Drops stored images that no metadata entry points at any more - after a
   replace-import, or a reset. */
function reconcilePhotoStore(){
  withPhotoDB(function(db){
    if (!db) return;
    try{
      var keep = {};
      allPhotos().forEach(function(p){ keep[p.id] = true; });
      var store = db.transaction(PHOTO_STORE, 'readwrite').objectStore(PHOTO_STORE);
      var req = store.getAllKeys ? store.getAllKeys() : null;
      if (!req) return;
      req.onsuccess = function(){
        (req.result||[]).forEach(function(k){ if (!keep[k]) store.delete(k); });
      };
    }catch(e){}
  });
}
function photoBackupNote(){

/* ---- Profile ------------------------------------------------------------
   The avatar is stored as a base64 data URL inside the same localStorage
   blob as everything else. That store is only ~5MB in total, and base64
   adds about a third on top, so a straight-from-the-camera photo would
   blow the quota and take the workout history with it. Every image is
   therefore center-cropped and downscaled to a 256px square JPEG first,
   which lands around 15-25KB. */

var AVATAR_PX = 256;
var AVATAR_QUALITY = 0.82;
var AVATAR_MAX_BYTES = 120 * 1024;

function profile(){
  if (!data.profile) data.profile = { name:'', username:'', avatar:null, createdAt:null };
  return data.profile;
}
function displayName(){
  var p = profile();
  return (p.name && p.name.trim()) || (p.username && p.username.trim()) || '';
}
function initials(){
  var n = displayName();
  if (!n) return '';
  var parts = n.trim().split(/\s+/).slice(0,2);
  return parts.map(function(x){ return x.charAt(0).toUpperCase(); }).join('');
}
function avatarMarkup(sizeClass){
  var p = profile();
  if (p.avatar) return '<img class="avatar-img '+sizeClass+'" src="'+p.avatar+'" alt="">';
  var ini = initials();
  if (ini) return '<span class="avatar-initials '+sizeClass+'">'+esc(ini)+'</span>';
  return '<span class="avatar-initials '+sizeClass+' empty">'+icon('user')+'</span>';
}
function renderAvatarButton(){
  var btn = document.getElementById('avatar-btn');
  if (!btn) return;
  btn.innerHTML = avatarMarkup('sm');
  btn.classList.toggle('active', ui.view==='profile');
}
function dataUrlBytes(dataUrl){
  if (!dataUrl) return 0;
  var i = dataUrl.indexOf(',');
  return Math.round((dataUrl.length - i - 1) * 0.75);
}
/* Decode -> center crop -> downscale -> re-encode. Quality steps down if the
   result is somehow still large. */
function loadImageFromFile(file, cb){
  if (!file || !file.type || file.type.indexOf('image/') !== 0){
    cb({ error:'That file is not an image.' });
    return;
  }
  var reader = new FileReader();
  reader.onerror = function(){ cb({ error:'Could not read that file.' }); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){
      cb({ error:'This browser could not decode that image. Try a JPEG or PNG.' });
    };
    img.onload = function(){
      if (!img.width || !img.height){ cb({ error:'That image appears to be empty.' }); return; }
      cb({ img: img });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---- Crop / reposition --------------------------------------------------
   A viewport with the image panned and zoomed under it; only what the
   viewport shows is re-encoded. The viewport can never show empty space:
   offsets are clamped so the image always covers it, and zoom is floored at
   "just covers". Two shapes share the machinery - a square with a circular
   mask for the avatar, and a 3:4 portrait for progress photos, which can also
   ghost the previous shot in the same pose over the frame so the angles
   match month to month. */

var CROP_VIEW = 288;
var CROP_MAX_ZOOM = 4;
var cropper = null;

function cropDims(){
  var c = cropper;
  return { w: c.img.width * c.base * c.z, h: c.img.height * c.base * c.z };
}
function clampCropper(){
  var c = cropper, d = cropDims();
  c.ox = Math.min(0, Math.max(c.viewW - d.w, c.ox));
  c.oy = Math.min(0, Math.max(c.viewH - d.h, c.oy));
}
function centerCropper(){
  var c = cropper, d = cropDims();
  c.ox = (c.viewW - d.w) / 2;
  c.oy = (c.viewH - d.h) / 2;
  clampCropper();
}
function setCropZoom(z){
  var c = cropper;
  var nz = Math.max(1, Math.min(CROP_MAX_ZOOM, z));
  if (nz === c.z) return;
  var midX = c.viewW / 2, midY = c.viewH / 2;
  var d0 = cropDims();
  var rx = (midX - c.ox) / d0.w;
  var ry = (midY - c.oy) / d0.h;
  c.z = nz;
  var d1 = cropDims();
  c.ox = midX - rx * d1.w;
  c.oy = midY - ry * d1.h;
  clampCropper();
  drawCropper();
  var slider = document.getElementById('crop-zoom');
  if (slider && Math.abs(slider.value*1 - c.z) > 0.001) slider.value = c.z;
}
function drawCropper(){
  var c = cropper;
  if (!c) return;
  var canvas = document.getElementById('crop-canvas');
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(c.viewW*dpr) || canvas.height !== Math.round(c.viewH*dpr)){
    canvas.width = Math.round(c.viewW*dpr);
    canvas.height = Math.round(c.viewH*dpr);
  }
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, c.viewW, c.viewH);
  var d = cropDims();
  ctx.drawImage(c.img, c.ox, c.oy, d.w, d.h);
  if (c.ghost && c.ghostAlpha > 0){
    /* the ghost is framed by the same cover rule, so it lines up with what a
       correctly-aligned new photo would look like */
    var gs = Math.max(c.viewW / c.ghost.width, c.viewH / c.ghost.height);
    var gw = c.ghost.width * gs, gh = c.ghost.height * gs;
    ctx.globalAlpha = c.ghostAlpha;
    ctx.drawImage(c.ghost, (c.viewW - gw)/2, (c.viewH - gh)/2, gw, gh);
    ctx.globalAlpha = 1;
  }
}
function cropStageSize(mode){
  if (mode === 'photo'){
    var h = Math.min(Math.round(window.innerHeight * 0.42), 372);
    var w = Math.round(h * 0.75);
    var maxW = window.innerWidth - 88;
    if (w > maxW){ w = Math.max(150, maxW); h = Math.round(w / 0.75); }
    return { w: w, h: h };
  }
  var side = Math.max(200, Math.min(CROP_VIEW, window.innerWidth - 88));
  return { w: side, h: side };
}
function openCropper(img, opts){
  opts = opts || {};
  var mode = opts.mode === 'photo' ? 'photo' : 'avatar';
  /* the stage must match the canvas exactly or the mask would no longer
     correspond to the region we actually export */
  var size = cropStageSize(mode);
  cropper = { img: img, mode: mode, pose: opts.pose || null,
    ghost: opts.ghost || null, ghostAlpha: opts.ghost ? 0.45 : 0,
    viewW: size.w, viewH: size.h, z: 1, ox: 0, oy: 0,
    pointers: {}, pinchDist: 0, pinchZoom: 1 };
  cropper.base = Math.max(size.w / img.width, size.h / img.height);
  centerCropper();
  var isPhoto = mode === 'photo';
  var wrap = document.getElementById('cropper-modal');
  wrap.innerHTML = '<div class="modal cropper-modal">'+
    '<div class="modal-head"><h2>'+(isPhoto ? 'Frame Your Photo' : 'Adjust Picture')+'</h2>'+
      '<button class="icon-btn" data-action="crop-cancel">'+icon('x')+'</button></div>'+
    '<div class="crop-stage'+(isPhoto?' portrait':'')+'" style="width:'+size.w+'px;height:'+size.h+'px">'+
      '<canvas id="crop-canvas" style="width:'+size.w+'px;height:'+size.h+'px"></canvas>'+
      '<div class="crop-mask'+(isPhoto?' rect':'')+'"></div></div>'+
    '<div class="crop-hint">'+
      (cropper.ghost
        ? 'Your last '+esc(poseLabel(cropper.pose)).toLowerCase()+' shot is laid over the frame. Line yourself up with it.'
        : isPhoto
          /* with the filter on "All" the angle is chosen for you, so say so */
          ? 'Saving to '+esc(poseLabel(cropper.pose))+'. Drag to reposition, pinch or use the slider to zoom.'
          : 'Drag to reposition. Pinch or use the slider to zoom.')+
    '</div>'+
    '<div class="crop-zoom-row">'+
      '<button class="icon-btn" data-action="crop-zoom-out" title="Zoom out">&minus;</button>'+
      '<input id="crop-zoom" type="range" min="1" max="'+CROP_MAX_ZOOM+'" step="0.01" value="1">'+
      '<button class="icon-btn" data-action="crop-zoom-in" title="Zoom in">+</button>'+
    '</div>'+
    (cropper.ghost ? '<div class="crop-ghost-row"><span>Overlay</span>'+
      '<input id="crop-ghost" type="range" min="0" max="0.85" step="0.05" value="0.45"></div>' : '')+
    '<div style="display:flex;gap:10px;margin-top:16px;">'+
      '<button class="btn btn-ghost full-width" data-action="crop-reset">Reset</button>'+
      '<button class="btn btn-ghost full-width" data-action="crop-cancel">Cancel</button>'+
      '<button class="btn btn-primary full-width" data-action="crop-save">'+(isPhoto?'Save Photo':'Use Photo')+'</button>'+
    '</div>'+
  '</div>';
  wrap.hidden = false;
  attachCropperGestures();
  drawCropper();
}
function closeCropper(){
  cropper = null;
  var wrap = document.getElementById('cropper-modal');
  wrap.hidden = true;
  wrap.innerHTML = '';
}
function attachCropperGestures(){
  var canvas = document.getElementById('crop-canvas');
  if (!canvas) return;
  var slider = document.getElementById('crop-zoom');
  if (slider){
    slider.addEventListener('input', function(){ setCropZoom(slider.value*1); });
  }
  var ghostSlider = document.getElementById('crop-ghost');
  if (ghostSlider){
    ghostSlider.addEventListener('input', function(){
      if (!cropper) return;
      cropper.ghostAlpha = ghostSlider.value*1;
      drawCropper();
    });
  }
  function pointerList(){
    var ids = Object.keys(cropper.pointers);
    return ids.map(function(k){ return cropper.pointers[k]; });
  }
  canvas.addEventListener('pointerdown', function(e){
    if (!cropper) return;
    e.preventDefault();
    e.stopPropagation();
    canvas.setPointerCapture(e.pointerId);
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length === 2){
      cropper.pinchDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      cropper.pinchZoom = cropper.z;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!cropper || !cropper.pointers[e.pointerId]) return;
    e.preventDefault();
    var prev = cropper.pointers[e.pointerId];
    var dx = e.clientX - prev.x;
    var dy = e.clientY - prev.y;
    cropper.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var pts = pointerList();
    if (pts.length >= 2){
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if (cropper.pinchDist > 0){
        setCropZoom(cropper.pinchZoom * (dist / cropper.pinchDist));
      }
      return;
    }
    cropper.ox += dx;
    cropper.oy += dy;
    clampCropper();
    drawCropper();
  });
  function release(e){
    if (!cropper) return;
    delete cropper.pointers[e.pointerId];
    cropper.pinchDist = 0;
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('wheel', function(e){
    if (!cropper) return;
    e.preventDefault();
    setCropZoom(cropper.z * (e.deltaY < 0 ? 1.12 : 1/1.12));
  }, { passive:false });
}
/* Re-encode only the square currently under the viewport. */
function commitCrop(){
  var c = cropper;
  if (!c) return { error:'Nothing to save.' };
  try{
    var out = document.createElement('canvas');
    out.width = AVATAR_PX;
    out.height = AVATAR_PX;
    var ctx = out.getContext('2d');
    var f = c.base * c.z;
    var sx = (-c.ox) / f;
    var sy = (-c.oy) / f;
    var sSide = c.viewW / f;
    ctx.drawImage(c.img, sx, sy, sSide, sSide, 0, 0, AVATAR_PX, AVATAR_PX);

    var q = AVATAR_QUALITY;
    var dataUrl = out.toDataURL('image/jpeg', q);
    while (dataUrlBytes(dataUrl) > AVATAR_MAX_BYTES && q > 0.4){
      q -= 0.15;
      dataUrl = out.toDataURL('image/jpeg', q);
    }
    if (!dataUrl || dataUrl.indexOf('data:image') !== 0) return { error:'Could not process that image.' };
    return { dataUrl: dataUrl, bytes: dataUrlBytes(dataUrl) };
  }catch(e){
    return { error:'Could not process that image.' };
  }
}

/* ---- Categories ---------------------------------------------------------
   plan.items is a FLAT sequence. A category entry acts as a section header;
   every exercise entry after it belongs to that category until the next
   category entry. Entries before any header are uncategorised. This keeps
   drag-and-drop to a single flat reorder instead of nested tree surgery. */

function newPlanCategory(){
  return { kind:'category', id: uid('cat'), name: 'New Category', collapsed: false };
}
function itemKind(it){ return it.kind || 'exercise'; }
/* A 'break' entry closes the category above it, so exercises can sit BELOW a
   category while staying outside it. Without it, position alone would always
   pull them back into the nearest heading above. */
function newPlanBreak(){ return { kind:'break', id: uid('brk') }; }
/* how many entries move together when this one is dragged:
   a category takes its members with it, an exercise moves alone */
function planBlockLength(items, idx){
  if (itemKind(items[idx]) !== 'category') return 1;
  var n = 1;
  for (var i=idx+1; i<items.length; i++){
    var k = itemKind(items[i]);
    if (k==='category' || k==='break') break;
    n++;
  }
  return n;
}
/* index of the category heading governing this entry, or -1 if uncategorised */
function owningCategoryIdx(items, idx){
  for (var i=idx-1; i>=0; i--){
    var k = itemKind(items[i]);
    if (k==='break') return -1;
    if (k==='category') return i;
  }
  return -1;
}
/* true when this entry is the last member of the category block it belongs to */
function isLastInCategory(items, idx){
  if (itemKind(items[idx])!=='exercise') return false;
  if (owningCategoryIdx(items, idx) === -1) return false;
  var next = items[idx+1];
  if (!next) return true;
  var nk = itemKind(next);
  return nk==='category' || nk==='break';
}
/* drop a break marker wherever it no longer separates anything */
function normalizePlanItems(items){
  var out = [];
  for (var i=0;i<items.length;i++){
    if (itemKind(items[i])!=='break'){ out.push(items[i]); continue; }
    var prev = out[out.length-1];
    if (!prev) continue;                                  /* nothing above to close */
    if (itemKind(prev)==='break') continue;               /* duplicate */
    if (owningCategoryIdx(out, out.length) === -1) continue; /* not inside a category */
    var next = items[i+1];
    if (!next) continue;                                  /* nothing below to separate */
    if (itemKind(next)==='category') continue;            /* next heading already closes it */
    out.push(items[i]);
  }
  return out;
}
function planExerciseCount(plan){
  return (plan.items||[]).filter(function(it){ return itemKind(it)==='exercise'; }).length;
}
function movePlanBlock(fromIdx, toIdx, exitCategory){
  var plan = currentPlan();
  var items = plan.items;
  var len = planBlockLength(items, fromIdx);
  if (toIdx > fromIdx && toIdx < fromIdx + len) return; /* dropped inside itself */
  var moved = items.splice(fromIdx, len);
  var dest = toIdx > fromIdx ? toIdx - len : toIdx;
  /* dropping into a category's exit zone: close the category first, so the
     item lands below the heading but outside it */
  if (exitCategory && itemKind(moved[0])!=='category'){
    items.splice(dest, 0, newPlanBreak());
    dest++;
  }
  for (var i=0;i<moved.length;i++) items.splice(dest+i, 0, moved[i]);
  plan.items = normalizePlanItems(items);
  save(); renderMain();
}

function trainedDatesSet(){
  var s = new Set();
  data.workouts.forEach(function(w){ if (w.completedAt) s.add(w.date); });
  return s;

function computeStreak(trained){
  var count=0, cursor=new Date();
  if (!trained.has(toLocalISO(cursor))) cursor.setDate(cursor.getDate()-1);
  while (trained.has(toLocalISO(cursor))) { count++; cursor.setDate(cursor.getDate()-1); }
  return count;
}
function computeThisMonthCount(){
  var now = new Date();
  return data.workouts.filter(function(w){ return w.completedAt; }).filter(function(w){
    var d = parseISO(w.date);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }).length;
}
function lastEntryFor(exerciseId, excludeWorkoutId){
  var past = data.workouts.filter(function(w){ return w.completedAt && w.id!==excludeWorkoutId && !w.excludeFromReference; })
    .sort(function(a,b){ return b.completedAt-a.completedAt; });
  for (var i=0;i<past.length;i++){
    var entry = past[i].exercises.find(function(e){ return e.exerciseId===exerciseId; });
    if (entry) return entry;
  }
  return null;
}

  if (live){
    btn.hidden = false;
    /* this runs every second - only the clock changes, so only the clock is
       rewritten; a rebuilt button loses a tap that spans the swap */
    var ipTime = fmtElapsed(Date.now()-data.activeWorkout.startedAt);
    var ipName = btn.querySelector('.ip-name'), ipTimeEl = btn.querySelector('.ip-time');
    if (ipName && ipTimeEl && ipName.textContent === data.activeWorkout.name){
      if (ipTimeEl.textContent !== ipTime) ipTimeEl.textContent = ipTime;
    } else {
      btn.innerHTML = '<span class="dot"></span><span class="ip-name">' + esc(data.activeWorkout.name) +
        '</span><span class="ip-time">' + ipTime + '</span>';
    }
  } else {
    btn.hidden = true;
  }
  /* The round button in the mobile dock resumes a live session, or starts one. */
  var fab = document.getElementById('tab-fab');
  if (fab){
    /* On the Photos pane the round button takes a photo instead - but never at
       the cost of the way back into a session that is already running. */
    var shooting = !data.activeWorkout && ui.view==='progress' && progressTab()==='photos'
                   && !ui.viewingPhotoId && !ui.compareOpen && !ui.viewingWorkoutId;
    fab.dataset.action = shooting ? 'photo-add' : (data.activeWorkout ? 'resume-workout' : 'start-blank');
    fab.classList.toggle('resuming', !!data.activeWorkout);
    fab.classList.toggle('shooting', shooting);
    var label = shooting ? 'Add a progress photo' : (data.activeWorkout ? 'Resume workout' : 'Start a workout');
    fab.title = label; fab.setAttribute('aria-label', label);
    var fabIcon = shooting ? 'camera' : 'barbell';
    if (fab.dataset.icon !== fabIcon){
      fab.dataset.icon = fabIcon;
      fab.innerHTML = shooting ? FAB_CAMERA_SVG : FAB_BARBELL_SVG;
    }
  }
}

function renderHeatmap(trainedSet, weeks, interactive){
  var countByDate = {};
  data.workouts.forEach(function(w){
    if (!w.completedAt) return;
    var c = w.exercises.reduce(function(n,e){ return n + (((e.kind||'exercise')==='exercise') ? e.sets.filter(function(s){return (s.kind||'set')==='set' && s.done;}).length : 0); },0);
    countByDate[w.date] = (countByDate[w.date]||0) + c;
  });
  var today = new Date();
  var end = new Date(today);
  end.setDate(end.getDate() + (6-end.getDay()));
  var totalDays = weeks*7;
  var start = new Date(end);
  start.setDate(start.getDate()-totalDays+1);

  var cells = '';
  for (var i=0;i<totalDays;i++){
    var d = new Date(start); d.setDate(start.getDate()+i);
    if (d > today){ cells += '<div class="heatmap-cell" style="visibility:hidden"></div>'; continue; }
    var iso = toLocalISO(d);
    var cnt = countByDate[iso] || 0;
    var level = cnt>0 ? (cnt>=12?4:cnt>=8?3:cnt>=4?2:1) : 0;
    var isToday = iso===toLocalISO(today);
    var isSelected = interactive && ui.historyFilterDate===iso;
    var cls = 'heatmap-cell' + (isToday?' today':'') + (isSelected?' selected':'');
    var titleTxt = iso + (cnt ? ': '+cnt+' sets' : '');
    if (interactive){
      cells += '<button class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'" data-action="heatmap-day-click" data-date="'+iso+'"></button>';
    } else {
      cells += '<div class="'+cls+'" data-level="'+level+'" title="'+titleTxt+'"></div>';
    }
  }
  return '<div class="heatmap-wrap"><div class="heatmap">'+cells+'</div></div>'+
    '<div class="heatmap-legend"><span>Less</span>'+
    '<div class="heatmap-cell" data-level="0"></div><div class="heatmap-cell" data-level="1"></div>'+
    '<div class="heatmap-cell" data-level="2"></div><div class="heatmap-cell" data-level="3"></div>'+
    '<div class="heatmap-cell" data-level="4"></div><span>More</span></div>';
}

  for (var i=idx+1; i<plan.items.length; i++){

    '<button class="drag-handle" title="Drag to reorder">'+icon('grip')+'</button>'+

    '<input class="cat-name" data-commit="plan-category-name" data-idx="'+idx+'" value="'+esc(entry.name)+'">'+

}

/* ---- plan exercise card: mirrors the active-workout card, but edits
   TARGET values/rests (a preset) rather than logging actual performance.
   No "done" column and no last-session placeholders here — those only
   make sense once you're actually logging. ---- */

function renderPlanDefaultRest(idx, item){
  if (ui.editingPlanRest === idx){
    return '<div class="ex-default-rest"><span>Default rest:</span>'+
      '<input id="plan-rest-input" type="number" min="0" step="5" placeholder="sec" value="'+(item.defaultRestSec==null?'':item.defaultRestSec)+'" data-action-enter="commit-plan-rest" data-idx="'+idx+'">'+
      '<button class="rest-icon-btn" data-action="commit-plan-rest" data-idx="'+idx+'">'+icon('check')+'</button></div>';
  }
  return '<div class="ex-default-rest"><span>Default Rest: '+(item.defaultRestSec!=null?fmtRest(item.defaultRestSec):'not set')+'</span>'+
    '<button data-action="edit-plan-rest" data-idx="'+idx+'">Edit</button>'+
    (item.defaultRestSec!=null?('<button data-action="clear-plan-rest" data-idx="'+idx+'">Clear</button>'):'')+
  '</div>';
}
function planEffectiveRest(item, set){
  if (set.restSec!==null && set.restSec!==undefined) return set.restSec;
  if (item.defaultRestSec!==null && item.defaultRestSec!==undefined) return item.defaultRestSec;
  return null;
}
function renderPlanRestCell(idx, sIdx, item, set){
  var eff = planEffectiveRest(item, set);
  var isCustom = set.restSec!==null && set.restSec!==undefined;
  if (ui.editingPlanSetRest === (idx+'-'+sIdx)){
    return '<div class="rest-cell">'+
      '<input id="plan-set-rest-input" class="num-input" style="max-width:60px;min-width:50px" type="number" min="0" step="5" placeholder="sec" value="'+(isCustom?set.restSec:(item.defaultRestSec==null?'':item.defaultRestSec))+'" data-action-enter="plan-commit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+
      '<button class="rest-icon-btn" data-action="plan-commit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('check')+'</button>'+
    '</div>';
  }
  if (eff!==null){
    return '<div class="rest-cell">'+
      '<button class="rest-pill '+(isCustom?'custom':'')+'" data-action="plan-edit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">'+fmtRest(eff)+'</button>'+
      (isCustom?('<button class="rest-icon-btn" data-action="plan-clear-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'" title="Use default">'+icon('x')+'</button>'):'')+
    '</div>';
  }
  return '<div class="rest-cell"><button class="rest-add" data-action="plan-edit-set-rest" data-idx="'+idx+'" data-set="'+sIdx+'">+ Add rest</button></div>';
}
function renderPlanRestBlockRow(idx, sIdx, block, fieldCount){
  var colspan = fieldCount + 2;
  var editing = ui.editingPlanRestBlock === (idx+'-'+sIdx);
  var body;
  if (editing){
    body = '<input id="planrestblock-edit-input" class="num-input" style="max-width:70px;min-width:56px;display:inline-block;" type="number" min="0" step="5" placeholder="sec" value="'+(block.seconds==null?'':block.seconds)+'" data-action-enter="plan-commit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+
      '<button class="rest-icon-btn" data-action="plan-commit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+icon('check')+'</button>';
  } else {
    body = '<span style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-right:6px;">Rest</span>'+
      '<button class="rest-pill custom" data-action="plan-edit-rest-block" data-idx="'+idx+'" data-set="'+sIdx+'">'+fmtRest(block.seconds)+'</button>';
